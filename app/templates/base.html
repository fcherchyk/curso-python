<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ curso.titulo if curso else "Cursos" }} · Cursos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/codemirror/codemirror.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ V }}">
  <link rel="stylesheet" href="/pygments.css">
  <script src="{{ url_for('static', path='vendor/htmx/htmx.min.js') }}" defer></script>
  {% block cabecera %}{% endblock %}
</head>
<body>
  <header class="barra">
    <a class="marca" href="/{{ curso.slug if curso else '' }}"><span class="marca-logo">{{ '{ }' }}</span> Cursos</a>
    {% if cursos | length > 1 %}
    <nav class="solapas" aria-label="Cursos">
      {% for c in cursos %}
      <a href="/{{ c.slug }}" class="solapa {{ 'activa' if curso and c.slug == curso.slug }}"
         {% if curso and c.slug == curso.slug %}aria-current="page"{% endif %}>{{ c.titulo }}</a>
      {% endfor %}
    </nav>
    {% endif %}
    {% block barra %}{% endblock %}
  </header>
  {% block contenido %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
