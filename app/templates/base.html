<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Curso de Python{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ V }}">
  <link rel="stylesheet" href="/pygments.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  {% block cabecera %}{% endblock %}
</head>
<body>
  <header class="barra">
    <a class="marca" href="/"><span class="marca-logo">py</span> Curso de Python</a>
    {% block barra %}{% endblock %}
  </header>
  {% block contenido %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
