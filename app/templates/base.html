<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ course.title if course else "Courses" }} · Courses{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/codemirror/codemirror.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ V }}">
  <link rel="stylesheet" href="/pygments.css">
  <script src="{{ url_for('static', path='vendor/htmx/htmx.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/{{ course.slug if course else '' }}"><span class="brand-logo">{{ '{ }' }}</span> Courses</a>
    {% if courses | length > 1 %}
    <nav class="course-tabs" aria-label="Courses">
      {% for c in courses %}
      <a href="/{{ c.slug }}" class="course-tab {{ 'active' if course and c.slug == course.slug }}"
         {% if course and c.slug == course.slug %}aria-current="page"{% endif %}>{{ c.title }}</a>
      {% endfor %}
    </nav>
    {% endif %}
    {% block topbar %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
