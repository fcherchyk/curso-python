{% macro paso(ok, etiqueta) -%}
<span class="paso {{ 'paso-ok' if ok }}" title="{{ etiqueta }}{{ ': listo' if ok else ': pendiente' }}">
  {%- if ok %}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>{% endif -%}
  {{ etiqueta }}
</span>
{%- endmacro %}

{% macro marca_tab(id, ok, oob=false) -%}
<span id="{{ id }}" class="tab-marca {{ 'tab-marca-ok' if ok }}" {% if oob %}hx-swap-oob="true"{% endif %} aria-label="{{ 'listo' if ok else 'pendiente' }}"></span>
{%- endmacro %}

{% macro boton_resuelto(cap, paso, ok, oob=false) -%}
<button type="button" id="resuelto-{{ paso }}" class="boton {{ 'boton-hecho' if ok else 'boton-texto' }}"
        hx-post="/c/{{ cap.id }}/{{ paso }}/resuelto" hx-swap="outerHTML"
        title="{{ 'Desmarcar' if ok else 'Dar este paso por resuelto sin hacerlo' }}"
        {% if oob %}hx-swap-oob="true"{% endif %}>
  {% if ok %}✓ Resuelto{% else %}Marcar como resuelto{% endif %}
</button>
{%- endmacro %}
