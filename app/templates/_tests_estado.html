{% if estado.tests_ok %}
<p class="nota nota-ok">Ejercicio resuelto. Podés volver a correr los tests o
  <button class="enlace" hx-get="/c/{{ cap.id }}/solucion" hx-target="#solucion">ver la solución de referencia</button>.</p>
<div id="solucion"></div>
{% else %}
<p class="nota">Completá las funciones de <code>ejercicio.py</code> (las consignas están en
  los docstrings) y corré los tests.</p>
{% endif %}
