[project]
name = "curso-python"
version = "0.1.0"
description = "Curso de Python: app web con lecciones, cuestionarios y ejercicios con tests"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pygments>=2.21.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["semana1", "tests"]
# contenido/ tiene tests de ejercicios que solo se corren a través de la app (tests/test_contenido.py).
norecursedirs = ["contenido", ".*", "__pycache__"]
addopts = "-q"
filterwarnings = ["ignore:.*install `httpx2`"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Código inicial con errores de lint a propósito (el ejercicio es corregirlos).
extend-exclude = ["contenido/python/07-herramientas/02-ruff-y-mypy/ejercicio.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Las consignas de los ejercicios a veces necesitan líneas largas.
"contenido/**" = ["E501"]
# En los tests de Django, los imports van después de configurar settings.
"contenido/python/10-django/**/test_ejercicio.py" = ["E402"]
# matplotlib.use("Agg") tiene que ir antes de importar pyplot.
"contenido/python/1[34]-*/**/test_ejercicio.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
