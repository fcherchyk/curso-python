[project]
name = "curso-python"
version = "0.1.0"
description = "Local web app for learning Python: lessons, quizzes and coding exercises checked by tests"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pygments>=2.21.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["week1", "tests"]
# content/ holds exercise tests that only run through the app (tests/test_content.py).
norecursedirs = ["content", ".*", "__pycache__"]
addopts = "-q"
filterwarnings = ["ignore:.*install `httpx2`"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Starter code with deliberate lint errors (the exercise is to fix them).
extend-exclude = ["content/python/07-tooling/02-ruff-and-mypy/exercise.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Exercise instructions sometimes need long lines.
"content/**" = ["E501"]
# In the Django tests, imports come after configuring settings.
"content/python/10-django/**/test_exercise.py" = ["E402"]
# matplotlib.use("Agg") has to run before importing pyplot.
"content/python/1[34]-*/**/test_exercise.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
