[[preguntas]]
texto = "¿Por qué hay que escribir `s = append(s, x)` y no solo `append(s, x)`?"
opciones = [
  "Por estilo, no cambia nada",
  "Porque `append` puede alocar un array nuevo y devuelve el slice actualizado",
  "Porque `append` no modifica nada nunca",
  "Porque si no, no compila por un error de sintaxis",
]
correcta = 1
explicacion = "Si no hay capacidad, `append` crea un array nuevo. Además, el `len` del slice viejo no cambia. (De hecho, no usar el resultado de `append` es un error de compilación.)"

[[preguntas]]
texto = "Con `s := []int{1, 2, 3}; a := s[0:2]; a[0] = 9`, ¿cuánto vale `s`?"
opciones = ["`[1 2 3]`", "`[9 2 3]`", "`[9 2]`", "Error"]
correcta = 1
explicacion = "Rebanar no copia: `a` es una ventana sobre el mismo array que `s`."

[[preguntas]]
texto = "¿Qué devuelve `len` y `cap` de `make([]int, 0, 10)`?"
opciones = ["len 10, cap 10", "len 0, cap 10", "len 0, cap 0", "len 10, cap 0"]
correcta = 1
explicacion = "El segundo argumento es el largo y el tercero la capacidad reservada: un slice vacío con lugar para 10 elementos."

[[preguntas]]
texto = "¿Cuál es la forma correcta de preguntar si un slice está vacío?"
opciones = ["`s == nil`", "`len(s) == 0`", "`!s`", "`s == []int{}`"]
correcta = 1
explicacion = "Un slice vacío no-nil (`[]int{}`) da false con `s == nil`. `len(s) == 0` cubre los dos casos. Y `s == []int{}` ni siquiera compila: los slices solo se comparan con nil."

[[preguntas]]
texto = "¿Cómo obtenés una copia independiente de un slice?"
opciones = ["`c := s`", "`c := s[:]`", "`c := slices.Clone(s)`", "`c := &s`"]
correcta = 2
explicacion = "Asignar o rebanar comparten memoria. `slices.Clone` (o `append([]T(nil), s...)`) crea un array nuevo."
