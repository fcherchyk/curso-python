[[preguntas]]
texto = "¿Qué valor tiene `var s string` si no le asignás nada?"
opciones = ["`nil`", "`\"\"` (string vacío)", "Es un error de compilación", "`undefined`"]
correcta = 1
explicacion = "Toda variable recibe el zero value de su tipo. Para `string` es el string vacío; `nil` es solo para punteros, slices, maps, funciones, interfaces y channels."

[[preguntas]]
texto = "Con `a := 10` y `b := 2.5`, ¿qué pasa con `a * b`?"
opciones = ["Da `25.0`", "Da `25`", "Error de compilación: tipos distintos", "Da `20`"]
correcta = 2
explicacion = "Go no convierte tipos implícitamente. Hay que escribir `float64(a) * b`."

[[preguntas]]
texto = "¿Qué devuelve `string(rune(65))`?"
opciones = ["`\"65\"`", "`\"A\"`", "Error de compilación", "`65`"]
correcta = 1
explicacion = "Convertir un número a string lo interpreta como code point Unicode. Para obtener `\"65\"` se usa `strconv.Itoa(65)`."

[[preguntas]]
texto = "¿Dónde se puede usar `x := 5`?"
opciones = [
  "En cualquier lugar",
  "Solo dentro de funciones",
  "Solo a nivel de paquete",
  "Solo con constantes",
]
correcta = 1
explicacion = "La declaración corta `:=` solo existe dentro de funciones. A nivel de paquete hay que usar `var`."

[[preguntas]]
texto = "En un paquete, ¿qué diferencia hay entre `func Calcular()` y `func calcular()`?"
opciones = [
  "Ninguna, Go no distingue mayúsculas",
  "`Calcular` se exporta fuera del paquete y `calcular` es privada",
  "`calcular` es un error de sintaxis",
  "`Calcular` es un método y `calcular` una función",
]
correcta = 1
explicacion = "La visibilidad en Go la decide la primera letra del nombre: mayúscula exporta, minúscula es privada del paquete."
