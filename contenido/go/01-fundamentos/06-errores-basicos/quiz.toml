[[preguntas]]
texto = "¿Qué significa que una función devuelva `(Usuario{}, nil)`?"
opciones = [
  "Que falló y el usuario está vacío",
  "Que salió bien: el error `nil` significa \"sin error\"",
  "Que el usuario no existe",
  "Es un error de compilación",
]
correcta = 1
explicacion = "Por convención, `err == nil` indica éxito. Si `err != nil`, los otros valores no se usan."

[[preguntas]]
texto = "¿Qué hace `%w` en `fmt.Errorf(\"cargando: %w\", err)`?"
opciones = [
  "Formatea el error en ancho fijo",
  "Envuelve `err`: agrega contexto y lo conserva para `errors.Is`/`errors.As`",
  "Imprime un warning",
  "Descarta el error original",
]
correcta = 1
explicacion = "`%w` crea un error nuevo que contiene al original. Es el equivalente de `raise ... from e`."

[[preguntas]]
texto = "¿Por qué se prefiere `errors.Is(err, ErrNoEncontrado)` a `err == ErrNoEncontrado`?"
opciones = [
  "Porque `==` no funciona con interfaces",
  "Porque `errors.Is` también encuentra el centinela cuando está envuelto con `%w`",
  "Porque es más rápido",
  "No hay diferencia",
]
correcta = 1
explicacion = "Si alguna capa envolvió el error para agregar contexto, `==` da false. `errors.Is` recorre la cadena de envoltorios."

[[preguntas]]
texto = "¿Cuál es el estilo recomendado para los mensajes de error en Go?"
opciones = [
  "\"Error: No se encontró el usuario.\"",
  "\"usuario no encontrado\" (minúscula, sin punto final)",
  "\"USUARIO_NO_ENCONTRADO\"",
  "Cualquiera",
]
correcta = 1
explicacion = "Los errores se concatenan en cadenas (`cargando: leyendo: usuario no encontrado`). La minúscula y la falta de punto final hacen que el resultado se lea bien."

[[preguntas]]
texto = "¿Cuándo es apropiado usar `panic` en una librería?"
opciones = [
  "Cuando el usuario pasa un argumento inválido",
  "Casi nunca: para errores esperados se devuelve `error`; `panic` es para bugs o invariantes imposibles",
  "Siempre que falla una operación de E/S",
  "Para reemplazar los `if err != nil`",
]
correcta = 1
explicacion = "Quien usa tu librería espera manejar los errores como valores. Un panic lo obliga a usar `recover` y rompe el estilo del lenguaje."
