[[preguntas]]
texto = "¿Cómo se pasa un slice `xs` a una función `func f(nums ...int)`?"
opciones = ["`f(xs)`", "`f(xs...)`", "`f(*xs)`", "`f(...xs)`"]
correcta = 1
explicacion = "Los tres puntos después del slice lo expanden como argumentos variádicos, como `*xs` en Python."

[[preguntas]]
texto = "¿Qué imprime `defer fmt.Println(\"a\"); defer fmt.Println(\"b\"); fmt.Println(\"c\")`?"
opciones = ["a b c", "c a b", "c b a", "b a c"]
correcta = 2
explicacion = "Primero se ejecuta el cuerpo (`c`) y al salir los defer en orden LIFO: último en entrar, primero en salir (`b`, después `a`)."

[[preguntas]]
texto = "Una closure en Go quiere incrementar una variable del scope externo. ¿Qué necesita?"
opciones = [
  "Declararla con `nonlocal`",
  "Nada: las closures pueden leer y modificar las variables capturadas",
  "Pasarla por puntero",
  "Declararla como global",
]
correcta = 1
explicacion = "En Go no existe `nonlocal`: la closure captura la variable y puede modificarla directamente."

[[preguntas]]
texto = "¿Cuál es la forma idiomática de simular argumentos con nombre y defaults?"
opciones = [
  "Sobrecargar la función",
  "Recibir un struct de configuración (o functional options)",
  "Usar `**kwargs`",
  "Declarar parámetros opcionales con `?`",
]
correcta = 1
explicacion = "Go no tiene defaults ni argumentos por nombre. Un struct con campos nombrados (`Config{Host: \"x\"}`) cumple ese rol, y sus zero values hacen de defaults."

[[preguntas]]
texto = "¿Cuándo se evalúan los argumentos de `defer log(x)`?"
opciones = [
  "Al retornar la función",
  "En el momento en que se ejecuta la línea del `defer`",
  "Nunca: `defer` no admite argumentos",
  "Cuando ocurre un panic",
]
correcta = 1
explicacion = "La llamada se posterga, pero sus argumentos se evalúan en el momento del `defer`. Si `x` cambia después, se loguea el valor viejo."
