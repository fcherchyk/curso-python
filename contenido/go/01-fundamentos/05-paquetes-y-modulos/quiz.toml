[[preguntas]]
texto = "¿Qué pasa si importás `\"os\"` y no lo usás?"
opciones = ["Un warning", "No compila", "Se ignora", "Se importa igual pero más lento"]
correcta = 1
explicacion = "En Go, los imports y las variables locales sin usar son errores de compilación. Las herramientas como goimports los manejan al guardar."

[[preguntas]]
texto = "Dos archivos `.go` en la misma carpeta con `package pedidos`: ¿cómo usa uno una función del otro?"
opciones = [
  "Importándolo con una ruta relativa",
  "Directamente: pertenecen al mismo paquete y comparten el scope",
  "Con `from . import`",
  "No se puede",
]
correcta = 1
explicacion = "El paquete es la carpeta completa: todos sus archivos ven todos los identificadores del paquete, exportados o no."

[[preguntas]]
texto = "¿Para qué sirve una carpeta `internal/`?"
opciones = [
  "Para tests",
  "Para que sus paquetes solo se puedan importar desde el árbol que la contiene",
  "Para archivos generados",
  "Es solo una convención sin efecto",
]
correcta = 1
explicacion = "El compilador hace cumplir la regla: los paquetes bajo `internal/` no son importables desde otros módulos."

[[preguntas]]
texto = "¿Qué hace `go mod tidy`?"
opciones = [
  "Formatea el código",
  "Agrega las dependencias que faltan y saca las que no se usan en go.mod/go.sum",
  "Actualiza todas las dependencias a la última versión",
  "Borra el caché de módulos",
]
correcta = 1
explicacion = "Sincroniza `go.mod` y `go.sum` con los imports reales del código."

[[preguntas]]
texto = "El paquete `a` importa `b`, y `b` necesita algo de `a`. ¿Qué pasa si `b` importa `a`?"
opciones = [
  "Funciona si no hay código en `init()`",
  "No compila: los ciclos de imports están prohibidos",
  "Funciona con un alias",
  "Da un error solo al ejecutar",
]
correcta = 1
explicacion = "Go prohíbe los ciclos. La solución habitual es mover lo compartido a un tercer paquete o definir una interfaz del lado que la consume."
