[[preguntas]]
texto = "Con `def f(x, acc=[]): acc.append(x); return acc`, ¿qué devuelve la segunda llamada `f(2)` después de `f(1)`?"
opciones = ["`[2]`", "`[1, 2]`", "`[]`", "Levanta `TypeError`"]
correcta = 1
explicacion = "El default se evalúa una sola vez, al definir la función: todas las llamadas comparten la misma lista."

[[preguntas]]
texto = "Con `def exportar(datos, *, comprimir=False)`, ¿qué pasa con `exportar(filas, True)`?"
opciones = [
  "Funciona: `comprimir` vale `True`",
  "Levanta `TypeError`",
  "`True` se ignora",
  "`datos` pasa a valer `True`",
]
correcta = 1
explicacion = "Todo lo que va después de `*` es solo keyword: hay que escribir `comprimir=True`."

[[preguntas]]
texto = "Dentro de `def f(*args, **kwargs)`, ¿de qué tipo son `args` y `kwargs`?"
opciones = ["lista y dict", "tupla y dict", "tupla y lista", "lista y lista"]
correcta = 1
explicacion = "`*args` junta los posicionales sobrantes en una tupla y `**kwargs` los keyword sobrantes en un dict."

[[preguntas]]
texto = "Con `def distancia(a, b, /)`, ¿cuál llamada es válida?"
opciones = ["`distancia(a=1, b=2)`", "`distancia(1, b=2)`", "`distancia(1, 2)`", "Ninguna"]
correcta = 2
explicacion = "Los parámetros antes de `/` son solo posicionales: no se pueden pasar por nombre."

[[preguntas]]
texto = "¿Qué devuelve una función que termina sin `return`?"
opciones = ["`0`", "`None`", "`False`", "El valor de la última expresión"]
correcta = 1
explicacion = "Toda función devuelve algo; si no hay `return` (o hay un `return` sin valor), devuelve `None`."
