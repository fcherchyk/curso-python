[[preguntas]]
texto = "Definís `__eq__` en una clase y no definís `__hash__`. ¿Qué pasa al hacer `{obj}`?"
opciones = [
  "Funciona, con el hash por identidad",
  "Levanta `TypeError: unhashable type`",
  "Usa `__eq__` para calcular el hash",
  "Devuelve un set vacío",
]
correcta = 1
explicacion = "Al definir `__eq__`, Python pone `__hash__ = None` para no romper la regla \"iguales implica mismo hash\". Hay que definir `__hash__` explícitamente."

[[preguntas]]
texto = "¿Qué debería devolver `__add__` si recibe un tipo que no sabe sumar?"
opciones = ["`None`", "`NotImplemented`", "Levantar `NotImplementedError`", "`False`"]
correcta = 1
explicacion = "`NotImplemented` le avisa a Python que pruebe con el método reflejado del otro operando (`__radd__`). Si nadie puede, Python levanta `TypeError`."

[[preguntas]]
texto = "¿Qué se ve al hacer `print([p])` si `p` tiene `__repr__` y `__str__` distintos?"
opciones = [
  "El `__str__` de `p`",
  "El `__repr__` de `p`",
  "`<Punto object at …>`",
  "Levanta `TypeError`",
]
correcta = 1
explicacion = "Los contenedores muestran el `repr` de sus elementos, aunque el contenedor se imprima con `str`."

[[preguntas]]
texto = "¿Qué método hace falta para que funcione `3 * v`, si `v` es tu Vector?"
opciones = ["`__mul__`", "`__rmul__`", "`__imul__`", "`__pow__`"]
correcta = 1
explicacion = "`int.__mul__(3, v)` devuelve `NotImplemented`, así que Python prueba `v.__rmul__(3)`, que maneja el caso en que tu objeto es el operando derecho."

[[preguntas]]
texto = "Una clase implementa solo `__len__` y `__getitem__` con índices. ¿Qué **no** funciona automáticamente?"
opciones = ["`for x in obj`", "`x in obj`", "`obj[1:3]`", "`obj + obj`"]
correcta = 3
explicacion = "La iteración, `in` y el slicing (si delegás en una lista) salen de `__getitem__`. El `+` necesita `__add__`."
