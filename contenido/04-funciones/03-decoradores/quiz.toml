[[preguntas]]
texto = "¿A qué equivale `@deco` sobre `def f(): ...`?"
opciones = ["`f = deco`", "`f = deco(f)`", "`f = deco(f())`", "`deco = f(deco)`"]
correcta = 1
explicacion = "El decorador recibe la función y lo que devuelve reemplaza al nombre original."

[[preguntas]]
texto = "Un decorador sin `functools.wraps`: ¿qué devuelve `funcion_decorada.__name__`?"
opciones = [
  "El nombre original",
  "El nombre de la función interna, por ejemplo `'wrapper'`",
  "`None`",
  "Levanta `AttributeError`",
]
correcta = 1
explicacion = "Sin `wraps`, lo que queda es el wrapper con sus propios metadatos. `wraps` copia `__name__`, `__doc__` y los demás desde la original."

[[preguntas]]
texto = "Una función decorada empezó a devolver `None` en lugar de su resultado. ¿Cuál es la causa más probable?"
opciones = [
  "Falta `functools.wraps`",
  "El wrapper llama a `func(*args, **kwargs)` pero no hace `return` del resultado",
  "Faltan los `**kwargs`",
  "El decorador se aplicó dos veces",
]
correcta = 1
explicacion = "El wrapper tiene que devolver lo que devuelve la función original. Si no lo hace, devuelve `None`."

[[preguntas]]
texto = "Con `@a` arriba y `@b` abajo, sobre `def f`, ¿qué se obtiene?"
opciones = ["`f = b(a(f))`", "`f = a(b(f))`", "`f = a(f); f = b(f)` en paralelo", "Error: no se pueden apilar"]
correcta = 1
explicacion = "Se aplican de abajo hacia arriba: primero `b`, y el resultado se le pasa a `a`."

[[preguntas]]
texto = "¿Qué requisito tienen los argumentos de una función decorada con `@functools.cache`?"
opciones = [
  "Tienen que ser números",
  "Tienen que ser hashables",
  "Tienen que pasarse por nombre",
  "Ninguno",
]
correcta = 1
explicacion = "Los argumentos forman la clave del diccionario del caché, así que tienen que ser hashables. Una lista como argumento levanta `TypeError`."
