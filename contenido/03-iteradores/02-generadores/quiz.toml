[[preguntas]]
texto = "Si `def f(): print(\"hola\"); yield 1`, ¿qué imprime `g = f()`?"
opciones = ["`hola`", "Nada", "`1`", "`hola` y `1`"]
correcta = 1
explicacion = "Llamar a una función generadora solo crea el generador. El cuerpo empieza a correr en el primer `next()`."

[[preguntas]]
texto = "¿Qué hace `yield from sub`?"
opciones = [
  "Devuelve `sub` entero como un solo valor",
  "Produce uno por uno los elementos de `sub`",
  "Convierte `sub` en lista",
  "Termina el generador",
]
correcta = 1
explicacion = "Delega en `sub` y produce cada uno de sus elementos. Equivale a `for x in sub: yield x`."

[[preguntas]]
texto = "¿Por qué `sum(x * x for x in range(10**8))` usa memoria constante?"
opciones = [
  "Porque `sum` es una función built-in",
  "Porque el generador produce un valor a la vez y nunca arma la lista completa",
  "Porque Python comprime los enteros",
  "No es cierto: usa la misma memoria que una lista",
]
correcta = 1
explicacion = "La generator expression es perezosa: `sum` pide un valor, lo acumula y pide el siguiente. En ningún momento existen los 10⁸ valores juntos."

[[preguntas]]
texto = "¿En qué caso conviene devolver una **lista** en lugar de un generador?"
opciones = [
  "Cuando los datos son infinitos",
  "Cuando vas a recorrer el resultado varias veces o necesitás `len()`",
  "Cuando los datos no entran en memoria",
  "Cuando querés procesar un archivo línea por línea",
]
correcta = 1
explicacion = "Un generador se consume una vez y no tiene `len()`, índices ni slicing. Si necesitás eso, devolvé una lista."

[[preguntas]]
texto = "Un generador abre un archivo con `with`. Si el consumidor hace `break` en la primera línea, ¿qué pasa con el archivo?"
opciones = [
  "Queda abierto hasta que termine el programa",
  "Se cierra cuando el generador se cierra o se destruye",
  "Levanta `RuntimeError`",
  "Se lee completo igual",
]
correcta = 1
explicacion = "Al cerrarse el generador (`close()`, que se llama también al destruirlo), se ejecuta la salida del `with` y el archivo se cierra."
