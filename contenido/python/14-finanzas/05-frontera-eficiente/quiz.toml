[[preguntas]]
texto = "¿Qué es la frontera eficiente?"
opciones = [
  "El portafolio con mayor retorno",
  "El conjunto de portafolios con el máximo retorno posible para cada nivel de riesgo",
  "Los portafolios con Sharpe mayor que 1",
  "El portafolio de pesos iguales",
]
correcta = 1
explicacion = "Es el borde superior de la nube riesgo-retorno. Por debajo, siempre hay otro portafolio mejor con el mismo riesgo."

[[preguntas]]
texto = "¿Para qué sirve `keepdims=True` en `W /= W.sum(axis=1, keepdims=True)`?"
opciones = [
  "Para no modificar W",
  "Para que la suma quede con forma (n, 1) y el broadcasting divida cada fila por su suma",
  "Para ordenar las filas",
  "Para que sea más rápido",
]
correcta = 1
explicacion = "Sin keepdims, la suma tiene forma (n,) y no se alinea con las filas de una matriz (n, 4)."

[[preguntas]]
texto = "¿Qué calcula `np.einsum('ij,jk,ik->i', W, cov, W)`?"
opciones = [
  "El retorno de cada portafolio",
  "La varianza wᵀΣw de cada portafolio (cada fila de W)",
  "La covarianza entre portafolios",
  "La suma de los pesos",
]
correcta = 1
explicacion = "Para cada fila i, suma W[i,j]·cov[j,k]·W[i,k] sobre j y k: la forma cuadrática fila por fila."

[[preguntas]]
texto = "¿Por qué es importante fijar la semilla en la simulación?"
opciones = [
  "Para que los resultados sean reproducibles (y testeables)",
  "Para que el resultado sea más óptimo",
  "Porque numpy lo exige",
  "Para que sea más rápido",
]
correcta = 0
explicacion = "La misma semilla genera los mismos números. Así podés repetir el análisis y comparar los cambios."

[[preguntas]]
texto = "¿Cuál es la principal crítica a la optimización de Markowitz en la práctica?"
opciones = [
  "Es muy lenta",
  "Es muy sensible a los errores de estimación de los retornos esperados: los pesos cambian mucho con otros datos",
  "No admite más de 4 activos",
  "Ignora la volatilidad",
]
correcta = 1
explicacion = "Pequeños cambios en los retornos esperados (que se estiman muy mal) producen pesos óptimos muy distintos y concentrados."
