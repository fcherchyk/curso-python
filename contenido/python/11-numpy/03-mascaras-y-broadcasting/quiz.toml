[[preguntas]]
texto = "¿Por qué `v[v > 0 and v < 5]` falla?"
opciones = [
  "Porque las máscaras no existen",
  "Porque `and` intenta convertir un array a un solo bool; hay que usar `(v > 0) & (v < 5)`",
  "Porque falta `np.where`",
  "No falla",
]
correcta = 1
explicacion = "Con arrays se usan los operadores bit a bit `&`, `|` y `~`, y con paréntesis por la precedencia."

[[preguntas]]
texto = "¿Qué devuelve `(np.array([3, -1, 4, -5]) < 0).sum()`?"
opciones = ["`-6`", "`2`", "`[False True False True]`", "`True`"]
correcta = 1
explicacion = "La máscara tiene dos `True`, y al sumar, `True` cuenta como 1."

[[preguntas]]
texto = "¿Son compatibles para broadcasting las formas `(4, 3)` y `(3,)`?"
opciones = [
  "No, tienen distinta cantidad de dimensiones",
  "Sí: `(3,)` se trata como `(1, 3)` y se estira a `(4, 3)`",
  "Solo con `keepdims=True`",
  "Solo si son de tipo float",
]
correcta = 1
explicacion = "Se comparan desde la derecha: 3 con 3 es igual, y la dimensión faltante cuenta como 1."

[[preguntas]]
texto = "Con `m` de forma `(5, 3)`, ¿qué forma tiene `m.mean(axis=1, keepdims=True)`?"
opciones = ["`(5,)`", "`(5, 1)`", "`(1, 3)`", "`(3,)`"]
correcta = 1
explicacion = "Se reduce el eje 1 (las columnas), pero `keepdims` lo conserva con tamaño 1. Así se puede restar a `m` fila por fila."

[[preguntas]]
texto = "¿Qué devuelve `np.argmax(np.array([7, 2, 9, 4]))`?"
opciones = ["`9`", "`2`", "`3`", "`[False, False, True, False]`"]
correcta = 1
explicacion = "`argmax` devuelve la **posición** del máximo (índice 2), no el valor. Sirve para buscar en un array paralelo (`nombres[np.argmax(ventas)]`)."
