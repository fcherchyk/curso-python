[[preguntas]]
texto = "¿Qué `dtype` tiene `np.array([1, 2, 3.5])`?"
opciones = ["`int64`", "`float64`", "`object`", "Mezclado: dos int y un float"]
correcta = 1
explicacion = "Un array tiene un solo tipo. Al mezclar enteros y floats, NumPy elige el más general: `float64`."

[[preguntas]]
texto = "Con `v = np.arange(5); s = v[1:3]; s[0] = 99`, ¿cuánto vale `v`?"
opciones = ["`[0 1 2 3 4]`", "`[0 99 2 3 4]`", "`[99 1 2 3 4]`", "Error"]
correcta = 1
explicacion = "Los slices de NumPy son vistas sobre los mismos datos. Para un slice independiente, `.copy()`."

[[preguntas]]
texto = "¿Qué `shape` tiene `np.zeros((2, 3)).T`?"
opciones = ["`(2, 3)`", "`(3, 2)`", "`(6,)`", "`(3,)`"]
correcta = 1
explicacion = "`.T` transpone: las filas pasan a ser columnas."

[[preguntas]]
texto = "¿Qué hace `-1` en `a.reshape(-1, 4)`?"
opciones = [
  "Invierte el array",
  "Le pide a NumPy que calcule esa dimensión para que entren todos los elementos",
  "Elimina la última fila",
  "Es un error",
]
correcta = 1
explicacion = "Con 12 elementos, `reshape(-1, 4)` da `(3, 4)`. Solo una dimensión puede ser -1."

[[preguntas]]
texto = "¿Cuál es la forma correcta de acceder a la fila 1, columna 2 de una matriz NumPy?"
opciones = ["`m[1][2]` (la única forma)", "`m[1, 2]`", "`m(1, 2)`", "`m.get(1, 2)`"]
correcta = 1
explicacion = "`m[1][2]` también funciona, pero crea una vista intermedia. `m[1, 2]` es la forma idiomática y más eficiente, y además permite `m[:, 2]`."
