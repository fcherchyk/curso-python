[[preguntas]]
texto = "¿Qué método sobrescribís en una `ListView` para filtrar según `?q=` del request?"
opciones = ["`get_context_data`", "`get_queryset`", "`as_view`", "`dispatch`"]
correcta = 1
explicacion = "`get_queryset` decide qué objetos se listan. `get_context_data` agrega variables a la plantilla."

[[preguntas]]
texto = "¿Por qué `success_url = reverse_lazy(\"lista\")` y no `reverse(\"lista\")`?"
opciones = [
  "Porque `reverse` está deprecado",
  "Porque el atributo se evalúa al definir la clase, antes de que las URLs estén cargadas; `reverse_lazy` lo resuelve recién al usarse",
  "Porque es más rápido",
  "No hay diferencia",
]
correcta = 1
explicacion = "`reverse` en un atributo de clase puede fallar por import circular o porque las URLs no están listas. `reverse_lazy` difiere la resolución."

[[preguntas]]
texto = "Una `CreateView` recibe un POST con datos inválidos. ¿Qué hace?"
opciones = [
  "Responde 400 en JSON",
  "Vuelve a renderizar el formulario con los errores",
  "Redirige a `success_url`",
  "Levanta una excepción",
]
correcta = 1
explicacion = "Implementa el patrón completo: si es válido, guarda y redirige; si no, re-renderiza el form con los errores (`form_invalid`)."

[[preguntas]]
texto = "Con `paginate_by = 10` en una `ListView`, ¿cómo se pide la segunda página?"
opciones = ["`/libros/2/`", "`/libros/?page=2`", "`/libros/?pagina=2`", "No se puede"]
correcta = 1
explicacion = "El parámetro por defecto es `page`. La plantilla recibe `page_obj` y `paginator` para armar la navegación."

[[preguntas]]
texto = "¿Qué controla `list_display` en un `ModelAdmin`?"
opciones = [
  "Los campos del formulario de edición",
  "Las columnas que se ven en el listado del admin",
  "Los permisos",
  "El orden de las URLs",
]
correcta = 1
explicacion = "`list_display` define las columnas; `search_fields`, la búsqueda; y `list_filter`, los filtros laterales."
