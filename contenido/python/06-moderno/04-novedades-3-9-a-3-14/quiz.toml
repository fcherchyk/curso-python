[[preguntas]]
texto = "¿En qué modo hay que abrir un archivo para `tomllib.load`?"
opciones = ["Texto (`\"r\"`)", "Binario (`\"rb\"`)", "Cualquiera", "Escritura"]
correcta = 1
explicacion = "`tomllib.load` recibe un archivo binario y decodifica UTF-8 por su cuenta. Para un string, usá `tomllib.loads`."

[[preguntas]]
texto = "¿Cuál es la práctica recomendada con fechas y zonas horarias?"
opciones = [
  "Guardar en hora local y convertir a UTC al mostrar",
  "Guardar y comparar en UTC; convertir a la zona local solo para mostrar",
  "Usar siempre datetimes naive",
  "Usar `datetime.utcnow()`",
]
correcta = 1
explicacion = "UTC no tiene horario de verano ni ambigüedades. `utcnow()` está deprecado porque devuelve un datetime naive; usá `datetime.now(UTC)`."

[[preguntas]]
texto = "¿Qué devuelve `t\"Hola {nombre}\"` en Python 3.14?"
opciones = [
  "Un `str` igual que una f-string",
  "Un objeto `Template` con las partes literales y los valores por separado",
  "Un error de sintaxis",
  "Un `bytes`",
]
correcta = 1
explicacion = "Las t-strings no interpolan: entregan un `Template` para que una librería combine las partes de forma segura (escapando HTML, parametrizando SQL, etc.)."

[[preguntas]]
texto = "¿En qué versión se agregaron `match`/`case` y la sintaxis `X | Y` para tipos?"
opciones = ["3.8", "3.9", "3.10", "3.12"]
correcta = 2
explicacion = "Las dos llegaron en Python 3.10, junto con `zip(strict=True)` y mejores mensajes de error."

[[preguntas]]
texto = "¿Qué hace `DEFAULTS | seccion`?"
opciones = [
  "Modifica `DEFAULTS` agregándole `seccion`",
  "Devuelve un dict nuevo donde `seccion` pisa a `DEFAULTS`",
  "Devuelve las claves en común",
  "Levanta `TypeError`",
]
correcta = 1
explicacion = "El operador `|` de dicts (3.9) crea un dict nuevo y no muta ninguno de los dos. El que modifica en el lugar es `|=`."
