[[preguntas]]
texto = "Con `class E(Enum): A = \"a\"`, ¿qué devuelve `E.A == \"a\"`?"
opciones = ["`True`", "`False`", "Levanta `TypeError`", "`\"a\"`"]
correcta = 1
explicacion = "Un `Enum` común no es igual a su valor. Hay que comparar `E.A.value == \"a\"`, o usar `StrEnum`, cuyos miembros son strings."

[[preguntas]]
texto = "¿Cómo obtenés el miembro a partir de su **valor** `\"enviado\"`?"
opciones = ["`Estado[\"enviado\"]`", "`Estado(\"enviado\")`", "`Estado.enviado`", "`Estado.get(\"enviado\")`"]
correcta = 1
explicacion = "Llamar a la clase busca por valor. Los corchetes buscan por **nombre** (`Estado[\"ENVIADO\"]`)."

[[preguntas]]
texto = "¿Qué ventaja concreta tiene `StrEnum` al serializar a JSON?"
opciones = [
  "Ninguna",
  "Los miembros son `str`, así que `json.dumps` los serializa directamente",
  "Comprime los valores",
  "Valida el esquema del JSON",
]
correcta = 1
explicacion = "Como cada miembro es también un `str`, `json.dumps` lo trata como un string común, sin conversión manual."

[[preguntas]]
texto = "En un `match`, ¿qué hace `case PENDIENTE:` (sin el nombre de la clase)?"
opciones = [
  "Compara con `Estado.PENDIENTE`",
  "Captura cualquier valor en una variable llamada `PENDIENTE`",
  "Levanta `NameError`",
  "Compara con el string `\"PENDIENTE\"`",
]
correcta = 1
explicacion = "Un nombre suelto en un patrón es una captura, y siempre matchea. Para comparar hay que usar un nombre con punto: `case Estado.PENDIENTE:`."

[[preguntas]]
texto = "Para representar permisos combinables (leer + escribir), ¿qué conviene?"
opciones = ["`StrEnum`", "`IntEnum`", "`Flag`", "Una lista de strings"]
correcta = 2
explicacion = "`Flag` permite combinar miembros con `|`, consultar con `in` y operar con `&`."
