[[preguntas]]
texto = "¿Qué pasa al asignar a una property que no tiene setter?"
opciones = [
  "Se crea un atributo nuevo con ese nombre",
  "Levanta `AttributeError`",
  "Se ignora en silencio",
  "Se llama al getter",
]
correcta = 1
explicacion = "Una property sin setter es de solo lectura: asignarle levanta `AttributeError`."

[[preguntas]]
texto = "Dentro del getter `@property def precio(self)`, ¿qué problema tiene `return self.precio`?"
opciones = [
  "Ninguno",
  "Recursión infinita: `self.precio` vuelve a llamar al getter",
  "Devuelve la función, no el valor",
  "Levanta `TypeError`",
]
correcta = 1
explicacion = "`self.precio` pasa por la property otra vez. El valor real se guarda en otro atributo, como `self._precio`."

[[preguntas]]
texto = "¿Por qué un constructor alternativo usa `cls(...)` en lugar del nombre de la clase?"
opciones = [
  "Porque es más rápido",
  "Para que las subclases creen instancias de sí mismas",
  "Porque el nombre de la clase no existe dentro de sus métodos",
  "Por convención, sin diferencia práctica",
]
correcta = 1
explicacion = "Si `Empleado` hereda de `Persona`, `Empleado.desde_dict(...)` recibe `cls = Empleado` y crea un `Empleado`."

[[preguntas]]
texto = "En el `__init__`, ¿por qué conviene `self.precio = precio` (por la property) y no `self._precio = precio`?"
opciones = [
  "Porque `_precio` no se puede asignar en `__init__`",
  "Para que la validación del setter corra también al construir el objeto",
  "Porque es más corto",
  "Para que el atributo sea público",
]
correcta = 1
explicacion = "Así se valida en un solo lugar y no se puede crear un objeto en un estado inválido."

[[preguntas]]
texto = "¿Cuándo **no** conviene una property?"
opciones = [
  "Para un valor derivado barato como `nombre_completo`",
  "Cuando el cálculo hace una consulta a una API o a una base",
  "Para validar un valor al asignarlo",
  "Para convertir un atributo en calculado sin cambiar la API",
]
correcta = 1
explicacion = "Quien lee `obj.x` espera algo instantáneo y sin efectos. Para cálculos caros o con I/O, usá un método con verbo o `cached_property`."
