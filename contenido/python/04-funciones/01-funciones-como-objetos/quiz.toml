[[preguntas]]
texto = "¿Qué le estás pasando a `sorted` con `sorted(xs, key=len())`?"
opciones = [
  "La función `len`",
  "El resultado de llamar a `len` sin argumentos, que levanta `TypeError`",
  "Una lambda",
  "Nada: `key` se ignora",
]
correcta = 1
explicacion = "Con paréntesis se *llama* a la función. `key` espera la función en sí: `key=len`."

[[preguntas]]
texto = "¿Qué devuelve `partial(int, base=16)(\"ff\")`?"
opciones = ["`'ff'`", "`255`", "`16`", "Levanta `TypeError`"]
correcta = 1
explicacion = "`partial` fija `base=16`, así que la llamada equivale a `int(\"ff\", base=16)`, que es 255."

[[preguntas]]
texto = "¿Por qué no conviene escribir `doble = lambda x: x * 2`?"
opciones = [
  "Porque las lambdas son más lentas",
  "Porque si la vas a nombrar, un `def` da nombre en los tracebacks, admite docstring y es lo idiomático",
  "Porque las lambdas no pueden devolver valores",
  "Porque es un error de sintaxis",
]
correcta = 1
explicacion = "Las lambdas son para funciones cortas pasadas como argumento. Asignada a un nombre, es un `def` peor (ruff la marca con E731)."

[[preguntas]]
texto = "¿Qué ventaja tiene despachar con `OPERACIONES[op](a, b)` frente a una cadena de `if/elif`?"
opciones = [
  "Es la única forma de usar el módulo `operator`",
  "Agregar un caso es agregar una entrada al dict, sin tocar la lógica",
  "Evita tener que manejar errores",
  "Es obligatorio en Python 3",
]
correcta = 1
explicacion = "Separa los datos (la tabla de operaciones) de la lógica. Además, el dict se puede extender o inyectar desde afuera."

[[preguntas]]
texto = "¿Qué hace que un objeto sea *callable*?"
opciones = [
  "Heredar de `function`",
  "Tener un método `__call__`",
  "Estar decorado con `@callable`",
  "Tener un atributo `__name__`",
]
correcta = 1
explicacion = "Cualquier objeto cuya clase define `__call__` se puede llamar con paréntesis. Las funciones, las clases y los `partial` lo cumplen."
