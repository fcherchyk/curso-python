[[preguntas]]
texto = "Con `a = pd.Series({\"x\": 1, \"y\": 2})` y `b = pd.Series({\"y\": 10, \"z\": 20})`, ¿qué da `a + b`?"
opciones = [
  "`[11, 22]` (por posición)",
  "`x: NaN, y: 12, z: NaN` (alinea por etiqueta)",
  "Un error de tamaño",
  "`y: 12` solamente",
]
correcta = 1
explicacion = "pandas alinea por índice. Las etiquetas que están en una sola Series dan `NaN`."

[[preguntas]]
texto = "¿Qué devuelve `df[[\"producto\", \"stock\"]]`?"
opciones = ["Una Series", "Un DataFrame con esas dos columnas", "Una lista", "Un error"]
correcta = 1
explicacion = "Con una lista de columnas (doble corchete) se obtiene un DataFrame. Con un solo nombre, una Series."

[[preguntas]]
texto = "¿Para qué sirve `parse_dates=[\"fecha\"]` en `read_csv`?"
opciones = [
  "Para ordenar por fecha",
  "Para convertir esa columna a `datetime64` en lugar de dejarla como texto",
  "Para usarla como índice",
  "Para filtrar fechas inválidas",
]
correcta = 1
explicacion = "Sin eso, las fechas quedan como strings y no se pueden usar operaciones de fecha (`.dt`, `resample`, filtros por rango)."

[[preguntas]]
texto = "¿Qué devuelve `df[\"total\"].idxmax()`?"
opciones = [
  "El valor máximo",
  "La etiqueta del índice de la fila con el máximo",
  "La posición numérica del máximo",
  "La columna con el máximo",
]
correcta = 1
explicacion = "`idxmax` devuelve la etiqueta. Si el índice es `id`, devuelve el id de esa fila."

[[preguntas]]
texto = "¿Qué formato se recomienda para guardar datos intermedios en pandas?"
opciones = ["CSV", "Parquet", "Excel", "JSON"]
correcta = 1
explicacion = "Parquet es columnar, comprimido y conserva los tipos (fechas, categorías). El CSV pierde los tipos y es más lento."
