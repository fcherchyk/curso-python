[[preguntas]]
texto = "Con `precio: float`, ¿qué pasa con `Producto(nombre=\"x\", precio=\"3500\")` en el modo por defecto?"
opciones = [
  "`ValidationError`: es un string",
  "Se convierte a `3500.0`",
  "Queda como string `\"3500\"`",
  "Se ignora el campo",
]
correcta = 1
explicacion = "En modo laxo, Pydantic convierte los valores compatibles. Con `strict=True` exigiría un número."

[[preguntas]]
texto = "¿Qué hace `edad: int = Field(ge=0, le=130)`?"
opciones = [
  "Pone 0 como default",
  "Exige que la edad esté entre 0 y 130 inclusive",
  "Convierte la edad a un rango",
  "Exige más de 0 y menos de 130 (exclusivo)",
]
correcta = 1
explicacion = "`ge` es \"mayor o igual\" y `le`, \"menor o igual\". Para exclusivos están `gt` y `lt`."

[[preguntas]]
texto = "¿Para qué sirve `@model_validator(mode=\"after\")`?"
opciones = [
  "Para validar un solo campo",
  "Para reglas que involucran varios campos, con el modelo ya construido",
  "Para convertir el modelo a JSON",
  "Para definir valores por defecto",
]
correcta = 1
explicacion = "Ejemplos: que la contraseña no sea igual al nombre, o que `fecha_fin` sea posterior a `fecha_inicio`."

[[preguntas]]
texto = "Un endpoint tiene `response_model=UsuarioPublico` (sin `password`) y devuelve un dict con `password`. ¿Qué recibe el cliente?"
opciones = [
  "El dict completo, con password",
  "Solo los campos de `UsuarioPublico`: `password` se filtra",
  "Un error 500",
  "Un 422",
]
correcta = 1
explicacion = "El `response_model` valida y filtra la salida. Es la forma idiomática de no exponer campos sensibles."

[[preguntas]]
texto = "Si el body de un POST no cumple el modelo, ¿qué responde FastAPI?"
opciones = [
  "400 con un mensaje genérico",
  "422 con la lista de errores por campo (`loc`, `msg`, `type`)",
  "500",
  "200 con los datos corregidos",
]
correcta = 1
explicacion = "La validación ocurre antes de llamar a tu función. El 422 indica qué campo falló y por qué."
