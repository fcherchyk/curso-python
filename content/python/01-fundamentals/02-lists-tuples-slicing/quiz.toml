[[questions]]
text = "With `xs = [0, 1, 2, 3, 4]`, what does `xs[1:-1]` return?"
options = ["`[1, 2, 3, 4]`", "`[1, 2, 3]`", "`[0, 1, 2, 3]`", "`[1]`"]
correct = 1
explanation = "The start is inclusive and the end exclusive: from index 1 up to the second-to-last, not including it."

[[questions]]
text = "What does `[1, 2, 3][5:10]` return?"
options = ["Raises `IndexError`", "`[]`", "`None`", "`[3]`"]
correct = 1
explanation = "Slicing clamps out-of-range bounds and never raises `IndexError`. Accessing a single index like `xs[5]` does raise it."

[[questions]]
text = "Which of these expressions is a single-element tuple?"
options = ["`(42)`", "`(42,)`", "`tuple(42)`", "`[42]`"]
correct = 1
explanation = "The comma is what creates the tuple. `(42)` is just the integer in parentheses, and `tuple(42)` fails because an `int` isn't iterable."

[[questions]]
text = "You need a queue where you append at the end and remove from the front millions of times. What do you use?"
options = [
  "A list with `append` and `pop(0)`",
  "`collections.deque` with `append` and `popleft`",
  "A tuple",
  "A list with `insert(0, x)` and `pop()`",
]
correct = 1
explanation = "On a list, `pop(0)` and `insert(0, x)` cost O(n) because they shift every element. `deque` works on both ends in O(1)."

[[questions]]
text = "If `n = 0`, what does `xs[-n:]` return?"
options = ["`[]`", "The whole list", "The last element", "Raises `ValueError`"]
correct = 1
explanation = "`-0` is `0`, and `xs[0:]` is the whole list. If `n` can be 0, prefer `xs[len(xs) - n:]`."
