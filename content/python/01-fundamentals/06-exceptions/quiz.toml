[[questions]]
text = "¿Cuándo se ejecuta el bloque `else` de un `try`?"
options = [
  "Siempre, después del `try`",
  "Solo si el `try` no levantó ninguna excepción",
  "Solo si se levantó una excepción no atrapada",
  "Cuando el `except` termina sin errores",
]
correct = 1
explanation = "El `else` corre cuando el `try` terminó sin excepción. Sirve para sacar del `try` el código que no esperás que falle."

[[questions]]
text = "¿Por qué no se recomienda `except:` sin tipo?"
options = [
  "Porque es un error de sintaxis desde Python 3",
  "Porque atrapa también `KeyboardInterrupt` y `SystemExit`",
  "Porque es más lento",
  "Porque no permite usar `as e`",
]
correct = 1
explanation = "Sin tipo atrapa `BaseException`: incluso el Ctrl+C y el `sys.exit()`. Como mínimo, usá `except Exception` y logueá."

[[questions]]
text = "¿Qué hace `raise ConfigError(\"...\") from e`?"
options = [
  "Levanta `e` y descarta `ConfigError`",
  "Levanta `ConfigError` y guarda `e` como su causa (`__cause__`)",
  "Convierte `e` en `ConfigError` modificándolo",
  "Solo funciona si `ConfigError` hereda del tipo de `e`",
]
correct = 1
explanation = "Encadena las excepciones: se levanta la nueva y la original queda en `__cause__`. El traceback muestra las dos."

[[questions]]
text = "`int(\"abc\")` levanta…"
options = ["`TypeError`", "`ValueError`", "`KeyError`", "`SyntaxError`"]
correct = 1
explanation = "El tipo (`str`) es aceptable, pero el valor no representa un número: es un `ValueError`. `TypeError` sería, por ejemplo, `int([1])`."

[[questions]]
text = "¿Por qué no hay que usar `assert` para validar datos de entrada?"
options = [
  "Porque no se puede poner un mensaje",
  "Porque los `assert` se eliminan al ejecutar con `python -O`",
  "Porque levanta `ValueError` en lugar de `AssertionError`",
  "Porque solo funciona dentro de tests",
]
correct = 1
explanation = "Con optimizaciones (`-O`) los `assert` desaparecen y tu validación dejaría de existir. Son para invariantes internas y tests."
