[[questions]]
text = "When does the `else` block of a `try` run?"
options = [
  "Always, after the `try`",
  "Only if the `try` didn't raise any exception",
  "Only if an uncaught exception was raised",
  "When the `except` finishes without errors",
]
correct = 1
explanation = "The `else` runs when the `try` finished without an exception. It lets you move code you don't expect to fail out of the `try`."

[[questions]]
text = "Why is a bare `except:` not recommended?"
options = [
  "Because it's a syntax error since Python 3",
  "Because it also catches `KeyboardInterrupt` and `SystemExit`",
  "Because it's slower",
  "Because it doesn't allow `as e`",
]
correct = 1
explanation = "Without a type it catches `BaseException`: even Ctrl+C and `sys.exit()`. At the very least, use `except Exception` and log."

[[questions]]
text = "What does `raise ConfigError(\"...\") from e` do?"
options = [
  "Raises `e` and discards `ConfigError`",
  "Raises `ConfigError` and stores `e` as its cause (`__cause__`)",
  "Turns `e` into a `ConfigError` by modifying it",
  "Only works if `ConfigError` inherits from the type of `e`",
]
correct = 1
explanation = "It chains the exceptions: the new one is raised and the original is kept in `__cause__`. The traceback shows both."

[[questions]]
text = "`int(\"abc\")` raises…"
options = ["`TypeError`", "`ValueError`", "`KeyError`", "`SyntaxError`"]
correct = 1
explanation = "The type (`str`) is acceptable, but the value doesn't represent a number: that's a `ValueError`. A `TypeError` would be, for example, `int([1])`."

[[questions]]
text = "Why shouldn't you use `assert` to validate input data?"
options = [
  "Because you can't add a message",
  "Because `assert` statements are removed when running with `python -O`",
  "Because it raises `ValueError` instead of `AssertionError`",
  "Because it only works inside tests",
]
correct = 1
explanation = "With optimizations (`-O`), `assert` statements disappear and your validation would stop existing. They're for internal invariants and tests."
