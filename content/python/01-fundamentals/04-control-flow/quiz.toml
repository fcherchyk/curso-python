[[questions]]
text = "When does the `else` block of a `for` run?"
options = [
  "When the iterable is empty",
  "When the loop finishes without executing a `break`",
  "When an exception occurs inside the loop",
  "Never: it's a syntax error",
]
correct = 1
explanation = "The `else` runs if the loop finished \"normally\", without `break`. With an empty iterable it runs too, because there was no `break` either."

[[questions]]
text = "What does `\"\" or \"anonymous\"` return?"
options = ["`True`", "`''`", "`'anonymous'`", "`False`"]
correct = 2
explanation = "`or` returns the first truthy operand (or the last one). Since the empty string is falsy, it returns `'anonymous'`."

[[questions]]
text = "What does `for i in range(3): pass` followed by `print(i)` print?"
options = ["`NameError`", "`2`", "`3`", "`None`"]
correct = 1
explanation = "Loops don't create a new scope: `i` still exists with the last value assigned, which is 2."

[[questions]]
text = "What is `0 <= x < 10` equivalent to?"
options = [
  "`(0 <= x) < 10`",
  "`0 <= x and x < 10`",
  "`0 <= (x < 10)`",
  "It's a syntax error",
]
correct = 1
explanation = "Python chains comparisons with `and` and evaluates `x` only once."

[[questions]]
text = "When is `while` preferable to `for`?"
options = [
  "To iterate over a list with indices",
  "When you don't know in advance how many iterations you'll need",
  "Always, because it's faster",
  "To iterate over the keys of a dict",
]
correct = 1
explanation = "To iterate over collections you use `for`. `while` is for retries, sentinels or algorithms that loop until a condition holds."
