[[questions]]
text = "What is `__name__` inside `utils.py` when you run `python utils.py`?"
options = ["`\"utils\"`", "`\"__main__\"`", "`\"utils.py\"`", "`None`"]
correct = 1
explanation = "The module that runs directly is called `__main__`. When it's imported, `__name__` is the module's name."

[[questions]]
text = "If two different files do `import config`, how many times does `config.py` run?"
options = ["Twice", "Only once", "Never, until something is used", "It depends on `__all__`"]
correct = 1
explanation = "After the first import, the module is cached in `sys.modules` and later imports reuse it."

[[questions]]
text = "What is `__all__` for in a module?"
options = [
  "To make the names not in the list private",
  "To define what `from module import *` exports and document the public API",
  "To speed up imports",
  "To list the module's dependencies",
]
correct = 1
explanation = "It controls what gets imported with `import *` and serves as documentation. It doesn't prevent access to other names."

[[questions]]
text = "You run `python shop/payments/card.py`, which uses `from ..models import Order`. What happens?"
options = [
  "It works normally",
  "`ImportError`: relative import with no known parent package",
  "It imports `models` from the current directory",
  "The import is ignored",
]
correct = 1
explanation = "When run as a script, the file is `__main__` and doesn't belong to any package. You have to use `python -m shop.payments.card`."

[[questions]]
text = "What's the best fix for a circular import between `a.py` and `b.py`?"
options = [
  "Use `from a import *`",
  "Move the shared code to a third module",
  "Clear `sys.modules` before importing",
  "Rename the files",
]
correct = 1
explanation = "A circular import usually points to a design problem. Extracting the shared code into another module breaks the cycle."
