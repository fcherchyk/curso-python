[[questions]]
text = "Después de `a = [1]; b = a; b.append(2)`, ¿cuánto vale `a`?"
options = ["`[1]`", "`[1, 2]`", "`[2]`", "Levanta `NameError`"]
correct = 1
explanation = "`b = a` no copia: los dos nombres apuntan a la misma lista, así que el `append` se ve desde ambos."

[[questions]]
text = "¿Cuándo es correcto usar `is` en lugar de `==`?"
options = [
  "Para comparar strings cortos, porque es más rápido",
  "Para comparar con singletons como `None`",
  "Siempre que los dos lados sean del mismo tipo",
  "Para comparar números enteros",
]
correct = 1
explanation = "`is` compara identidad. Se usa con `None` y centinelas. Que funcione con enteros chicos o strings cortos es un detalle de implementación de CPython."

[[questions]]
text = "¿Qué devuelve `-7 // 2`?"
options = ["`-3`", "`-4`", "`-3.5`", "`3`"]
correct = 1
explanation = "La división entera redondea hacia -infinito (floor), no hacia cero. Por eso `-7 // 2` es `-4` y `-7 % 2` es `1`."

[[questions]]
text = "`t = [[0] * 2] * 2; t[0][0] = 5`. ¿Cuánto vale `t`?"
options = ["`[[5, 0], [0, 0]]`", "`[[5, 0], [5, 0]]`", "`[[5, 5], [0, 0]]`", "Levanta `TypeError`"]
correct = 1
explanation = "`* 2` repite la referencia a la **misma** lista interna. Para filas independientes: `[[0] * 2 for _ in range(2)]`."

[[questions]]
text = "¿Cuál es la forma correcta de representar `0.1` pesos para cálculos exactos?"
options = ["`0.1`", "`Decimal(0.1)`", "`Decimal(\"0.1\")`", "`float(\"0.1\")`"]
correct = 2
explanation = "`Decimal` construido desde un string conserva el valor decimal exacto. Desde un float, hereda el error de la representación binaria."
