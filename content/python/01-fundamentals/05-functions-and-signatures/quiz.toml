[[questions]]
text = "With `def f(x, acc=[]): acc.append(x); return acc`, what does a second call `f(2)` return after `f(1)`?"
options = ["`[2]`", "`[1, 2]`", "`[]`", "Raises `TypeError`"]
correct = 1
explanation = "The default is evaluated only once, when the function is defined: every call shares the same list."

[[questions]]
text = "With `def export(data, *, compress=False)`, what happens with `export(rows, True)`?"
options = [
  "It works: `compress` is `True`",
  "It raises `TypeError`",
  "`True` is ignored",
  "`data` becomes `True`",
]
correct = 1
explanation = "Everything after `*` is keyword-only: you have to write `compress=True`."

[[questions]]
text = "Inside `def f(*args, **kwargs)`, what types are `args` and `kwargs`?"
options = ["list and dict", "tuple and dict", "tuple and list", "list and list"]
correct = 1
explanation = "`*args` collects the extra positional arguments into a tuple and `**kwargs` the extra keyword arguments into a dict."

[[questions]]
text = "With `def distance(a, b, /)`, which call is valid?"
options = ["`distance(a=1, b=2)`", "`distance(1, b=2)`", "`distance(1, 2)`", "None of them"]
correct = 2
explanation = "Parameters before `/` are positional-only: they can't be passed by name."

[[questions]]
text = "What does a function that ends without `return` return?"
options = ["`0`", "`None`", "`False`", "The value of the last expression"]
correct = 1
explanation = "Every function returns something; if there's no `return` (or a bare `return`), it returns `None`."
