[[questions]]
text = "What is the type of `{}`?"
options = ["`set`", "`dict`", "`frozenset`", "`tuple`"]
correct = 1
explanation = "Empty braces are a dict. For an empty set you have to write `set()`."

[[questions]]
text = "Which of these objects can **not** be a dict key?"
options = ["`(1, 2)`", "`\"abc\"`", "`[1, 2]`", "`frozenset({1, 2})`"]
correct = 2
explanation = "Lists are mutable and not hashable. If the key changed, its hash would no longer match the slot in the table where it was stored."

[[questions]]
text = "With `a = {1, 2, 3}` and `b = {2, 3, 4}`, what is `a ^ b`?"
options = ["`{2, 3}`", "`{1, 4}`", "`{1, 2, 3, 4}`", "`{1}`"]
correct = 1
explanation = "`^` is the symmetric difference: the elements that are in only one of the two sets."

[[questions]]
text = "How do you get the unique elements of a list **preserving the order** of appearance?"
options = [
  "`list(set(xs))`",
  "`sorted(set(xs))`",
  "`list(dict.fromkeys(xs))`",
  "`set(xs).sort()`",
]
correct = 2
explanation = "A set doesn't guarantee order and `sorted` changes the original order. Dicts preserve insertion order, so `dict.fromkeys` deduplicates while respecting it."

[[questions]]
text = "You have 100,000 words and a list of 5,000 banned ones. What's the best way to filter?"
options = [
  "Do `w not in banned_list` for each word",
  "Convert the banned words to a `set` once and then check `w not in banned`",
  "Sort both lists",
  "Use `banned_list.index(w)` inside a `try`",
]
correct = 1
explanation = "On a list, each `in` is O(n): that's around 500 million comparisons. On a set it's O(1), so converting once makes the whole filter linear."
