[[questions]]
text = "Con un índice 0, 1, 2…, ¿cuántas filas devuelve `df.loc[0:3]`?"
options = ["3", "4", "2", "Depende del orden"]
correct = 1
explanation = "Los slices de `loc` son por etiqueta e inclusivos: 0, 1, 2 y 3. `df.iloc[0:3]` devolvería 3 filas."

[[questions]]
text = "Después de `o = df.sort_values(\"total\", ascending=False)`, ¿qué es `o.iloc[0]`?"
options = [
  "La fila con etiqueta 0",
  "La primera fila del resultado ordenado: la de mayor total",
  "La columna 0",
  "Un error",
]
correct = 1
explanation = "`iloc` usa posiciones del DataFrame actual. `o.loc[0]` sería la fila cuya etiqueta es 0, esté donde esté."

[[questions]]
text = "En pandas 3, ¿qué pasa con `df[\"total\"][df[\"cantidad\"] > 5] = 0`?"
options = [
  "Modifica `df`",
  "No modifica `df`: es asignación encadenada y pandas avisa con `ChainedAssignmentError`",
  "Borra las filas",
  "Modifica solo la primera fila",
]
correct = 1
explanation = "Con copy-on-write, el resultado intermedio es una copia. La forma correcta es `df.loc[df[\"cantidad\"] > 5, \"total\"] = 0`."

[[questions]]
text = "¿Cómo se usa una variable de Python `minimo` dentro de `df.query(...)`?"
options = ["`\"cantidad >= minimo\"`", "`\"cantidad >= @minimo\"`", "`\"cantidad >= {minimo}\"`", "No se puede"]
correct = 1
explanation = "El `@` referencia variables del entorno de Python. Sin él, `query` busca una columna con ese nombre."

[[questions]]
text = "`centro = df[df[\"sucursal\"] == \"Centro\"]; centro[\"total\"] = 0`. ¿Cambia `df`?"
options = ["Sí", "No: con copy-on-write la selección se comporta como una copia", "A veces", "Levanta un error"]
correct = 1
explanation = "En pandas 3, las selecciones nunca modifican el original. Si querés cambiar `df`, usá `loc` sobre `df` mismo."
