[[questions]]
text = "With an index 0, 1, 2…, how many rows does `df.loc[0:3]` return?"
options = ["3", "4", "2", "It depends on the order"]
correct = 1
explanation = "`loc` slices are by label and inclusive: 0, 1, 2 and 3. `df.iloc[0:3]` would return 3 rows."

[[questions]]
text = "After `o = df.sort_values(\"total\", ascending=False)`, what is `o.iloc[0]`?"
options = [
  "The row with label 0",
  "The first row of the sorted result: the one with the largest total",
  "Column 0",
  "An error",
]
correct = 1
explanation = "`iloc` uses positions in the current DataFrame. `o.loc[0]` would be the row whose label is 0, wherever it is."

[[questions]]
text = "In pandas 3, what happens with `df[\"total\"][df[\"quantity\"] > 5] = 0`?"
options = [
  "It modifies `df`",
  "It doesn't modify `df`: it's chained assignment and pandas warns with `ChainedAssignmentError`",
  "It deletes the rows",
  "It modifies only the first row",
]
correct = 1
explanation = "With copy-on-write, the intermediate result is a copy. The correct way is `df.loc[df[\"quantity\"] > 5, \"total\"] = 0`."

[[questions]]
text = "How do you use a Python variable `minimum` inside `df.query(...)`?"
options = ["`\"quantity >= minimum\"`", "`\"quantity >= @minimum\"`", "`\"quantity >= {minimum}\"`", "You can't"]
correct = 1
explanation = "`@` references variables from the Python environment. Without it, `query` looks for a column with that name."

[[questions]]
text = "`central = df[df[\"branch\"] == \"Central\"]; central[\"total\"] = 0`. Does `df` change?"
options = ["Yes", "No: with copy-on-write the selection behaves like a copy", "Sometimes", "It raises an error"]
correct = 1
explanation = "In pandas 3, selections never modify the original. If you want to change `df`, use `loc` on `df` itself."
