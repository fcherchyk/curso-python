[[questions]]
text = "With a `DatetimeIndex`, what does `prices.loc[\"2024-03\"]` return?"
options = [
  "The row for day 3 of 2024",
  "All the rows from March 2024",
  "An error",
  "The row for March 1",
]
correct = 1
explanation = "Partial date indexing selects the whole period given (a year, a month or a day)."

[[questions]]
text = "What's the representative monthly value for daily closing prices?"
options = [
  "`resample(\"ME\").mean()`",
  "`resample(\"ME\").last()`",
  "`resample(\"ME\").sum()`",
  "`resample(\"ME\").max()`",
]
correct = 1
explanation = "The monthly close is the last price of the month. Summing prices makes no sense, and the average smooths and changes the returns."

[[questions]]
text = "What is `s.pct_change()` equivalent to?"
options = ["`s.diff()`", "`s / s.shift(1) - 1`", "`s.shift(-1) / s`", "`s.cumprod()`"]
correct = 1
explanation = "It's the relative change from the previous period. The first row is `NaN`."

[[questions]]
text = "In a moving average `rolling(20).mean()`, what do the first 19 rows contain?"
options = [
  "The average of the available data",
  "`NaN`, because there aren't 20 data points yet (unless you use `min_periods`)",
  "Zeros",
  "The first price",
]
correct = 1
explanation = "The window needs the full number of observations, unless `min_periods` says otherwise."

[[questions]]
text = "What does `cond & ~cond.shift(1, fill_value=False)` detect?"
options = [
  "The days when the condition is false",
  "The days when the condition goes from false to true (a state change)",
  "The days when the condition is always true",
  "Nothing: it's a bug",
]
correct = 1
explanation = "It's true today and was false yesterday. That's how you detect moving average crossovers, threshold breakouts, etc."
