[[questions]]
text = "What does `pd.to_numeric(s, errors=\"coerce\")` do with the value `\"unknown\"`?"
options = ["Raises `ValueError`", "Converts it to `NaN`", "Leaves it as text", "Converts it to 0"]
correct = 1
explanation = "`coerce` turns anything that can't be parsed into a null, so one dirty value doesn't stop the whole process."

[[questions]]
text = "An integer column has a missing value. Which dtype lets you keep integers alongside the null?"
options = ["`int64`", "`Int64` (capitalized)", "`float64`", "`object`"]
correct = 1
explanation = "`int64` doesn't allow `NaN`, so pandas would turn the column into `float64`. `Int64` is the integer type that allows nulls (`pd.NA`)."

[[questions]]
text = "Why do you need to normalize the email before `drop_duplicates(subset=[\"email\"])`?"
options = [
  "Because `drop_duplicates` doesn't accept strings",
  "Because \"ALICE@mail.com\" and \"alice@mail.com \" are the same person but different strings",
  "For performance",
  "You don't need to",
]
correct = 1
explanation = "Deduplication compares exact values. First you have to bring the text to a canonical form (lowercase, no spaces)."

[[questions]]
text = "Where do pandas' vectorized text operations live?"
options = ["In the `re` module", "In a Series' `.str` accessor", "In `df.text`", "In `pd.strings`"]
correct = 1
explanation = "`s.str.strip()`, `s.str.lower()`, `s.str.replace(...)` and the rest apply to the whole column and respect nulls."

[[questions]]
text = "What's the advantage of chaining methods (`df.assign(...).dropna(...).pipe(...)`)?"
options = [
  "It's faster in every case",
  "The pipeline reads from top to bottom, with no intermediate variables, and each step returns a new DataFrame",
  "It modifies the original in place",
  "It's the only way to use `assign`",
]
correct = 1
explanation = "Method chaining makes the process readable and reproducible. `pipe` lets you insert your own functions into the chain."
