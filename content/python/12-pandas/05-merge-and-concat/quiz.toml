[[questions]]
text = "Hacés `ventas.merge(productos, on=\"producto\")` sin `how`. ¿Qué pasa con las ventas de un producto que no está en el catálogo?"
options = [
  "Quedan con NaN en las columnas del catálogo",
  "Desaparecen: el default es `inner`",
  "Levanta un error",
  "Se duplican",
]
correct = 1
explanation = "El `how` por defecto es `inner`, que solo conserva las claves presentes en ambas tablas. Para no perder ventas, `how=\"left\"`."

[[questions]]
text = "El catálogo tiene un producto repetido dos veces. ¿Qué pasa con un `left` merge de las ventas?"
options = [
  "Nada",
  "Las ventas de ese producto se duplican y los totales se inflan sin ningún error",
  "Se usa la primera aparición",
  "Levanta un error siempre",
]
correct = 1
explanation = "Cada fila de la izquierda se combina con todas las coincidencias de la derecha. Con `validate=\"many_to_one\"`, pandas lo detecta y levanta `MergeError`."

[[questions]]
text = "¿Para qué sirve `indicator=True` en un merge?"
options = [
  "Para ordenar el resultado",
  "Agrega una columna `_merge` que indica si cada fila vino de ambas tablas, solo de la izquierda o solo de la derecha",
  "Para validar los tipos",
  "Para acelerar el merge",
]
correct = 1
explanation = "Permite encontrar las claves sin pareja (anti-join), por ejemplo las ventas de productos que no están en el catálogo."

[[questions]]
text = "¿Qué hace `ignore_index=True` en `pd.concat([a, b], ignore_index=True)`?"
options = [
  "Ignora las columnas",
  "Renumera el índice 0..n-1 en lugar de conservar los índices originales (que podrían repetirse)",
  "Descarta las filas con índice repetido",
  "Une por índice",
]
correct = 1
explanation = "Sin eso, el resultado puede tener índices repetidos (dos filas con índice 0, etc.)."

[[questions]]
text = "Tenés 100 CSV mensuales. ¿Cuál es la forma eficiente de juntarlos?"
options = [
  "`df = pd.concat([df, nuevo])` dentro del bucle",
  "Leerlos en una lista y hacer un solo `pd.concat(lista, ignore_index=True)`",
  "Usar `merge` entre cada par",
  "`df.append(nuevo)`",
]
correct = 1
explanation = "Concatenar dentro del bucle copia todo en cada vuelta (cuadrático). Un solo `concat` al final es lineal. (`DataFrame.append` ya no existe.)"
