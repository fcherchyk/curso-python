[[questions]]
text = "You run `sales.merge(products, on=\"product\")` without `how`. What happens to the sales of a product that isn't in the catalog?"
options = [
  "They get NaN in the catalog columns",
  "They disappear: the default is `inner`",
  "It raises an error",
  "They get duplicated",
]
correct = 1
explanation = "The default `how` is `inner`, which only keeps keys present in both tables. To avoid losing sales, use `how=\"left\"`."

[[questions]]
text = "The catalog has a product listed twice. What happens with a `left` merge of the sales?"
options = [
  "Nothing",
  "That product's sales get duplicated and the totals get inflated without any error",
  "The first occurrence is used",
  "It always raises an error",
]
correct = 1
explanation = "Each left row is combined with every match on the right. With `validate=\"many_to_one\"`, pandas catches it and raises `MergeError`."

[[questions]]
text = "What is `indicator=True` for in a merge?"
options = [
  "To sort the result",
  "It adds a `_merge` column saying whether each row came from both tables, only the left or only the right",
  "To validate the types",
  "To speed up the merge",
]
correct = 1
explanation = "It lets you find keys with no match (anti-join), for example sales of products that aren't in the catalog."

[[questions]]
text = "What does `ignore_index=True` do in `pd.concat([a, b], ignore_index=True)`?"
options = [
  "Ignores the columns",
  "Renumbers the index 0..n-1 instead of keeping the original indexes (which could repeat)",
  "Drops the rows with a repeated index",
  "Joins on the index",
]
correct = 1
explanation = "Without it, the result can have repeated index values (two rows with index 0, etc.)."

[[questions]]
text = "You have 100 monthly CSVs. What's the efficient way to combine them?"
options = [
  "`df = pd.concat([df, new])` inside the loop",
  "Read them into a list and do a single `pd.concat(lst, ignore_index=True)`",
  "Use `merge` on each pair",
  "`df.append(new)`",
]
correct = 1
explanation = "Concatenating inside the loop copies everything on each iteration (quadratic). A single `concat` at the end is linear. (`DataFrame.append` no longer exists.)"
