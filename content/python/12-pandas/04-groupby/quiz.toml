[[questions]]
text = "What's the difference between `groupby(...).agg(\"sum\")` and `groupby(...).transform(\"sum\")`?"
options = [
  "None",
  "`agg` reduces to one row per group; `transform` returns the group's result repeated on each original row",
  "`transform` is faster",
  "`agg` only works with one column",
]
correct = 1
explanation = "`transform` keeps the original shape, ideal for computing each row's share of its group."

[[questions]]
text = "What does `sales.groupby(\"category\").agg(revenue=(\"total\", \"sum\"))` produce?"
options = [
  "A Series",
  "A DataFrame indexed by category with a `revenue` column",
  "A column MultiIndex",
  "A syntax error",
]
correct = 1
explanation = "Named aggregations (`output=(column, function)`) give clearly named columns."

[[questions]]
text = "What's the difference between `size()` and `count()` in a groupby?"
options = [
  "They're the same",
  "`size` counts rows (including nulls); `count` counts non-null values per column",
  "`count` is faster",
  "`size` only works with numbers",
]
correct = 1
explanation = "With missing values the results differ: `count` excludes them."

[[questions]]
text = "What does `pd.pivot_table(df, values=\"total\", index=\"branch\", columns=\"category\", aggfunc=\"sum\")` do?"
options = [
  "Sorts by branch",
  "Builds a table with branches as rows, categories as columns and the sum of `total` in each cell",
  "Joins two DataFrames",
  "Filters the categories",
]
correct = 1
explanation = "It's the spreadsheet pivot table. With `fill_value=0` it fills in the combinations that have no data."

[[questions]]
text = "When is `groupby(...).apply(func)` a good choice?"
options = [
  "Always, it's the fastest",
  "Only when it can't be done with `agg`, `transform` or `filter`: it's flexible but much slower",
  "For summing",
  "It doesn't exist",
]
correct = 1
explanation = "Named aggregations (`\"sum\"`, `\"mean\"`) are optimized. `apply` runs Python code for each group."
