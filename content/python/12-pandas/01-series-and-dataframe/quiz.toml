[[questions]]
text = "With `a = pd.Series({\"x\": 1, \"y\": 2})` and `b = pd.Series({\"y\": 10, \"z\": 20})`, what is `a + b`?"
options = [
  "`[11, 22]` (by position)",
  "`x: NaN, y: 12, z: NaN` (aligns by label)",
  "A size error",
  "Only `y: 12`",
]
correct = 1
explanation = "pandas aligns by index. Labels that appear in only one Series give `NaN`."

[[questions]]
text = "What does `df[[\"product\", \"stock\"]]` return?"
options = ["A Series", "A DataFrame with those two columns", "A list", "An error"]
correct = 1
explanation = "A list of columns (double brackets) gives you a DataFrame. A single name gives you a Series."

[[questions]]
text = "What is `parse_dates=[\"date\"]` for in `read_csv`?"
options = [
  "To sort by date",
  "To convert that column to `datetime64` instead of leaving it as text",
  "To use it as the index",
  "To filter out invalid dates",
]
correct = 1
explanation = "Without it, dates stay as strings and you can't use date operations (`.dt`, `resample`, range filters)."

[[questions]]
text = "What does `df[\"total\"].idxmax()` return?"
options = [
  "The maximum value",
  "The index label of the row with the maximum",
  "The numeric position of the maximum",
  "The column with the maximum",
]
correct = 1
explanation = "`idxmax` returns the label. If the index is `id`, it returns that row's id."

[[questions]]
text = "Which format is recommended for storing intermediate data in pandas?"
options = ["CSV", "Parquet", "Excel", "JSON"]
correct = 1
explanation = "Parquet is columnar, compressed and preserves the types (dates, categories). CSV loses the types and is slower."
