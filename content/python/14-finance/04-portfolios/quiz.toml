[[questions]]
text = "Two assets with 20 % volatility each, half and half. What is the portfolio's volatility?"
options = [
  "Always 20 %",
  "It depends on the correlation: 20 % if it's 1 and less if it's lower",
  "Always 10 %",
  "40 %",
]
correct = 1
explanation = "σ²_p = 0.25·0.04 + 0.25·0.04 + 2·0.25·ρ·0.04. With ρ = 1 it's 20 %; with ρ = 0, about 14 %."

[[questions]]
text = "How do you compute the variance of a portfolio with weights w and covariance matrix Σ?"
options = ["w · σ", "wᵀ Σ w", "Σ w", "the sum of the variances"]
correct = 1
explanation = "The quadratic form wᵀΣw adds up every term wᵢwⱼcov(i,j), including the cross covariances."

[[questions]]
text = "Which risk can NOT be eliminated by diversifying?"
options = [
  "The risk of one particular company",
  "Systematic risk, the risk of the market as a whole",
  "The risk of a sector",
  "None: everything can be diversified",
]
correct = 1
explanation = "A recession affects every asset. Diversifying eliminates idiosyncratic risk, not systematic risk."

[[questions]]
text = "With buy & hold, what happens to the weights over time?"
options = [
  "They stay fixed",
  "They drift: the assets that rise the most end up weighing more",
  "They even out on their own",
  "They all go down",
]
correct = 1
explanation = "The number of shares stays fixed, but their prices change, and with them each one's share of the total."

[[questions]]
text = "What does rebalancing do?"
options = [
  "Buys more of whatever rose the most",
  "Sells part of what went up and buys what went down to get back to the target weights",
  "Liquidates the whole portfolio",
  "Changes the target weights",
]
correct = 1
explanation = "It restores the chosen risk. It also works against the trend: it sells high and buys low."
