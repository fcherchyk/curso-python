[[questions]]
text = "A stock goes up 10 % one day and down 10 % the next. What is the cumulative return?"
options = ["0 %", "−1 %", "+1 %", "−10 %"]
correct = 1
explanation = "Simple returns compound: 1.10 × 0.90 − 1 = −0.01."

[[questions]]
text = "Which returns can you ADD over time to get the total?"
options = ["Simple returns", "Log returns", "Both", "Neither"]
correct = 1
explanation = "ln(P_T/P_0) is the sum of the ln(P_t/P_{t-1}). `exp(sum) - 1` gets you back to the total simple return."

[[questions]]
text = "Which returns do you average with the weights to get a portfolio's return?"
options = ["Simple returns", "Log returns", "Both", "Neither"]
correct = 0
explanation = "The portfolio's value is the sum of its positions, so its simple return is the weighted average of the simple returns. It doesn't work with log returns."

[[questions]]
text = "You have 504 daily returns with a cumulative return of 21 %. What is the annualized return?"
options = ["10.5 %", "1.21^(252/504) − 1 ≈ 10 %", "21 %", "21 % × 252"]
correct = 1
explanation = "504 sessions are 2 years: (1.21)^(1/2) − 1 = 0.10. You compound, you don't divide."

[[questions]]
text = "Why does 252 show up when annualizing daily data?"
options = [
  "It's the approximate number of trading days in a year",
  "It's 365 minus one particular country's holidays",
  "It's a pandas constant",
  "Because of an accounting convention",
]
correct = 0
explanation = "Markets trade about 252 sessions per year (no weekends or holidays), and daily data only has those days."
