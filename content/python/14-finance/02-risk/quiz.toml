[[questions]]
text = "Daily volatility is 1 %. What is the annualized volatility (approx.)?"
options = ["252 %", "1 % × √252 ≈ 15.9 %", "12 %", "1 %"]
correct = 1
explanation = "With independent returns, variances add up and the standard deviation scales with the square root of time."

[[questions]]
text = "An asset falls 50 % from its peak. How much does it need to rise to recover?"
options = ["50 %", "75 %", "100 %", "150 %"]
correct = 2
explanation = "From 100 to 50 and from 50 back to 100: the price has to double. 1 / (1 − 0.5) − 1 = 1."

[[questions]]
text = "A position's 95 % daily VaR is $10,000. What does that mean?"
options = [
  "The maximum possible loss is $10,000",
  "On 95 out of 100 days, the loss doesn't exceed $10,000",
  "You lose $10,000 on 95 % of days",
  "The expected gain is $10,000",
]
correct = 1
explanation = "VaR is a percentile, not a maximum: on the remaining 5 % of days the loss can be much larger."

[[questions]]
text = "What does CVaR (Expected Shortfall) add over VaR?"
options = [
  "Nothing: they're the same",
  "The average loss on the days beyond the VaR",
  "The maximum gain",
  "The annual volatility",
]
correct = 1
explanation = "VaR tells you where the tail starts. CVaR tells you how bad the tail is on average."

[[questions]]
text = "What does `prices / prices.cummax() - 1` compute?"
options = [
  "The daily return",
  "The drawdown: how far each day is below the previous peak",
  "The volatility",
  "The cumulative return",
]
correct = 1
explanation = "`cummax` tracks the maximum up to each date. The ratio is 0 at peaks and negative during falls."
