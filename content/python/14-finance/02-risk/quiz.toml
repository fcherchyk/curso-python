[[questions]]
text = "La volatilidad diaria es 1 %. ¿Cuál es la anualizada (aprox.)?"
options = ["252 %", "1 % × √252 ≈ 15.9 %", "12 %", "1 %"]
correct = 1
explanation = "Con retornos independientes, las varianzas se suman y el desvío escala con la raíz del tiempo."

[[questions]]
text = "Un activo cae 50 % desde su máximo. ¿Cuánto tiene que subir para recuperarlo?"
options = ["50 %", "75 %", "100 %", "150 %"]
correct = 2
explanation = "De 100 a 50 y de 50 a 100: hace falta duplicar el precio. 1 / (1 − 0.5) − 1 = 1."

[[questions]]
text = "El VaR diario al 95 % de una posición es $10 000. ¿Qué significa?"
options = [
  "La pérdida máxima posible es $10 000",
  "En 95 de cada 100 días, la pérdida no supera los $10 000",
  "Se pierden $10 000 el 95 % de los días",
  "La ganancia esperada es $10 000",
]
correct = 1
explanation = "El VaR es un percentil, no un máximo: en el 5 % de los días restantes la pérdida puede ser mucho mayor."

[[questions]]
text = "¿Qué agrega el CVaR (Expected Shortfall) respecto del VaR?"
options = [
  "Nada: son lo mismo",
  "El promedio de las pérdidas en los días que superan el VaR",
  "La ganancia máxima",
  "La volatilidad anual",
]
correct = 1
explanation = "El VaR dice dónde empieza la cola. El CVaR dice cuán mala es la cola en promedio."

[[questions]]
text = "¿Qué calcula `precios / precios.cummax() - 1`?"
options = [
  "El retorno diario",
  "El drawdown: cuánto está cada día por debajo del máximo anterior",
  "La volatilidad",
  "El retorno acumulado",
]
correct = 1
explanation = "`cummax` lleva el máximo hasta cada fecha. El cociente da 0 en los máximos y es negativo en las caídas."
