[[questions]]
text = "Why do you write `position = signal.shift(1)`?"
options = [
  "To smooth the signal",
  "Because day t's signal uses t's close: you can only trade on the next day",
  "To reduce costs",
  "Because of a pandas convention",
]
correct = 1
explanation = "Using the signal on the same day means using information that didn't exist yet: that's look-ahead bias."

[[questions]]
text = "A backtest shows 5000 % a year with a simple rule. What's most likely?"
options = [
  "You found a gold mine",
  "There's a bug, such as look-ahead bias or overfitting",
  "The market is inefficient",
  "Costs improve it",
]
correct = 1
explanation = "Results that are too good are almost always a bug. The first suspect is using data from the future."

[[questions]]
text = "How do you model transaction costs in a simple vectorized backtest?"
options = [
  "Subtracting a fixed percentage every day",
  "Subtracting cost × |change in position| on the days you trade",
  "Subtracting the cost once at the end",
  "You don't model them",
]
correct = 1
explanation = "You only pay when the position changes. `position.diff().abs()` marks those days."

[[questions]]
text = "You tried 200 moving-average combinations and picked the best. What risk are you running?"
options = [
  "None",
  "Overfitting: the best combination probably captured noise from the tested period",
  "Look-ahead bias",
  "Survivorship bias",
]
correct = 1
explanation = "With enough attempts, something always works in the past by chance. You need to validate it on out-of-sample data."

[[questions]]
text = "What should you always compare a strategy against?"
options = [
  "Against zero",
  "Against the simple alternative: buy & hold of the same asset or the index",
  "Against the inflation rate only",
  "Against another complex strategy",
]
correct = 1
explanation = "If it doesn't beat buying and doing nothing (with comparable costs and risk), the strategy adds no value."
