[[questions]]
text = "Two funds return 12 % a year. A has 10 % volatility and B has 25 %. With a 2 % risk-free rate, which has the better Sharpe?"
options = ["A: (12 − 2) / 10 = 1.0", "B: (12 − 2) / 25 = 0.4", "They're equal", "It can't be computed"]
correct = 0
explanation = "Same excess return with less volatility: more return per unit of risk."

[[questions]]
text = "What sets Sortino apart from Sharpe?"
options = [
  "It uses the compounded return",
  "It only penalizes downside volatility (downside deviation)",
  "It doesn't use the risk-free rate",
  "It uses beta",
]
correct = 1
explanation = "Gains aren't risk to an investor. Sortino divides by the deviation of the returns below the target."

[[questions]]
text = "A stock has a beta of 1.5. If the market rises 4 %, how much is it expected to rise?"
options = ["4 %", "1.5 %", "6 %", "5.5 %"]
correct = 2
explanation = "Beta is the sensitivity to the market: 1.5 × 4 % = 6 % (ignoring alpha and asset-specific risk)."

[[questions]]
text = "Which pair of assets diversifies best when combined?"
options = ["Correlation 0.95", "Correlation 0.70", "Correlation 0.10", "It makes no difference"]
correct = 2
explanation = "The lower the correlation, the more the moves offset each other and the less risk the combination has."

[[questions]]
text = "How do you compute an asset's beta?"
options = [
  "corr(asset, market)",
  "cov(asset, market) / var(market)",
  "vol(asset) / vol(market)",
  "return(asset) / return(market)",
]
correct = 1
explanation = "It's the slope of the regression of the asset's returns against the market's. It's also corr × vol_asset / vol_market."
