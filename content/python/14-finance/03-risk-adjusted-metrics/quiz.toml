[[questions]]
text = "Dos fondos rinden 12 % anual. A tiene una volatilidad del 10 % y B, del 25 %. Con una tasa libre de riesgo del 2 %, ¿cuál tiene mejor Sharpe?"
options = ["A: (12 − 2) / 10 = 1.0", "B: (12 − 2) / 25 = 0.4", "Son iguales", "No se puede calcular"]
correct = 0
explanation = "Mismo exceso de retorno con menos volatilidad: más retorno por unidad de riesgo."

[[questions]]
text = "¿Qué diferencia al Sortino del Sharpe?"
options = [
  "Usa el retorno compuesto",
  "Solo penaliza la volatilidad a la baja (desvío a la baja)",
  "No usa la tasa libre de riesgo",
  "Usa la beta",
]
correct = 1
explanation = "Las subas no son riesgo para el inversor. El Sortino divide por el desvío de los retornos por debajo del objetivo."

[[questions]]
text = "Una acción tiene beta 1.5. Si el mercado sube 4 %, ¿cuánto se espera que suba?"
options = ["4 %", "1.5 %", "6 %", "5.5 %"]
correct = 2
explanation = "La beta es la sensibilidad al mercado: 1.5 × 4 % = 6 % (sin contar el alfa ni el riesgo propio)."

[[questions]]
text = "¿Qué par de activos diversifica mejor al combinarlos?"
options = ["Correlación 0.95", "Correlación 0.70", "Correlación 0.10", "Da igual"]
correct = 2
explanation = "Cuanto menor es la correlación, más se compensan los movimientos y menos riesgo tiene la combinación."

[[questions]]
text = "¿Cómo se calcula la beta de un activo?"
options = [
  "corr(activo, mercado)",
  "cov(activo, mercado) / var(mercado)",
  "vol(activo) / vol(mercado)",
  "retorno(activo) / retorno(mercado)",
]
correct = 1
explanation = "Es la pendiente de la regresión de los retornos del activo contra los del mercado. También es corr × vol_activo / vol_mercado."
