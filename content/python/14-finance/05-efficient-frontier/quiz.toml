[[questions]]
text = "What is the efficient frontier?"
options = [
  "The portfolio with the highest return",
  "The set of portfolios with the highest possible return for each level of risk",
  "The portfolios with a Sharpe above 1",
  "The equal-weight portfolio",
]
correct = 1
explanation = "It's the upper edge of the risk-return cloud. Below it, there's always a better portfolio with the same risk."

[[questions]]
text = "What is `keepdims=True` for in `W /= W.sum(axis=1, keepdims=True)`?"
options = [
  "So W isn't modified",
  "So the sum has shape (n, 1) and broadcasting divides each row by its sum",
  "To sort the rows",
  "To make it faster",
]
correct = 1
explanation = "Without keepdims, the sum has shape (n,) and doesn't line up with the rows of an (n, 4) matrix."

[[questions]]
text = "What does `np.einsum('ij,jk,ik->i', W, cov, W)` compute?"
options = [
  "The return of each portfolio",
  "The variance wᵀΣw of each portfolio (each row of W)",
  "The covariance between portfolios",
  "The sum of the weights",
]
correct = 1
explanation = "For each row i, it sums W[i,j]·cov[j,k]·W[i,k] over j and k: the quadratic form row by row."

[[questions]]
text = "Why is it important to fix the seed in the simulation?"
options = [
  "So the results are reproducible (and testable)",
  "So the result is more optimal",
  "Because numpy requires it",
  "To make it faster",
]
correct = 0
explanation = "The same seed generates the same numbers. That way you can repeat the analysis and compare changes."

[[questions]]
text = "What is the main criticism of Markowitz optimization in practice?"
options = [
  "It's very slow",
  "It's very sensitive to estimation errors in expected returns: the weights change a lot with different data",
  "It doesn't support more than 4 assets",
  "It ignores volatility",
]
correct = 1
explanation = "Small changes in expected returns (which are estimated very poorly) produce very different, concentrated optimal weights."
