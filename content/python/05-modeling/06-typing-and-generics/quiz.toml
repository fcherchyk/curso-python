[[questions]]
text = "What's the modern (3.10+) way to write `Optional[str]`?"
options = ["`str?`", "`str | None`", "`Maybe[str]`", "`str or None`"]
correct = 1
explanation = "Since 3.10, unions are written with `|`. `Optional[str]` is equivalent, but you no longer need to import it."

[[questions]]
text = "`def double(x: int) -> int: return x * 2`. What happens with `double(\"ab\")` at runtime?"
options = [
  "It raises `TypeError`",
  "It returns `'abab'`: types aren't checked at runtime",
  "It converts `\"ab\"` to int",
  "It doesn't compile",
]
correct = 1
explanation = "Annotations don't change execution. mypy or pyright would flag the error before running."

[[questions]]
text = "In `def first[T](xs: Iterable[T]) -> T | None`, what does `T` guarantee?"
options = [
  "That `xs` is a list",
  "That the element type and the result type are the same",
  "That `T` is a number",
  "Nothing: it's just documentation with no effect on the type checker",
]
correct = 1
explanation = "The type variable ties input to output: if you pass an `Iterable[str]`, the type checker knows it returns `str | None`."

[[questions]]
text = "What is a `TypedDict` for?"
options = [
  "To create dicts that validate types at runtime",
  "To describe to the type checker the keys and types of a fixed-shape dict",
  "To create immutable dicts",
  "To sort the keys",
]
correct = 1
explanation = "At runtime it's a plain `dict`. It lets mypy know which keys exist and what type their values are, as with an API's JSON."

[[questions]]
text = "What's the better choice for a parameter that can be anything and that you'll only print?"
options = ["`Any`", "`object`", "An unbounded `T`", "Leave it unannotated"]
correct = 1
explanation = "`object` accepts anything but only lets you use what every object has. `Any` switches checking off entirely."
