[[questions]]
text = "A class has an `area()` method but doesn't inherit from `HasArea(Protocol)`. Does it satisfy the protocol for mypy?"
options = [
  "No: it has to inherit",
  "Yes: Protocols are structural",
  "Only if it's registered with `register()`",
  "Only if it has `@runtime_checkable`",
]
correct = 1
explanation = "A Protocol is satisfied by shape: having the methods with compatible signatures is enough, no inheritance needed."

[[questions]]
text = "A subclass of an ABC doesn't implement an `@abstractmethod`. When does it fail?"
options = [
  "When the class is defined",
  "When an instance is created",
  "When the missing method is called",
  "Never",
]
correct = 1
explanation = "The definition is valid, but instantiating a class with pending abstract methods raises `TypeError`."

[[questions]]
text = "What happens with `isinstance(x, MyProtocol)` if the Protocol does **not** have `@runtime_checkable`?"
options = ["It returns `True` if it has the methods", "It raises `TypeError`", "It always returns `False`", "It checks the signatures"]
correct = 1
explanation = "Protocols are for the type checker. To use them with `isinstance` you have to mark them with `@runtime_checkable`, and even then only the existence of the methods is checked."

[[questions]]
text = "You want every implementation to share a `send_to_all` method that calls `send`. What's the best fit?"
options = ["Protocol", "ABC", "A dict of functions", "An enum"]
correct = 1
explanation = "An ABC can have concrete methods that use the abstract ones (template method). Protocols describe a shape; they don't share implementation through inheritance."

[[questions]]
text = "Which annotation is most flexible for a parameter that's only iterated once?"
options = ["`list[str]`", "`Iterable[str]`", "`tuple[str, ...]`", "`set[str]`"]
correct = 1
explanation = "`Iterable` accepts lists, tuples, sets, generators and more. Accept the most abstract type you need."
