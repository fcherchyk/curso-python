[[questions]]
text = "With `class E(Enum): A = \"a\"`, what does `E.A == \"a\"` return?"
options = ["`True`", "`False`", "It raises `TypeError`", "`\"a\"`"]
correct = 1
explanation = "A plain `Enum` isn't equal to its value. You have to compare `E.A.value == \"a\"`, or use `StrEnum`, whose members are strings."

[[questions]]
text = "How do you get the member from its **value** `\"shipped\"`?"
options = ["`Status[\"shipped\"]`", "`Status(\"shipped\")`", "`Status.shipped`", "`Status.get(\"shipped\")`"]
correct = 1
explanation = "Calling the class looks up by value. Square brackets look up by **name** (`Status[\"SHIPPED\"]`)."

[[questions]]
text = "What concrete advantage does `StrEnum` have when serializing to JSON?"
options = [
  "None",
  "Members are `str`, so `json.dumps` serializes them directly",
  "It compresses the values",
  "It validates the JSON schema",
]
correct = 1
explanation = "Since each member is also a `str`, `json.dumps` treats it like a regular string, with no manual conversion."

[[questions]]
text = "In a `match`, what does `case PENDING:` (without the class name) do?"
options = [
  "Compares with `Status.PENDING`",
  "Captures any value into a variable named `PENDING`",
  "Raises `NameError`",
  "Compares with the string `\"PENDING\"`",
]
correct = 1
explanation = "A bare name in a pattern is a capture, and it always matches. To compare you need a dotted name: `case Status.PENDING:`."

[[questions]]
text = "To represent combinable permissions (read + write), what's the best fit?"
options = ["`StrEnum`", "`IntEnum`", "`Flag`", "A list of strings"]
correct = 2
explanation = "`Flag` lets you combine members with `|`, check with `in` and operate with `&`."
