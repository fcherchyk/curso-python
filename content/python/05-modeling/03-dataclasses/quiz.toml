[[questions]]
text = "What happens with `items: list[str] = []` inside a `@dataclass`?"
options = [
  "It works, but every instance shares the list",
  "It raises `ValueError` when the class is defined: you have to use `field(default_factory=list)`",
  "The default is ignored",
  "It's automatically turned into a `default_factory`",
]
correct = 1
explanation = "`dataclass` detects common mutable defaults and refuses to create the class. The fix is `field(default_factory=list)`."

[[questions]]
text = "Which two things does `frozen=True` give you?"
options = [
  "Type validation and serialization",
  "Immutability and a hash (usable in sets and as a key)",
  "Ordering and comparison",
  "Less memory and faster access",
]
correct = 1
explanation = "With `frozen=True`, assigning raises `FrozenInstanceError`, and `__hash__` is also generated from the fields. Less memory is `slots=True`."

[[questions]]
text = "With `@dataclass(order=True)` and fields `major, minor, patch`, how are two instances compared?"
options = [
  "By the sum of the fields",
  "As tuples `(major, minor, patch)`, in declaration order",
  "Only by the first field",
  "By the `repr`",
]
correct = 1
explanation = "`order=True` compares the fields as a tuple, following the order in which they were declared."

[[questions]]
text = "How do you get a copy of a frozen dataclass with one field changed?"
options = [
  "`obj.field = value`",
  "`dataclasses.replace(obj, field=value)`",
  "`copy.copy(obj, field=value)`",
  "You can't",
]
correct = 1
explanation = "`replace` creates a new instance with the given fields changed and leaves the original intact."

[[questions]]
text = "`@dataclass class P: price: float`. What happens with `P(\"pricey\")`?"
options = [
  "It raises `TypeError`",
  "It's created without error: dataclasses don't validate types",
  "It converts `\"pricey\"` to float",
  "It raises `ValueError`",
]
correct = 1
explanation = "Annotations aren't checked at runtime. To validate and convert external data there's Pydantic, or manual validation in `__post_init__`."
