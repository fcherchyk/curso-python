[[questions]]
text = "You define `__eq__` in a class and don't define `__hash__`. What happens with `{obj}`?"
options = [
  "It works, using the identity hash",
  "It raises `TypeError: unhashable type`",
  "It uses `__eq__` to compute the hash",
  "It returns an empty set",
]
correct = 1
explanation = "When you define `__eq__`, Python sets `__hash__ = None` so as not to break the \"equal implies same hash\" rule. You have to define `__hash__` explicitly."

[[questions]]
text = "What should `__add__` return if it gets a type it doesn't know how to add?"
options = ["`None`", "`NotImplemented`", "Raise `NotImplementedError`", "`False`"]
correct = 1
explanation = "`NotImplemented` tells Python to try the other operand's reflected method (`__radd__`). If nobody can, Python raises `TypeError`."

[[questions]]
text = "What do you see with `print([p])` if `p` has different `__repr__` and `__str__`?"
options = [
  "The `__str__` of `p`",
  "The `__repr__` of `p`",
  "`<Point object at …>`",
  "It raises `TypeError`",
]
correct = 1
explanation = "Containers show the `repr` of their elements, even when the container itself is printed with `str`."

[[questions]]
text = "Which method is needed for `3 * v` to work, if `v` is your Vector?"
options = ["`__mul__`", "`__rmul__`", "`__imul__`", "`__pow__`"]
correct = 1
explanation = "`int.__mul__(3, v)` returns `NotImplemented`, so Python tries `v.__rmul__(3)`, which handles the case where your object is the right operand."

[[questions]]
text = "A class implements only `__len__` and `__getitem__` with indexes. What does **not** work automatically?"
options = ["`for x in obj`", "`x in obj`", "`obj[1:3]`", "`obj + obj`"]
correct = 3
explanation = "Iteration, `in` and slicing (if you delegate to a list) all come from `__getitem__`. `+` needs `__add__`."
