[[questions]]
text = "What happens when you assign to a property that has no setter?"
options = [
  "A new attribute with that name is created",
  "It raises `AttributeError`",
  "It's silently ignored",
  "The getter is called",
]
correct = 1
explanation = "A property without a setter is read-only: assigning to it raises `AttributeError`."

[[questions]]
text = "Inside the getter `@property def price(self)`, what's wrong with `return self.price`?"
options = [
  "Nothing",
  "Infinite recursion: `self.price` calls the getter again",
  "It returns the function, not the value",
  "It raises `TypeError`",
]
correct = 1
explanation = "`self.price` goes through the property again. The real value is stored in another attribute, such as `self._price`."

[[questions]]
text = "Why does an alternative constructor use `cls(...)` instead of the class name?"
options = [
  "Because it's faster",
  "So that subclasses create instances of themselves",
  "Because the class name doesn't exist inside its methods",
  "By convention, with no practical difference",
]
correct = 1
explanation = "If `Employee` inherits from `Person`, `Employee.from_dict(...)` gets `cls = Employee` and creates an `Employee`."

[[questions]]
text = "In `__init__`, why is `self.price = price` (through the property) better than `self._price = price`?"
options = [
  "Because `_price` can't be assigned in `__init__`",
  "So the setter's validation also runs when the object is built",
  "Because it's shorter",
  "So the attribute is public",
]
correct = 1
explanation = "That way validation lives in one place and you can't create an object in an invalid state."

[[questions]]
text = "When is a property **not** a good fit?"
options = [
  "For a cheap derived value like `full_name`",
  "When the computation queries an API or a database",
  "To validate a value on assignment",
  "To turn an attribute into a computed one without changing the API",
]
correct = 1
explanation = "Whoever reads `obj.x` expects something instant and side-effect free. For expensive or I/O-bound computations, use a verb-named method or `cached_property`."
