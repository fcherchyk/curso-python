[[questions]]
text = "What does `df.plot(ax=ax)` return?"
options = ["A new figure", "The Axes it drew on", "The DataFrame", "None"]
correct = 1
explanation = "pandas' `.plot` methods return the Axes. With `ax=` they draw on one of yours, so you stay in control of the figure."

[[questions]]
text = "You want one line per branch with the months on the X axis. What shape must the DataFrame have before `.plot()`?"
options = [
  "One row per sale",
  "Index = month and one column per branch",
  "Index = branch and one column per month",
  "It doesn't matter: pandas figures it out",
]
correct = 1
explanation = "`df.plot()` puts the index on X and draws one line per column. `pivot_table(index='month', columns='branch', ...)` produces that shape."

[[questions]]
text = "What's the best title for a report chart?"
options = [
  "'Chart 1'",
  "'Sales'",
  "One that states the conclusion, like 'South leads March sales'",
  "None: the title is a distraction",
]
correct = 2
explanation = "If the chart has a message, the title says it, and the reader confirms it in the data."

[[questions]]
text = "Which of these is a good accessibility practice?"
options = [
  "Using red and green to tell series apart",
  "Using a colorblind-friendly palette and adding markers or line styles on top of color",
  "Using lots of different colors",
  "Avoiding legends",
]
correct = 1
explanation = "Red/green is the most problematic pair. `viridis`/`cividis`/`tableau-colorblind10`, together with markers or line styles, keep you from relying on color alone."

[[questions]]
text = "What does `ax.spines[['top', 'right']].set_visible(False)` do?"
options = [
  "Hides the X and Y axes",
  "Removes the top and right borders of the panel: less ink without losing information",
  "Rotates the labels",
  "Hides the grid",
]
correct = 1
explanation = "Those borders carry no data. Removing them cleans up the chart."
