[[questions]]
text = "Why is `fig, ax = plt.subplots()` plus `ax.plot(...)` recommended over `plt.plot(...)`?"
options = [
  "Because `plt.plot` is deprecated",
  "Because the OO API works with explicit objects, without relying on the global state of \"the current figure\"",
  "Because it's faster",
  "Because `plt.plot` doesn't support titles",
]
correct = 1
explanation = "With several charts or inside functions, pyplot's implicit state gets confusing. With `ax` you know exactly which chart you're talking to."

[[questions]]
text = "What is an `Axes` in matplotlib?"
options = [
  "The X or Y axis",
  "A single chart inside the figure (with its plotting area, axes, title and legend)",
  "The window",
  "A line type",
]
correct = 1
explanation = "A Figure can contain several Axes. Each X or Y axis is an *axis*, which is something else."

[[questions]]
text = "What does `ax.legend()` need to show names?"
options = [
  "Nothing",
  "The series must have been drawn with `label=\"...\"`",
  "A title must exist",
  "It must be called before `plot`",
]
correct = 1
explanation = "The legend takes the `label` of each line or bar. Without labels it's empty (and matplotlib warns you)."

[[questions]]
text = "On a headless server (or in tests), which backend do you use?"
options = ["`\"TkAgg\"`", "`\"Agg\"`", "`\"Qt5Agg\"`", "None: you can't plot"]
correct = 1
explanation = "`Agg` renders to an image without needing windows. You enable it with `matplotlib.use(\"Agg\")` or with `MPLBACKEND=Agg`."

[[questions]]
text = "Why is it a good idea to call `plt.close(fig)` after saving?"
options = [
  "To delete the file",
  "To free memory: open figures pile up (important in loops and servers)",
  "So the chart gets saved",
  "It has no effect",
]
correct = 1
explanation = "pyplot keeps a reference to every figure it creates. If you don't close them, a process that generates many charts uses more and more memory."
