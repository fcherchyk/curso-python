[[questions]]
text = "What does `plt.subplots(2, 3)` return?"
options = [
  "A figure and a single Axes",
  "A figure and a 2x3 array of Axes",
  "A list of 6 figures",
  "Six (fig, ax) tuples",
]
correct = 1
explanation = "`fig, axs = plt.subplots(2, 3)`: `axs[r, c]` accesses each panel and `axs.flat` iterates over them."

[[questions]]
text = "You compare the sales of 3 branches in 3 panels. Why use `sharey=True`?"
options = [
  "So it draws faster",
  "So they all have the same Y scale and the comparison of magnitudes is honest",
  "So they share colors",
  "To put a single legend",
]
correct = 1
explanation = "With independent scales, a panel worth 10 times more can look the same as another one."

[[questions]]
text = "How does a price growing at a constant 10% per year look on a logarithmic scale?"
options = ["Like an exponential curve", "Like a straight line", "Like a parabola", "It can't be plotted"]
correct = 1
explanation = "On a log scale, equal multiplications take up equal distances, so constant compound growth shows up as a straight line."

[[questions]]
text = "What does `ax.text(0.02, 0.95, 'note', transform=ax.transAxes)` do?"
options = [
  "Puts the text at the data point x=0.02, y=0.95",
  "Puts the text at the top left of the panel, regardless of the data scale",
  "Puts the text outside the figure",
  "Raises an error",
]
correct = 1
explanation = "With `transAxes`, coordinates are relative to the panel: (0, 0) is the bottom left and (1, 1) the top right."

[[questions]]
text = "Why is a dual Y axis (`twinx`) discouraged?"
options = [
  "Because it doesn't exist in matplotlib",
  "Because, by moving each axis's range, you can suggest any correlation",
  "Because it's slow",
  "Because it doesn't support legends",
]
correct = 1
explanation = "Two arbitrary scales in the same panel mislead easily. It's better to use two subplots with `sharex=True`."
