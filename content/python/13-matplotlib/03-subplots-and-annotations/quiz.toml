[[questions]]
text = "¿Qué devuelve `plt.subplots(2, 3)`?"
options = [
  "Una figura y un único Axes",
  "Una figura y un array 2x3 de Axes",
  "Una lista de 6 figuras",
  "Seis tuplas (fig, ax)",
]
correct = 1
explanation = "`fig, axs = plt.subplots(2, 3)`: `axs[f, c]` accede a cada panel y `axs.flat` los recorre."

[[questions]]
text = "Comparás las ventas de 3 sucursales en 3 paneles. ¿Por qué usar `sharey=True`?"
options = [
  "Para que se dibuje más rápido",
  "Para que todos tengan la misma escala Y y la comparación de magnitudes sea honesta",
  "Para que compartan colores",
  "Para poner una sola leyenda",
]
correct = 1
explanation = "Con escalas independientes, un panel que vale 10 veces más puede verse igual que otro."

[[questions]]
text = "Un precio que crece a una tasa constante del 10 % anual, ¿cómo se ve en escala logarítmica?"
options = ["Como una curva exponencial", "Como una recta", "Como una parábola", "No se puede graficar"]
correct = 1
explanation = "En escala log, multiplicaciones iguales ocupan distancias iguales, y un crecimiento compuesto constante queda como una recta."

[[questions]]
text = "¿Qué hace `ax.text(0.02, 0.95, 'nota', transform=ax.transAxes)`?"
options = [
  "Pone el texto en el dato x=0.02, y=0.95",
  "Pone el texto arriba a la izquierda del panel, sin importar la escala de los datos",
  "Pone el texto fuera de la figura",
  "Da error",
]
correct = 1
explanation = "Con `transAxes`, las coordenadas son relativas al panel: (0, 0) es abajo a la izquierda y (1, 1) arriba a la derecha."

[[questions]]
text = "¿Por qué se desaconseja el doble eje Y (`twinx`)?"
options = [
  "Porque no existe en matplotlib",
  "Porque, moviendo los rangos de cada eje, se puede sugerir cualquier correlación",
  "Porque es lento",
  "Porque no admite leyendas",
]
correct = 1
explanation = "Dos escalas arbitrarias en el mismo panel engañan con facilidad. Es mejor usar dos subplots con `sharex=True`."
