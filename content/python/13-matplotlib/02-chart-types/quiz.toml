[[questions]]
text = "Querés comparar la facturación de 8 sucursales. ¿Qué gráfico conviene?"
options = [
  "Líneas",
  "Barras ordenadas por valor",
  "Torta",
  "Dispersión",
]
correct = 1
explanation = "Para comparar categorías sin orden natural, barras ordenadas. Una línea sugiere una continuidad inexistente y una torta con 8 porciones es ilegible."

[[questions]]
text = "¿Por qué el eje Y de un gráfico de barras debería empezar en 0?"
options = [
  "Por estética",
  "Porque el largo de la barra representa el valor: cortar el eje exagera las diferencias",
  "Porque matplotlib lo exige",
  "No importa",
]
correct = 1
explanation = "Con el eje cortado, una diferencia del 2 % puede verse como el doble. En los gráficos de líneas no es tan crítico."

[[questions]]
text = "¿Para qué sirve `alpha=0.5` en un scatter con miles de puntos?"
options = [
  "Para achicar los puntos",
  "Para hacerlos semitransparentes y ver dónde se concentran",
  "Para cambiar el color",
  "Para ordenarlos",
]
correct = 1
explanation = "Con transparencia, las zonas densas se ven más oscuras: así se evita que los puntos se tapen entre sí."

[[questions]]
text = "¿Qué muestra un histograma?"
options = [
  "La evolución en el tiempo",
  "Cuántos valores caen en cada rango: la distribución",
  "La relación entre dos variables",
  "La proporción de cada categoría",
]
correct = 1
explanation = "Agrupa los valores en intervalos (`bins`) y cuenta. La cantidad de bins cambia mucho la lectura."

[[questions]]
text = "¿Dónde quedan las barras dibujadas con `ax.bar(...)` para inspeccionarlas?"
options = ["En `ax.get_lines()`", "En `ax.patches` (y en el BarContainer devuelto)", "En `ax.texts`", "No se pueden inspeccionar"]
correct = 1
explanation = "Cada barra es un `Rectangle` en `ax.patches`. `get_height()` da su valor."
