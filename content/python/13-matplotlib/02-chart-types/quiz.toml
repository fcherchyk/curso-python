[[questions]]
text = "You want to compare the revenue of 8 branches. Which chart should you use?"
options = [
  "Lines",
  "Bars sorted by value",
  "Pie",
  "Scatter",
]
correct = 1
explanation = "To compare categories with no natural order, use sorted bars. A line suggests a continuity that doesn't exist, and a pie with 8 slices is unreadable."

[[questions]]
text = "Why should the Y axis of a bar chart start at 0?"
options = [
  "For looks",
  "Because the length of the bar represents the value: cutting the axis exaggerates the differences",
  "Because matplotlib requires it",
  "It doesn't matter",
]
correct = 1
explanation = "With a cut axis, a 2% difference can look like double. In line charts it's not as critical."

[[questions]]
text = "What is `alpha=0.5` for in a scatter plot with thousands of points?"
options = [
  "To make the points smaller",
  "To make them semi-transparent so you can see where they concentrate",
  "To change the color",
  "To sort them",
]
correct = 1
explanation = "With transparency, dense areas look darker: that keeps points from hiding each other."

[[questions]]
text = "What does a histogram show?"
options = [
  "The trend over time",
  "How many values fall in each range: the distribution",
  "The relationship between two variables",
  "The share of each category",
]
correct = 1
explanation = "It groups the values into intervals (`bins`) and counts them. The number of bins changes the reading a lot."

[[questions]]
text = "Where do the bars drawn with `ax.bar(...)` end up so you can inspect them?"
options = ["In `ax.get_lines()`", "In `ax.patches` (and in the returned BarContainer)", "In `ax.texts`", "You can't inspect them"]
correct = 1
explanation = "Each bar is a `Rectangle` in `ax.patches`. `get_height()` gives its value."
