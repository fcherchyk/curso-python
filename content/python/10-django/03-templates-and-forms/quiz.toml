[[questions]]
text = "In a `forms.Form`, what is a `clean_email` method for?"
options = [
  "To delete the email field",
  "To validate and/or transform only the `email` field, returning the cleaned value",
  "To validate all the fields",
  "To render the field as HTML",
]
correct = 1
explanation = "`clean_<field>` runs after the field's own validation. For rules across fields there's `clean()`."

[[questions]]
text = "A POST with invalid data hits a form view. What is the idiomatic response?"
options = [
  "Redirect to the same page",
  "Re-render the same form (bound to the data), which already carries the values and the errors",
  "Return a JSON with the errors",
  "Raise `Http404`",
]
correct = 1
explanation = "The bound form keeps what was entered and exposes `errors`. The redirect is used only when the POST succeeded (PRG)."

[[questions]]
text = "What happens to a POST without `{% csrf_token %}` when `CsrfViewMiddleware` is active?"
options = ["It's processed normally", "Django responds 403", "It responds 400", "The body is ignored"]
correct = 1
explanation = "The middleware requires the token on modifying methods (POST, PUT, DELETE…). Without it, it rejects with 403 Forbidden."

[[questions]]
text = "What does `{% empty %}` do inside a `{% for %}` in a Django template?"
options = [
  "Empties the list",
  "Defines what to show when the list is empty",
  "Breaks out of the loop",
  "It's an error",
]
correct = 1
explanation = "It's the equivalent of `{% else %}` in Jinja2's `for`."

[[questions]]
text = "Why can't you write `{{ product.discounted_price(10) }}` in a Django template?"
options = [
  "Because of a bug",
  "Because the template language doesn't allow calling functions with arguments: that logic goes in the view or in a filter",
  "Because `|safe` is missing",
  "Actually you can",
]
correct = 1
explanation = "It's a deliberate restriction: templates stay simple. Compute it in the view or write a filter or template tag."
