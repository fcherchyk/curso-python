[[questions]]
text = "En un `forms.Form`, ¿para qué sirve un método `clean_email`?"
options = [
  "Para borrar el campo email",
  "Para validar y/o transformar solo el campo `email`, devolviendo el valor limpio",
  "Para validar todos los campos",
  "Para dibujar el campo en HTML",
]
correct = 1
explanation = "`clean_<campo>` corre después de la validación propia del campo. Para reglas entre campos está `clean()`."

[[questions]]
text = "Un POST con datos inválidos en la vista de un formulario. ¿Qué es lo idiomático?"
options = [
  "Redirigir a la misma página",
  "Volver a renderizar el mismo form (ligado a los datos), que ya trae los valores y los errores",
  "Devolver un JSON con los errores",
  "Levantar `Http404`",
]
correct = 1
explanation = "El form ligado conserva lo cargado y expone `errors`. El redirect se usa solo cuando el POST fue exitoso (PRG)."

[[questions]]
text = "¿Qué pasa con un POST sin `{% csrf_token %}` cuando está activo `CsrfViewMiddleware`?"
options = ["Se procesa normalmente", "Django responde 403", "Responde 400", "Se ignora el body"]
correct = 1
explanation = "El middleware exige el token en los métodos que modifican (POST, PUT, DELETE…). Sin él, rechaza con 403 Forbidden."

[[questions]]
text = "¿Qué hace `{% empty %}` dentro de un `{% for %}` en una plantilla de Django?"
options = [
  "Vacía la lista",
  "Define qué mostrar cuando la lista está vacía",
  "Corta el bucle",
  "Es un error",
]
correct = 1
explanation = "Es el equivalente al `{% else %}` del `for` de Jinja2."

[[questions]]
text = "¿Por qué no podés escribir `{{ producto.precio_con_descuento(10) }}` en una plantilla de Django?"
options = [
  "Por un bug",
  "Porque el lenguaje de plantillas no permite llamar funciones con argumentos: esa lógica va en la vista o en un filtro",
  "Porque falta `|safe`",
  "Sí se puede",
]
correct = 1
explanation = "Es una restricción deliberada: las plantillas se mantienen simples. Se calcula en la vista o se escribe un filtro o template tag."
