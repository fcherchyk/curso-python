[[questions]]
text = "Which method do you override in a `ListView` to filter by the request's `?q=`?"
options = ["`get_context_data`", "`get_queryset`", "`as_view`", "`dispatch`"]
correct = 1
explanation = "`get_queryset` decides which objects are listed. `get_context_data` adds variables to the template."

[[questions]]
text = "Why `success_url = reverse_lazy(\"list\")` and not `reverse(\"list\")`?"
options = [
  "Because `reverse` is deprecated",
  "Because the attribute is evaluated when the class is defined, before the URLs are loaded; `reverse_lazy` resolves it only when it's used",
  "Because it's faster",
  "There's no difference",
]
correct = 1
explanation = "`reverse` in a class attribute can fail because of a circular import or because the URLs aren't ready. `reverse_lazy` defers the resolution."

[[questions]]
text = "A `CreateView` receives a POST with invalid data. What does it do?"
options = [
  "Responds 400 in JSON",
  "Re-renders the form with the errors",
  "Redirects to `success_url`",
  "Raises an exception",
]
correct = 1
explanation = "It implements the full pattern: if valid, it saves and redirects; if not, it re-renders the form with the errors (`form_invalid`)."

[[questions]]
text = "With `paginate_by = 10` in a `ListView`, how do you request the second page?"
options = ["`/books/2/`", "`/books/?page=2`", "`/books/?p=2`", "You can't"]
correct = 1
explanation = "The default parameter is `page`. The template receives `page_obj` and `paginator` to build the navigation."

[[questions]]
text = "What does `list_display` control in a `ModelAdmin`?"
options = [
  "The fields of the edit form",
  "The columns shown in the admin list",
  "The permissions",
  "The order of the URLs",
]
correct = 1
explanation = "`list_display` defines the columns; `search_fields`, the search; and `list_filter`, the side filters."
