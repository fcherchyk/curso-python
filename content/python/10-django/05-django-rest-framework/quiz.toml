[[questions]]
text = "What does `serializer.is_valid(raise_exception=True)` do if the data is invalid?"
options = [
  "Returns False",
  "Raises an exception that DRF turns into a 400 with the errors per field",
  "Fixes the data",
  "Responds 422",
]
correct = 1
explanation = "DRF catches the `ValidationError` and responds 400 with a JSON like `{\"field\": [\"message\"]}`."

[[questions]]
text = "A field is in `read_only_fields`. What happens if the client sends it in a POST?"
options = [
  "Error 400",
  "It's ignored on input, but it appears in the response",
  "It's saved anyway",
  "Error 500",
]
correct = 1
explanation = "Read-only fields are serialized on output but not accepted on input, like the `id` or a creation date."

[[questions]]
text = "What does `router.register(\"tasks\", TaskViewSet)` generate with a `ModelViewSet`?"
options = [
  "Only `GET /tasks/`",
  "The list, create, detail, update and delete URLs for the resource",
  "A new model",
  "The admin",
]
correct = 1
explanation = "The router maps HTTP methods to the viewset's actions (list, create, retrieve, update, partial_update, destroy) and adds the `@action` ones."

[[questions]]
text = "What is `@action(detail=True, methods=[\"post\"])` for in a viewset?"
options = [
  "To make the viewset asynchronous",
  "To add an extra endpoint on an object, like `POST /tasks/{pk}/complete/`",
  "To validate the serializer",
  "To change the resource name",
]
correct = 1
explanation = "With `detail=True` the route includes the pk; with `detail=False` it's on the collection (`/tasks/pending/`)."

[[questions]]
text = "In DRF, where do you get the already parsed body (JSON or form)?"
options = ["`request.body`", "`request.data`", "`request.POST`", "`request.json`"]
correct = 1
explanation = "`request.data` unifies the formats. Django's `request.POST` only understands forms."
