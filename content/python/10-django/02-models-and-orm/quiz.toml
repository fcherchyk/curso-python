[[questions]]
text = "When does `qs = Product.objects.filter(active=True).order_by(\"price\")` query the database?"
options = [
  "Immediately, when `filter` is called",
  "Only when it is evaluated: when you iterate it, convert it to a list, call `len()`, etc.",
  "When `order_by` is called",
  "Never, until you call `.execute()`",
]
correct = 1
explanation = "QuerySets are lazy: chaining filters only builds the query, which runs when the data is needed."

[[questions]]
text = "What does `Product.objects.filter(category__name=\"Pantry\")` do?"
options = [
  "Looks up a field called `category__name`",
  "Follows the FK to Category and filters by its name (JOIN)",
  "Raises a syntax error",
  "Filters products whose name is Pantry",
]
correct = 1
explanation = "The double underscore traverses relationships and also separates lookups (`price__lte`)."

[[questions]]
text = "Why is `update(price=F(\"price\") * 1.1)` better than looping over the objects and calling `save()`?"
options = [
  "Because `save()` doesn't work with decimals",
  "Because it runs as a single SQL query, in the database, with no race conditions",
  "Because `F` validates the prices",
  "There's no difference",
]
correct = 1
explanation = "`F` references the column's current value, so the calculation happens in SQL. Fetching, modifying and saving is slow and can overwrite concurrent changes."

[[questions]]
text = "You loop over 100 products and access `p.category.name`. What should you use?"
options = [
  "`prefetch_related(\"category\")`",
  "`select_related(\"category\")` (a JOIN for the FK)",
  "Nothing, Django already optimizes it",
  "`values()`",
]
correct = 1
explanation = "`select_related` resolves FKs and one-to-one with a JOIN. `prefetch_related` is for \"many\" relationships (reverse FK and many-to-many)."

[[questions]]
text = "What does `Product.objects.get(name=\"missing\")` raise?"
options = ["It returns `None`", "`Product.DoesNotExist`", "`KeyError`", "`Http404`"]
correct = 1
explanation = "`get` expects exactly one result. For \"the first one or None\" there's `.filter(...).first()`, and in views, `get_object_or_404`."
