[[questions]]
text = "What does a Django function view receive as its first argument?"
options = ["Nothing: the request is global", "The `request` object", "The query string parameters", "The app"]
correct = 1
explanation = "Unlike Flask, Django passes the request explicitly to the view. Path parameters come after it."

[[questions]]
text = "What is `name=\"detail\"` for in `path(\"products/<int:id>/\", views.detail, name=\"detail\")`?"
options = [
  "To name the function",
  "To build the URL with `reverse(\"detail\", args=[id])` or `{% url %}` instead of writing it by hand",
  "For the page title",
  "It is required and has no other effect",
]
correct = 1
explanation = "Named URLs can be reversed. If the route changes, every link updates."

[[questions]]
text = "Why does `JsonResponse([1, 2, 3])` raise an error?"
options = [
  "Because JSON doesn't support lists",
  "Because by default it requires a dict; for other types you have to pass `safe=False`",
  "Because the status is missing",
  "Because lists are returned with `HttpResponse`",
]
correct = 1
explanation = "It's a historical protection against JSON hijacking. With `safe=False` it accepts any serializable value."

[[questions]]
text = "What is the difference between a project and an app in Django?"
options = [
  "They are the same thing",
  "The project holds the global configuration and the root URLs; apps group the models, views and URLs of each area",
  "The app is the server and the project is the code",
  "The project only exists in production",
]
correct = 1
explanation = "A project contains several apps enabled in `INSTALLED_APPS`. Each app can be reused in other projects."

[[questions]]
text = "A view decorated with `@require_http_methods([\"GET\"])` receives a POST. What does it respond?"
options = ["404", "405 Method Not Allowed", "400", "200"]
correct = 1
explanation = "The decorator rejects disallowed methods with 405 without running the view."
