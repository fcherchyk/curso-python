[[questions]]
text = "After `User.objects.create_user(\"alice\", password=\"secret\")`, what is in `u.password`?"
options = [
  "`\"secret\"`",
  "A hash like `pbkdf2_sha256$...` (with salt and iterations)",
  "`None`",
  "The password encrypted in a reversible way",
]
correct = 1
explanation = "Django stores only the hash. You verify it with `check_password`; the original password can't be recovered."

[[questions]]
text = "What does `@login_required` do with an anonymous user?"
options = [
  "Responds 403",
  "Redirects to `LOGIN_URL` with `?next=` pointing to the requested page",
  "Responds 401",
  "Shows the view anyway",
]
correct = 1
explanation = "It redirects to the login and, thanks to `next`, after logging in the user goes back where they wanted to go. For APIs a 401 or 403 is usually preferred."

[[questions]]
text = "Why is `get_user_model()` better than importing `django.contrib.auth.models.User`?"
options = [
  "For performance",
  "Because the project may use its own user model (`AUTH_USER_MODEL`)",
  "Because `User` is deprecated",
  "There's no difference",
]
correct = 1
explanation = "If the project defines its own user, importing `User` directly points to the wrong model."

[[questions]]
text = "A logged-in user tries to delete a note that isn't theirs. What's the right response?"
options = [
  "Redirect to the login",
  "403 (`PermissionDenied`), or filter by owner and respond 404",
  "Delete it anyway",
  "500",
]
correct = 1
explanation = "They're authenticated but not authorized on that object. Filtering the queryset by `request.user` also avoids revealing that the note exists."

[[questions]]
text = "What does `client.force_login(user)` do in a test?"
options = [
  "Changes the user's password",
  "Logs in as that user without going through the login form",
  "Creates a superuser",
  "Disables authentication",
]
correct = 1
explanation = "It sets up the session directly. It saves time and avoids depending on the login view in every test."
