[[questions]]
text = "¿Qué devuelve `np.array([1, 2, 3]) * np.array([4, 5, 6])`?"
options = ["`32` (producto escalar)", "`[4, 10, 18]`", "Una lista repetida", "Error"]
correct = 1
explanation = "Los operadores son elemento a elemento. El producto escalar es `np.dot(a, b)` o `a @ b`."

[[questions]]
text = "¿Cuál es la forma vectorizada de \"si el precio es mayor a 200, aplicar 10 % de descuento\"?"
options = [
  "`[p * 0.9 if p > 200 else p for p in precios]`",
  "`np.where(precios > 200, precios * 0.9, precios)`",
  "`np.vectorize(...)`",
  "`if precios > 200: precios *= 0.9`",
]
correct = 1
explanation = "`np.where` evalúa la condición sobre todo el array y elige elemento a elemento. El `if` sobre un array levanta un error de ambigüedad."

[[questions]]
text = "¿Por qué `np.append` dentro de un bucle es una mala idea?"
options = [
  "Porque no existe",
  "Porque crea un array nuevo y copia todo en cada llamada: el bucle queda O(n²)",
  "Porque cambia el dtype",
  "Porque no se puede usar con floats",
]
correct = 1
explanation = "Los arrays tienen tamaño fijo. Hay que construirlos de una vez, o juntar en una lista y convertir al final."

[[questions]]
text = "¿Acelera `np.vectorize(f)` una función de Python?"
options = [
  "Sí, la compila a C",
  "No: es esencialmente un bucle de Python; sirve por comodidad, no por velocidad",
  "Sí, la paraleliza",
  "Solo con floats",
]
correct = 1
explanation = "La documentación lo aclara: es por conveniencia. Para acelerar de verdad: ufuncs, reformular la operación o Numba."

[[questions]]
text = "¿Qué calcula `precios[1:] / precios[:-1] - 1`?"
options = [
  "El precio promedio",
  "La variación porcentual de cada día respecto del anterior",
  "El precio máximo",
  "Un error de forma",
]
correct = 1
explanation = "Divide cada precio por el anterior (el array corrido un lugar). Es el retorno diario, `pct_change` en pandas."
