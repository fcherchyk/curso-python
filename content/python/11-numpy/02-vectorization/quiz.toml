[[questions]]
text = "What does `np.array([1, 2, 3]) * np.array([4, 5, 6])` return?"
options = ["`32` (dot product)", "`[4, 10, 18]`", "A repeated list", "Error"]
correct = 1
explanation = "Operators work element-wise. The dot product is `np.dot(a, b)` or `a @ b`."

[[questions]]
text = "What is the vectorized way to say \"if the price is greater than 200, apply a 10% discount\"?"
options = [
  "`[p * 0.9 if p > 200 else p for p in prices]`",
  "`np.where(prices > 200, prices * 0.9, prices)`",
  "`np.vectorize(...)`",
  "`if prices > 200: prices *= 0.9`",
]
correct = 1
explanation = "`np.where` evaluates the condition over the whole array and chooses element by element. An `if` on an array raises an ambiguity error."

[[questions]]
text = "Why is `np.append` inside a loop a bad idea?"
options = [
  "Because it doesn't exist",
  "Because it creates a new array and copies everything on every call: the loop becomes O(n²)",
  "Because it changes the dtype",
  "Because it can't be used with floats",
]
correct = 1
explanation = "Arrays have a fixed size. Build them all at once, or collect into a list and convert at the end."

[[questions]]
text = "Does `np.vectorize(f)` speed up a Python function?"
options = [
  "Yes, it compiles it to C",
  "No: it's essentially a Python loop; it's there for convenience, not speed",
  "Yes, it parallelizes it",
  "Only with floats",
]
correct = 1
explanation = "The documentation says so: it's for convenience. To really speed things up: ufuncs, reformulating the operation, or Numba."

[[questions]]
text = "What does `prices[1:] / prices[:-1] - 1` compute?"
options = [
  "The average price",
  "The percentage change of each day relative to the previous one",
  "The maximum price",
  "A shape error",
]
correct = 1
explanation = "It divides each price by the previous one (the array shifted by one position). It's the daily return, `pct_change` in pandas."
