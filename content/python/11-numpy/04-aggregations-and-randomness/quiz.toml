[[questions]]
text = "In a sales matrix with days in the rows and products in the columns, what does `sales.sum(axis=0)` give?"
options = [
  "The total per day",
  "The total per product",
  "The grand total",
  "The cumulative sum",
]
correct = 1
explanation = "`axis=0` collapses the rows (the days): you get one result per column, that is, per product."

[[questions]]
text = "What does `np.array([1.0, np.nan, 3.0]).mean()` return?"
options = ["`2.0`", "`nan`", "`1.33`", "It raises an error"]
correct = 1
explanation = "A `nan` contaminates the result. To ignore it: `np.nanmean`."

[[questions]]
text = "Why is `np.random.default_rng(seed)` recommended over `np.random.seed(seed)`?"
options = [
  "Because it's faster",
  "Because it creates an independent generator you can pass as a parameter, with no shared global state",
  "Because `seed` doesn't exist",
  "Because it generates more random numbers",
]
correct = 1
explanation = "Global state can be altered by any code. Your own generator makes functions reproducible and testable."

[[questions]]
text = "What is the difference between `v.std()` and `v.std(ddof=1)`?"
options = [
  "None",
  "The first is the population standard deviation (divides by n) and the second is the sample one (divides by n-1)",
  "The second ignores nan values",
  "The first rounds",
]
correct = 1
explanation = "NumPy uses `ddof=0` by default and pandas uses `ddof=1`. With small samples the difference is noticeable."

[[questions]]
text = "What does `(rng.integers(1, 7, size=(100_000, 2)).sum(axis=1) == 7).mean()` compute?"
options = [
  "The average of the dice",
  "A Monte Carlo estimate of the probability that two dice add up to 7",
  "The number of sevens",
  "An error: `integers` doesn't include 6",
]
correct = 1
explanation = "It simulates 100,000 rolls of two dice, sums each row and computes the proportion of sevens (≈ 1/6). The 7 in `integers` is excluded: values go from 1 to 6."
