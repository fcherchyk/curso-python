[[questions]]
text = "Why does `v[v > 0 and v < 5]` fail?"
options = [
  "Because masks don't exist",
  "Because `and` tries to convert an array to a single bool; you have to use `(v > 0) & (v < 5)`",
  "Because `np.where` is missing",
  "It doesn't fail",
]
correct = 1
explanation = "With arrays you use the bitwise operators `&`, `|` and `~`, with parentheses because of precedence."

[[questions]]
text = "What does `(np.array([3, -1, 4, -5]) < 0).sum()` return?"
options = ["`-6`", "`2`", "`[False True False True]`", "`True`"]
correct = 1
explanation = "The mask has two `True` values, and when summing, `True` counts as 1."

[[questions]]
text = "Are the shapes `(4, 3)` and `(3,)` compatible for broadcasting?"
options = [
  "No, they have a different number of dimensions",
  "Yes: `(3,)` is treated as `(1, 3)` and stretched to `(4, 3)`",
  "Only with `keepdims=True`",
  "Only if they are of type float",
]
correct = 1
explanation = "They are compared from the right: 3 and 3 are equal, and the missing dimension counts as 1."

[[questions]]
text = "With `m` of shape `(5, 3)`, what shape does `m.mean(axis=1, keepdims=True)` have?"
options = ["`(5,)`", "`(5, 1)`", "`(1, 3)`", "`(3,)`"]
correct = 1
explanation = "Axis 1 (the columns) is reduced, but `keepdims` keeps it with size 1. That way you can subtract it from `m` row by row."

[[questions]]
text = "What does `np.argmax(np.array([7, 2, 9, 4]))` return?"
options = ["`9`", "`2`", "`3`", "`[False, False, True, False]`"]
correct = 1
explanation = "`argmax` returns the **position** of the maximum (index 2), not the value. It's useful for looking things up in a parallel array (`names[np.argmax(sales)]`)."
