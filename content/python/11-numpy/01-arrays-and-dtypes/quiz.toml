[[questions]]
text = "What `dtype` does `np.array([1, 2, 3.5])` have?"
options = ["`int64`", "`float64`", "`object`", "Mixed: two ints and a float"]
correct = 1
explanation = "An array has a single type. When you mix integers and floats, NumPy picks the more general one: `float64`."

[[questions]]
text = "With `v = np.arange(5); s = v[1:3]; s[0] = 99`, what is `v`?"
options = ["`[0 1 2 3 4]`", "`[0 99 2 3 4]`", "`[99 1 2 3 4]`", "Error"]
correct = 1
explanation = "NumPy slices are views over the same data. For an independent slice, use `.copy()`."

[[questions]]
text = "What `shape` does `np.zeros((2, 3)).T` have?"
options = ["`(2, 3)`", "`(3, 2)`", "`(6,)`", "`(3,)`"]
correct = 1
explanation = "`.T` transposes: rows become columns."

[[questions]]
text = "What does `-1` do in `a.reshape(-1, 4)`?"
options = [
  "Reverses the array",
  "Asks NumPy to compute that dimension so that all the elements fit",
  "Drops the last row",
  "It's an error",
]
correct = 1
explanation = "With 12 elements, `reshape(-1, 4)` gives `(3, 4)`. Only one dimension can be -1."

[[questions]]
text = "What is the right way to access row 1, column 2 of a NumPy matrix?"
options = ["`m[1][2]` (the only way)", "`m[1, 2]`", "`m(1, 2)`", "`m.get(1, 2)`"]
correct = 1
explanation = "`m[1][2]` also works, but it creates an intermediate view. `m[1, 2]` is the idiomatic and more efficient form, and it also allows `m[:, 2]`."
