[[questions]]
text = "In `errors = only_errors(parse(read(\"a.log\")))`, how many lines have been read after that assignment?"
options = ["All of them", "One", "None", "It depends on the file size"]
correct = 2
explanation = "The stages are generators: building the pipeline runs nothing. Reading only happens when someone asks for elements."

[[questions]]
text = "Why does `in_batches` do `it = iter(iterable)` before the loop?"
options = [
  "To turn the iterable into a list",
  "So each `islice` picks up where the previous one left off, even if the argument is a list",
  "Because `islice` doesn't accept lists",
  "To be able to use `len()`",
]
correct = 1
explanation = "With a list, each `islice(lst, n)` would start from the beginning and the loop would never end. By sharing a single iterator, each batch continues from where the previous one ended."

[[questions]]
text = "What is the equivalent of `xs[:10]` for an iterator?"
options = ["`it[:10]`", "`itertools.islice(it, 10)`", "`list(it)[:10]`", "`next(it, 10)`"]
correct = 1
explanation = "Iterators don't support slicing. `islice` cuts them lazily. `list(it)[:10]` works, but consumes the whole iterator."

[[questions]]
text = "A malformed line reaches the parsing stage. What is the usual approach in a data pipeline?"
options = [
  "Let the exception stop all processing",
  "Skip it and record it (log or counter) to keep going with the rest",
  "Restart the pipeline from the beginning",
  "Turn it into `None` and keep passing it along",
]
correct = 1
explanation = "Real data always has garbage. Skipping and recording keeps the pipeline running and leaves a trail of what was discarded."

[[questions]]
text = "You need the total bytes and also the top 10 IPs from the same pipeline. What problem comes up?"
options = [
  "None: generators can be iterated several times",
  "The pipeline is consumed once: you have to compute both in a single pass or rebuild it",
  "`sum` doesn't work with generators",
  "You have to use threads",
]
correct = 1
explanation = "After the first pass, the generator is empty. You have to accumulate both metrics in the same loop or build the pipeline again."
