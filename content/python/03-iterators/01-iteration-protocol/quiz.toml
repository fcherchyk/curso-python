[[questions]]
text = "Given `gen = (x for x in [1, 2, 3])`, what does `list(gen), list(gen)` return?"
options = [
  "`([1, 2, 3], [1, 2, 3])`",
  "`([1, 2, 3], [])`",
  "`([], [])`",
  "Raises `StopIteration`",
]
correct = 1
explanation = "A generator is an iterator: it is consumed only once. The second time there are no elements left."

[[questions]]
text = "What must `__iter__` return in an **iterable** (like a list)?"
options = [
  "`self`",
  "A new iterator every time",
  "The first element",
  "A list with all the elements",
]
correct = 1
explanation = "An iterable hands out a new iterator on every `iter()` call, which is why it can be iterated many times. The one that returns `self` is an **iterator**."

[[questions]]
text = "How does `__next__` signal that there are no more elements?"
options = ["Returns `None`", "Raises `StopIteration`", "Returns `False`", "Raises `IndexError`"]
correct = 1
explanation = "The protocol uses the `StopIteration` exception. The `for` loop catches it and ends the loop."

[[questions]]
text = "What does `next(iter([]), \"empty\")` return?"
options = ["`None`", "`'empty'`", "Raises `StopIteration`", "`[]`"]
correct = 1
explanation = "With a second argument, `next` returns that default value instead of raising `StopIteration`."

[[questions]]
text = "A function iterates over its `data` parameter twice (once for the total, once for the percentages). Which argument makes it fail silently?"
options = ["A list", "A tuple", "A generator", "A `range`"]
correct = 2
explanation = "Lists, tuples and `range` are iterables that can be iterated many times. The generator is exhausted on the first pass and the second one comes up empty, with no error."
