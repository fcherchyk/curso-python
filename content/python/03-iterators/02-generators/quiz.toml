[[questions]]
text = "Given `def f(): print(\"hello\"); yield 1`, what does `g = f()` print?"
options = ["`hello`", "Nothing", "`1`", "`hello` and `1`"]
correct = 1
explanation = "Calling a generator function only creates the generator. The body starts running on the first `next()`."

[[questions]]
text = "What does `yield from sub` do?"
options = [
  "Returns all of `sub` as a single value",
  "Yields the elements of `sub` one by one",
  "Turns `sub` into a list",
  "Ends the generator",
]
correct = 1
explanation = "It delegates to `sub` and yields each of its elements. It's equivalent to `for x in sub: yield x`."

[[questions]]
text = "Why does `sum(x * x for x in range(10**8))` use constant memory?"
options = [
  "Because `sum` is a built-in function",
  "Because the generator yields one value at a time and never builds the full list",
  "Because Python compresses integers",
  "It doesn't: it uses as much memory as a list",
]
correct = 1
explanation = "The generator expression is lazy: `sum` asks for a value, adds it up and asks for the next. The 10⁸ values never exist all at once."

[[questions]]
text = "When should you return a **list** instead of a generator?"
options = [
  "When the data is infinite",
  "When you'll iterate over the result several times or need `len()`",
  "When the data doesn't fit in memory",
  "When you want to process a file line by line",
]
correct = 1
explanation = "A generator is consumed once and has no `len()`, indexing or slicing. If you need those, return a list."

[[questions]]
text = "A generator opens a file with `with`. If the consumer does `break` on the first line, what happens to the file?"
options = [
  "It stays open until the program ends",
  "It's closed when the generator is closed or destroyed",
  "It raises `RuntimeError`",
  "It gets read in full anyway",
]
correct = 1
explanation = "When the generator is closed (`close()`, which is also called when it's destroyed), the `with` block exits and the file is closed."
