[[questions]]
text = "How many groups does `groupby(\"aabaa\")` produce?"
options = ["2", "3", "5", "1"]
correct = 1
explanation = "`groupby` only groups **consecutive** elements: `aa`, `b` and `aa`. To group all the `a`s together you have to sort first."

[[questions]]
text = "What does `list(takewhile(lambda x: x < 3, [1, 2, 5, 1]))` return?"
options = ["`[1, 2, 1]`", "`[1, 2]`", "`[5, 1]`", "`[1, 2, 5]`"]
correct = 1
explanation = "`takewhile` stops at the first element that fails the condition and doesn't look any further. It's not a `filter`."

[[questions]]
text = "What does `list(accumulate([1, 2, 3]))` return?"
options = ["`[1, 2, 3]`", "`[1, 3, 6]`", "`6`", "`[6]`"]
correct = 1
explanation = "`accumulate` yields the partial results: by default, the running sums."

[[questions]]
text = "How many elements does `combinations(\"abcd\", 2)` have?"
options = ["4", "6", "12", "16"]
correct = 1
explanation = "They're combinations without order or repetition: C(4, 2) = 6. Permutations would give 12, and `product(\"abcd\", repeat=2)` would give 16."

[[questions]]
text = "What does `chain.from_iterable([[1, 2], [3]])` do?"
options = [
  "Returns `[[1, 2], [3]]`",
  "Yields `1, 2, 3` lazily",
  "Adds up the inner lists",
  "Raises `TypeError`",
]
correct = 1
explanation = "It flattens one level lazily, without building an intermediate list."
