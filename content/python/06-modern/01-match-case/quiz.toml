[[questions]]
text = "With `RED = \"red\"`, what does `case RED:` do inside a `match`?"
options = [
  "Compares the subject to `\"red\"`",
  "Captures any value into a variable named `RED` (it always matches)",
  "Raises `SyntaxError`",
  "Compares to the string `\"RED\"`",
]
correct = 1
explanation = "A bare name in a pattern is a capture. To compare against a constant you need a dotted name (`Color.RED`) or a literal."

[[questions]]
text = "Does the pattern `{\"type\": \"click\", \"x\": x}` match `{\"type\": \"click\", \"x\": 1, \"button\": \"left\"}`?"
options = ["No, the `button` key is extra", "Yes: mapping patterns ignore extra keys", "Only with `**rest`", "It raises `KeyError`"]
correct = 1
explanation = "Mapping patterns only require the keys they name. To capture the rest there's `**rest`."

[[questions]]
text = "If several `case` clauses match, which one runs?"
options = ["All of them, in order", "The first one that matches", "The last one", "The most specific one"]
correct = 1
explanation = "`case` clauses are tried in order and only the first match runs. There's no fall-through."

[[questions]]
text = "What does `case {\"x\": int(x)}` do?"
options = [
  "Converts the value to int",
  "Matches only if the value of `\"x\"` is an int, and captures it in `x`",
  "Calls `int()` and fails if it can't",
  "It's a syntax error",
]
correct = 1
explanation = "`int(x)` in a pattern is a class pattern: it checks `isinstance(value, int)` and captures. It doesn't convert."

[[questions]]
text = "Does the pattern `[a, b]` match the string `\"ab\"`?"
options = ["Yes, with `a = \"a\"` and `b = \"b\"`", "No: sequence patterns don't destructure strings", "Only if it's a tuple", "It raises `TypeError`"]
correct = 1
explanation = "By design, `str`, `bytes` and `bytearray` don't match sequence patterns, to avoid surprises."
