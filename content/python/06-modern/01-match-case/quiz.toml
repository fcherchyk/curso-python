[[questions]]
text = "Con `ROJO = \"rojo\"`, ¿qué hace `case ROJO:` dentro de un `match`?"
options = [
  "Compara el sujeto con `\"rojo\"`",
  "Captura cualquier valor en una variable llamada `ROJO` (siempre matchea)",
  "Levanta `SyntaxError`",
  "Compara con el string `\"ROJO\"`",
]
correct = 1
explanation = "Un nombre suelto en un patrón es una captura. Para comparar con una constante hay que usar un nombre con punto (`Color.ROJO`) o un literal."

[[questions]]
text = "¿El patrón `{\"tipo\": \"click\", \"x\": x}` matchea `{\"tipo\": \"click\", \"x\": 1, \"boton\": \"izq\"}`?"
options = ["No, sobra la clave `boton`", "Sí: los patrones de mapeo ignoran las claves extra", "Solo con `**resto`", "Levanta `KeyError`"]
correct = 1
explanation = "Los patrones de mapeo solo exigen las claves que nombran. Para capturar las demás existe `**resto`."

[[questions]]
text = "Si varios `case` coinciden, ¿cuál se ejecuta?"
options = ["Todos, en orden", "El primero que coincide", "El último", "El más específico"]
correct = 1
explanation = "Los `case` se prueban en orden y solo se ejecuta el primero que coincide. No hay fall-through."

[[questions]]
text = "¿Qué hace `case {\"x\": int(x)}`?"
options = [
  "Convierte el valor a int",
  "Matchea solo si el valor de `\"x\"` es un int, y lo captura en `x`",
  "Llama a `int()` y falla si no se puede",
  "Es un error de sintaxis",
]
correct = 1
explanation = "`int(x)` en un patrón es un patrón de clase: verifica `isinstance(valor, int)` y captura. No convierte."

[[questions]]
text = "¿El patrón `[a, b]` matchea el string `\"ab\"`?"
options = ["Sí, con `a = \"a\"` y `b = \"b\"`", "No: los patrones de secuencia no desarman strings", "Solo si es una tupla", "Levanta `TypeError`"]
correct = 1
explanation = "Por diseño, `str`, `bytes` y `bytearray` no matchean patrones de secuencia, para evitar sorpresas."
