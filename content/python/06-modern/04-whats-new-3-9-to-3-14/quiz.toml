[[questions]]
text = "In which mode do you have to open a file for `tomllib.load`?"
options = ["Text (`\"r\"`)", "Binary (`\"rb\"`)", "Either", "Write"]
correct = 1
explanation = "`tomllib.load` takes a binary file and decodes UTF-8 on its own. For a string, use `tomllib.loads`."

[[questions]]
text = "What's the recommended practice with dates and time zones?"
options = [
  "Store in local time and convert to UTC for display",
  "Store and compare in UTC; convert to the local zone only for display",
  "Always use naive datetimes",
  "Use `datetime.utcnow()`",
]
correct = 1
explanation = "UTC has no daylight saving time and no ambiguities. `utcnow()` is deprecated because it returns a naive datetime; use `datetime.now(UTC)`."

[[questions]]
text = "What does `t\"Hello {name}\"` return in Python 3.14?"
options = [
  "A `str`, just like an f-string",
  "A `Template` object with the literal parts and the values kept separate",
  "A syntax error",
  "A `bytes` object",
]
correct = 1
explanation = "t-strings don't interpolate: they hand over a `Template` so a library can combine the parts safely (escaping HTML, parameterizing SQL, etc.)."

[[questions]]
text = "In which version were `match`/`case` and the `X | Y` syntax for types added?"
options = ["3.8", "3.9", "3.10", "3.12"]
correct = 2
explanation = "Both arrived in Python 3.10, along with `zip(strict=True)` and better error messages."

[[questions]]
text = "What does `DEFAULTS | section` do?"
options = [
  "Modifies `DEFAULTS` by adding `section` to it",
  "Returns a new dict where `section` overrides `DEFAULTS`",
  "Returns the keys they have in common",
  "Raises `TypeError`",
]
correct = 1
explanation = "The dict `|` operator (3.9) creates a new dict and mutates neither. The in-place version is `|=`."
