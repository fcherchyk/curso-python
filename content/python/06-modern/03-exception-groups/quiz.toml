[[questions]]
text = "Does a plain `except ValueError:` catch an `ExceptionGroup` that contains only `ValueError`s?"
options = ["Yes", "No: you need `except* ValueError` or `except ExceptionGroup`", "Only if the group has one element", "Only in 3.13+"]
correct = 1
explanation = "The group isn't a `ValueError`: it's an `ExceptionGroup`. `except*` is what looks inside the group."

[[questions]]
text = "In a `try` with `except* ValueError` and `except* TypeError`, if the group has both types, which branches run?"
options = ["Only the first", "Both", "Neither", "Only the one for the most frequent type"]
correct = 1
explanation = "With `except*`, each branch takes its share of the group, so several can run."

[[questions]]
text = "Inside `except* ValueError as g:`, what is `g`?"
options = [
  "A `ValueError`",
  "An `ExceptionGroup` with only the `ValueError`s",
  "A list of strings",
  "The full original group",
]
correct = 1
explanation = "The variable is always a filtered group. The individual exceptions are in `g.exceptions`."

[[questions]]
text = "What happens to the exceptions in the group that no `except*` branch handled?"
options = ["They're discarded", "They're re-raised in a group", "They become warnings", "They're printed and execution continues"]
correct = 1
explanation = "Whatever wasn't handled is automatically re-raised as an `ExceptionGroup` with what's left."

[[questions]]
text = "What is `e.add_note(\"on row 3\")` for?"
options = [
  "To change the exception's message",
  "To add context that shows up in the traceback without changing the type or the message",
  "To suppress the exception",
  "To turn it into an `ExceptionGroup`",
]
correct = 1
explanation = "Notes are stored in `__notes__` and shown below the original message in the traceback."
