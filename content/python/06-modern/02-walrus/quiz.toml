[[questions]]
text = "What value does `n` get in `if n := len([1, 2, 3]) > 2:`?"
options = ["`3`", "`True`", "`2`", "It's a syntax error"]
correct = 1
explanation = "Without parentheses, `:=` has lower precedence than `>`: it assigns the result of `len(...) > 2`, which is `True`. The right way is `(n := len(xs)) > 2`."

[[questions]]
text = "What's the main advantage of `while chunk := f.read(4096):`?"
options = [
  "It's faster",
  "It avoids duplicating the read before the loop and at the end of it",
  "It reads the whole file at once",
  "It closes the file when done",
]
correct = 1
explanation = "Without walrus, the read appears before the `while` and again at the end of the body. With walrus it lives in a single place."

[[questions]]
text = "In `[r for x in xs if (r := f(x)) > 0]`, how many times is `f` called per element?"
options = ["Zero", "Once", "Twice", "It depends on the result"]
correct = 1
explanation = "The value is computed once in the filter, stored in `r` and reused as the result."

[[questions]]
text = "Which of these lines is invalid?"
options = ["`if (m := re.match(p, s)):`", "`x := 5`", "`print(y := 3)`", "`while (d := q.get()) is not None:`"]
correct = 1
explanation = "As a standalone statement, `x := 5` isn't allowed: that's what `=` is for. Inside expressions (arguments, conditions), it is."

[[questions]]
text = "When should you **not** use walrus?"
options = [
  "To read in a `while` until there's no more data",
  "To chain three assignments in a single `if` just to save lines",
  "To use the result of `re.match` in the same `if`",
  "To avoid computing a value twice in a comprehension",
]
correct = 1
explanation = "The goal is to remove duplication. If the expression gets hard to read, use several lines instead."
