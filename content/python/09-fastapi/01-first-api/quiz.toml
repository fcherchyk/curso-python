[[questions]]
text = "With `@app.get(\"/products/{id}\")` and `def detail(id: int)`, what does `/products/abc` return?"
options = ["404", "422 with the details of the validation error", "500", "200 with `id = \"abc\"`"]
correct = 1
explanation = "The type hint validates and converts. An invalid value returns 422 (Unprocessable Entity) without ever reaching your function."

[[questions]]
text = "In `def list_products(q: str | None = None, page: int = 1)`, where do `q` and `page` come from?"
options = [
  "The JSON body",
  "The query string (`?q=...&page=...`)",
  "The headers",
  "The path",
]
correct = 1
explanation = "Simple-typed parameters that don't appear in the path are query params. With a default they're optional."

[[questions]]
text = "How do you return a 404 in FastAPI?"
options = [
  "`return {\"detail\": \"...\"}, 404`",
  "`raise HTTPException(status_code=404, detail=\"...\")`",
  "`abort(404)`",
  "`return HTTPException(404)`",
]
correct = 1
explanation = "`HTTPException` is raised. FastAPI turns it into a JSON response `{\"detail\": ...}` with the given status code."

[[questions]]
text = "What do you get at `/docs` without writing anything extra?"
options = [
  "Nothing: you need to install a plugin",
  "Interactive documentation (Swagger UI) generated from the types and routes",
  "The server logs",
  "The source code",
]
correct = 1
explanation = "FastAPI generates the OpenAPI schema from the signatures and models, and shows it at `/docs` and `/redoc`."

[[questions]]
text = "A parameter `data: NewProduct` (a Pydantic `BaseModel`) in a POST endpoint is read from…"
options = ["The query string", "The JSON body", "The headers", "The cookies"]
correct = 1
explanation = "Parameters that are Pydantic models are read from the body and validated field by field."
