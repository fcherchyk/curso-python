[[questions]]
text = "What happens when you call an `async def` function without `await`?"
options = [
  "It runs in the background",
  "It returns a coroutine without running the body",
  "It runs synchronously",
  "It raises `SyntaxError`",
]
correct = 1
explanation = "Like a generator, the coroutine doesn't run until something awaits it (`await`) or schedules it (`create_task`, `gather`)."

[[questions]]
text = "Three async calls of 200 ms each with `asyncio.gather`. Roughly how long does it take?"
options = ["600 ms", "200 ms", "400 ms", "66 ms"]
correct = 1
explanation = "`gather` launches them at once: while one waits, the others make progress. The total is roughly that of the slowest one."

[[questions]]
text = "What happens if you call `time.sleep(2)` inside an `async def` endpoint?"
options = [
  "Only that request waits 2 seconds",
  "The event loop is blocked: the whole app stops serving requests for 2 seconds",
  "FastAPI automatically turns it into `asyncio.sleep`",
  "It raises an error",
]
correct = 1
explanation = "Blocking code inside `async def` freezes the loop. Use `await asyncio.sleep`, an async library, or declare the endpoint as `def`."

[[questions]]
text = "An endpoint uses `requests` (synchronous) to call another API. How should you declare it?"
options = [
  "`async def`",
  "`def`: FastAPI runs it in a thread pool and it doesn't block the loop",
  "It doesn't matter",
  "You can't use `requests` with FastAPI",
]
correct = 1
explanation = "With `def`, FastAPI runs the function in a separate thread. The async alternative would be `httpx.AsyncClient` with `async def`."

[[questions]]
text = "When does a task added with `BackgroundTasks.add_task` run?"
options = [
  "Before the endpoint",
  "After the response is sent to the client",
  "In another process, with retries",
  "Only if the endpoint fails",
]
correct = 1
explanation = "It runs after responding, in the same process. For long jobs or jobs that need retries, use a task queue."
