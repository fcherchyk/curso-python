[[questions]]
text = "An `APIRouter(prefix=\"/products\")` included with `app.include_router(router, prefix=\"/api/v1\")` and a route `@router.get(\"/{id}\")`. What's the URL?"
options = ["`/products/{id}`", "`/api/v1/products/{id}`", "`/api/v1/{id}`", "`/products/api/v1/{id}`"]
correct = 1
explanation = "Prefixes stack up: the one from `include_router` comes first, then the router's own."

[[questions]]
text = "What's the point of registering an `exception_handler` for a domain exception?"
options = [
  "So the exception is never raised",
  "So the business logic can raise its exceptions without knowing about HTTP, and the web layer translates them into consistent responses",
  "To log faster",
  "It's required for every endpoint",
]
correct = 1
explanation = "Services raise `ProductNotFound` and the handler turns it into a 404 in the API's format, in a single place."

[[questions]]
text = "In an HTTP middleware, when does the code after `await call_next(request)` run?"
options = [
  "Before the route",
  "After the route has produced the response",
  "Only if there was an error",
  "Never",
]
correct = 1
explanation = "`call_next` runs the rest of the chain (other middlewares and the route). Afterwards you can modify the response, for example by adding headers."

[[questions]]
text = "What is FastAPI's `lifespan` for?"
options = [
  "Limiting how long each request can take",
  "Initializing resources when the app starts (clients, caches, connections) and releasing them when it shuts down",
  "Setting token expiration",
  "Timing each endpoint",
]
correct = 1
explanation = "It's an async context manager: what's before the `yield` runs on startup and what's after, on shutdown. It replaces `on_event`."

[[questions]]
text = "A frontend at `https://front.com` can't call your API at `https://api.com` from the browser. What's missing?"
options = [
  "An `exception_handler`",
  "Configuring CORS (`CORSMiddleware`) to allow that origin",
  "Using `async def`",
  "A router",
]
correct = 1
explanation = "The browser blocks requests across different origins unless the server allows them with CORS headers."
