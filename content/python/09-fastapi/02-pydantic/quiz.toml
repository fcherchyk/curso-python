[[questions]]
text = "With `price: float`, what happens with `Product(name=\"x\", price=\"3500\")` in the default mode?"
options = [
  "`ValidationError`: it's a string",
  "It's converted to `3500.0`",
  "It stays as the string `\"3500\"`",
  "The field is ignored",
]
correct = 1
explanation = "In lax mode, Pydantic converts compatible values. With `strict=True` it would require a number."

[[questions]]
text = "What does `age: int = Field(ge=0, le=130)` do?"
options = [
  "Sets 0 as the default",
  "Requires the age to be between 0 and 130 inclusive",
  "Converts the age to a range",
  "Requires more than 0 and less than 130 (exclusive)",
]
correct = 1
explanation = "`ge` means \"greater than or equal\" and `le`, \"less than or equal\". For exclusive bounds there are `gt` and `lt`."

[[questions]]
text = "What is `@model_validator(mode=\"after\")` for?"
options = [
  "Validating a single field",
  "Rules that involve several fields, with the model already built",
  "Converting the model to JSON",
  "Defining default values",
]
correct = 1
explanation = "Examples: the password must not equal the name, or `end_date` must be after `start_date`."

[[questions]]
text = "An endpoint has `response_model=PublicUser` (no `password`) and returns a dict with `password`. What does the client get?"
options = [
  "The full dict, password included",
  "Only the fields of `PublicUser`: `password` is filtered out",
  "A 500 error",
  "A 422",
]
correct = 1
explanation = "The `response_model` validates and filters the output. It's the idiomatic way to avoid exposing sensitive fields."

[[questions]]
text = "If a POST body doesn't match the model, what does FastAPI respond?"
options = [
  "400 with a generic message",
  "422 with the list of per-field errors (`loc`, `msg`, `type`)",
  "500",
  "200 with the corrected data",
]
correct = 1
explanation = "Validation happens before your function is called. The 422 says which field failed and why."
