[[questions]]
text = "Why are ORM models kept separate from Pydantic schemas?"
options = [
  "Because SQLAlchemy doesn't work with FastAPI",
  "To control what the client can send and what the API returns (without exposing internal fields), independently of the table",
  "For performance",
  "Because Pydantic doesn't support integers",
]
correct = 1
explanation = "The input schema has no `id` and the output schema doesn't expose sensitive fields. The API and the table evolve separately."

[[questions]]
text = "What is `model_config = ConfigDict(from_attributes=True)` for in a schema?"
options = [
  "Reading the schema from a file",
  "Being able to build it from an object with attributes (for example, an ORM instance)",
  "Making it immutable",
  "Validating in strict mode",
]
correct = 1
explanation = "It allows `TaskPublic.model_validate(orm_task)`, which is what FastAPI does with the `response_model` when you return an ORM object."

[[questions]]
text = "In a PATCH with body `{\"done\": true}`, what does `data.model_dump(exclude_unset=True)` return?"
options = [
  "`{\"title\": None, \"done\": True}`",
  "`{\"done\": True}`",
  "`{}`",
  "Every field with its defaults",
]
correct = 1
explanation = "It only includes the fields that came in the JSON. That way the others aren't overwritten with `None`."

[[questions]]
text = "What does `session.refresh(task)` do after the `commit`?"
options = [
  "Deletes the task",
  "Reloads the object from the database (for example, the id and generated defaults)",
  "Rolls back the changes",
  "Closes the session",
]
correct = 1
explanation = "It syncs the object with what was actually saved, so the response has the final values."

[[questions]]
text = "An endpoint uses a synchronous SQLAlchemy `Session`. How should you declare it?"
options = [
  "`async def`",
  "`def`, so FastAPI runs it in the thread pool without blocking the loop",
  "It doesn't matter",
  "With `@app.sync`",
]
correct = 1
explanation = "The synchronous driver blocks. With `def`, that blocking happens on a separate thread. For fully async, use `AsyncSession`."
