[[questions]]
text = "What does `user: Annotated[User, Depends(current_user)]` do in an endpoint?"
options = [
  "Imports the User class",
  "Makes FastAPI call `current_user` before the endpoint and pass it the result",
  "Validates the body as a User",
  "Creates a new user on every request",
]
correct = 1
explanation = "The dependency is resolved first, with its own parameters (headers, query, other dependencies). If it raises HTTPException, the endpoint doesn't run."

[[questions]]
text = "Two dependencies in the same request ask for `Depends(current_user)`. How many times does it run?"
options = ["Twice", "Once: it's cached within the request", "Never", "It depends on the order"]
correct = 1
explanation = "FastAPI caches each dependency's result per request (unless `use_cache=False`)."

[[questions]]
text = "How do you replace a dependency in tests?"
options = [
  "With `unittest.mock.patch` on the endpoint",
  "With `app.dependency_overrides[original_dependency] = replacement`",
  "By redefining the function in the test",
  "You can't",
]
correct = 1
explanation = "The overrides dict maps the original function to its replacement. Clear it after each test."

[[questions]]
text = "In a dependency with `yield`, when does the code after the `yield` run?"
options = [
  "Before the endpoint",
  "After the endpoint finishes (cleanup, for example closing the session)",
  "Never",
  "Only if there was an error",
]
correct = 1
explanation = "It works like a context manager: setup before the `yield` and cleanup after, ideally in a `finally`."

[[questions]]
text = "Which status code fits an authenticated user who lacks admin permissions?"
options = ["401", "403", "404", "422"]
correct = 1
explanation = "We know who they are (so not 401), but they can't perform the action: 403 Forbidden."
