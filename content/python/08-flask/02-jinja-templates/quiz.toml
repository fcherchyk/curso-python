[[questions]]
text = "If `name = \"<b>Alice</b>\"`, what does `{{ name }}` produce in a Flask `.html` template?"
options = [
  "`<b>Alice</b>` (Alice in bold)",
  "`&lt;b&gt;Alice&lt;/b&gt;` (the escaped text)",
  "An error",
  "`Alice`",
]
correct = 1
explanation = "Autoescaping turns special characters into HTML entities. It's the main defense against XSS."

[[questions]]
text = "What does `{% extends \"base.html\" %}` do in a template?"
options = [
  "Includes base.html at the top",
  "Inherits the layout from base.html and replaces only the blocks it defines",
  "Copies base.html at the end",
  "Imports the macros from base.html",
]
correct = 1
explanation = "The child template defines blocks (`{% block x %}`) that replace the base's. Everything else is inherited as is."

[[questions]]
text = "What does `url_for` take as its first argument?"
options = [
  "The literal URL, like `\"/products\"`",
  "The endpoint name (by default, the name of the view function)",
  "The template name",
  "The HTTP method",
]
correct = 1
explanation = "`url_for(\"product_detail\", id=3)` builds `/products/3`. If the route changes, the generated links update themselves."

[[questions]]
text = "When is it acceptable to use the `| safe` filter?"
options = [
  "Whenever the text contains HTML",
  "Only with HTML you generated yourself and know is safe; never with user data",
  "To make the page load faster",
  "To display accented characters correctly",
]
correct = 1
explanation = "`safe` turns escaping off. With user data, it opens the door to XSS."

[[questions]]
text = "In a Jinja `{% for %}`, when does the `{% else %}` block run?"
options = [
  "After the last iteration",
  "When the sequence is empty",
  "When there was a `break`",
  "Never: it doesn't exist",
]
correct = 1
explanation = "In Jinja, a `for`'s `else` runs if there were no iterations at all. That's different from Python's `for/else`, which runs if there was no `break`."
