{% extends "base.html" %}
{% block titulo %}Productos{% endblock %}
{% block contenido %}
<h1>Productos ({{ productos | length }})</h1>
<ul>
  {% for p in productos %}
  <li><a href="{{ url_for('detalle', id=p.id) }}">{{ p.nombre }}</a> · {{ p.precio | pesos }}</li>
  {% else %}
  <li>No hay productos</li>
  {% endfor %}
</ul>
{% endblock %}
