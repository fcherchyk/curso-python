[[questions]]
text = "With `@app.get(\"/products/<int:id>\")`, what happens to a request to `/products/abc`?"
options = [
  "The view receives `id = \"abc\"`",
  "Flask responds 404 without calling the view",
  "It raises `ValueError` inside the view",
  "It responds 400",
]
correct = 1
explanation = "Converters are part of route matching: if `abc` isn't an int, the route doesn't match and Flask returns 404."

[[questions]]
text = "What does Flask return if a view does `return {\"ok\": True}, 201`?"
options = [
  "An error: you can't return a tuple",
  "A JSON response with status 201",
  "The text `({'ok': True}, 201)`",
  "A 200 with the dict as text",
]
correct = 1
explanation = "A dict is serialized to JSON automatically, and the tuple's second element is the status code."

[[questions]]
text = "How do you read `?page=2` as an integer, defaulting to 1 if it's missing or invalid?"
options = [
  "`int(request.args[\"page\"])`",
  "`request.args.get(\"page\", 1, type=int)`",
  "`request.query.page`",
  "`request.get_json()[\"page\"]`",
]
correct = 1
explanation = "With `type=int`, if the conversion fails you get the default instead of an exception."

[[questions]]
text = "What is `app.test_client()` for?"
options = [
  "Starting a development server",
  "Making requests to the app in tests without starting a server",
  "Generating documentation",
  "Measuring performance",
]
correct = 1
explanation = "The test client calls the app directly (WSGI) and returns responses you can inspect with `status_code`, `get_json()`, etc."

[[questions]]
text = "Why should you never use `--debug` in production?"
options = [
  "Because it's slower",
  "Because the interactive debugger lets anyone run arbitrary code from the browser",
  "Because it disables logging",
  "Because it doesn't support HTTPS",
]
correct = 1
explanation = "The Werkzeug debugger opens a Python console on the error page. On a public server, that's an open door."
