[[questions]]
text = "In a SQLAlchemy 2.0 model, what does `year: Mapped[int | None]` mean?"
options = [
  "The column is a text type",
  "An integer column that allows NULL",
  "A relationship with another table",
  "The column isn't stored",
]
correct = 1
explanation = "The type inside `Mapped` defines the column type, and `| None` makes it nullable."

[[questions]]
text = "When do the INSERTs for objects added with `db.session.add(...)` run?"
options = [
  "Immediately when you call `add`",
  "On flush, at the latest on `commit` (in a transaction)",
  "When the program exits",
  "Never: you have to call `insert()`",
]
correct = 1
explanation = "The session accumulates changes (unit of work) and sends them on flush. `commit` commits the transaction."

[[questions]]
text = "What is the N+1 problem?"
options = [
  "A duplicate key error",
  "Running one query for the list and another for each element when accessing a lazy relationship",
  "Paginating N+1 items at a time",
  "A table with N+1 columns",
]
correct = 1
explanation = "Accessing `book.author` inside a loop fires a SELECT per book. You fix it with `joinedload` or `selectinload`."

[[questions]]
text = "What does `db.get_or_404(Book, 7)` do?"
options = [
  "Returns book 7 or None",
  "Returns book 7 or aborts the request with a 404",
  "Creates book 7 if it doesn't exist",
  "Returns all books",
]
correct = 1
explanation = "It's a Flask-SQLAlchemy shortcut for the typical detail-endpoint case."

[[questions]]
text = "You added a column to a model and the table already exists. Does `db.create_all()` add it?"
options = [
  "Yes, it syncs the whole schema",
  "No: it only creates tables that don't exist; schema changes are handled with migrations (Alembic)",
  "Yes, but it deletes the data",
  "Only in SQLite",
]
correct = 1
explanation = "`create_all` doesn't alter existing tables. To evolve the schema you use versioned migrations."
