[[questions]]
text = "What does `@app.errorhandler(HTTPException)` cover?"
options = [
  "Only 500s",
  "Every Werkzeug HTTP exception: 400, 401, 404, 405, etc.",
  "Only explicit `abort()` calls, not unknown routes",
  "Python exceptions like `ValueError`",
]
correct = 1
explanation = "`NotFound`, `MethodNotAllowed`, `Unauthorized` and the rest inherit from `HTTPException`, including the ones Flask raises on its own (unknown route, method not allowed)."

[[questions]]
text = "Why does the authentication decorator need `functools.wraps`?"
options = [
  "To make it faster",
  "Because Flask uses the function name as the endpoint: without `wraps`, every protected view would have the same name and they'd clash",
  "So that `g` works",
  "It doesn't",
]
correct = 1
explanation = "Without `wraps`, all the wrappers share the same name and Flask raises an error when registering a second endpoint with that name."

[[questions]]
text = "A request arrives without the `Authorization` header. Which status code fits?"
options = ["400", "401", "403", "404"]
correct = 1
explanation = "401 means authentication is missing or the credential is invalid. 403 is for an identified user who lacks permission."

[[questions]]
text = "What is `flask.g`?"
options = [
  "A global variable shared by all requests",
  "An object for storing data that lives for a single request (like the authenticated user)",
  "The app's configuration",
  "The test client",
]
correct = 1
explanation = "`g` is created empty on each request and discarded at the end. It's ideal for sharing the current user or a connection."

[[questions]]
text = "In what order do the decorators go to protect a view?"
options = [
  "`@require_token` on top and `@app.get` below",
  "`@app.get` on top and `@require_token` below",
  "It doesn't matter",
  "They can't be combined",
]
correct = 1
explanation = "Decorators apply from the bottom up: first the function gets protected, then the protected version is registered on the route."
