[[questions]]
text = "What is the main advantage of an app factory (`create_app`)?"
options = [
  "The app starts faster",
  "You can create independent apps with different configurations (for example, one per test)",
  "You don't need a `secret_key`",
  "It replaces blueprints",
]
correct = 1
explanation = "Without a global app, each test or environment creates its own with its own configuration, and there's no shared state."

[[questions]]
text = "With `app.register_blueprint(bp, url_prefix=\"/api\")` and `@bp.get(\"/status\")`, what's the URL?"
options = ["`/status`", "`/api/status`", "`/bp/status`", "`/api/bp/status`"]
correct = 1
explanation = "The `url_prefix` is prepended to every route in the blueprint."

[[questions]]
text = "A view in a blueprint named `\"api\"` is called `products`. What do you pass to `url_for`?"
options = ["`\"products\"`", "`\"api.products\"`", "`\"/api/products\"`", "`\"bp.products\"`"]
correct = 1
explanation = "A blueprint's endpoints are prefixed with its name. Inside the same blueprint, `\".products\"` works too."

[[questions]]
text = "What is `current_app` for?"
options = [
  "Creating a new app",
  "Accessing the app handling the current request (for example, its config) without importing it",
  "Restarting the app",
  "Getting the current blueprint",
]
correct = 1
explanation = "With factories there's no global `app` variable to import. `current_app` points to the app of the current context."

[[questions]]
text = "Why do extensions use `ext = Extension()` and later `ext.init_app(app)`?"
options = [
  "For Python 2 compatibility",
  "So you can create the extension at module level (importable) and attach it to one or more apps built by the factory",
  "Because it's faster",
  "So the extension has no configuration",
]
correct = 1
explanation = "The extension doesn't depend on a global app. Per-app state is stored in `app.extensions`."
