[[questions]]
text = "Why should you redirect after a successful POST (the PRG pattern)?"
options = [
  "Because Flask can't return HTML from a POST",
  "So reloading the page doesn't resubmit the form and repeat the operation",
  "To make the response faster",
  "Because browsers require it",
]
correct = 1
explanation = "After the redirect, the page is a GET, and reloading it doesn't repeat the POST."

[[questions]]
text = "What does Flask's default session (a signed cookie) guarantee?"
options = [
  "That the user can't read its contents",
  "That the user can't modify its contents without it being detected",
  "That it's stored in the database",
  "That it lasts forever",
]
correct = 1
explanation = "It's signed, not encrypted: the contents can be read, but not tampered with. Don't store secrets there."

[[questions]]
text = "How many times is a message created with `flash()` shown?"
options = [
  "On every page until logout",
  "Once: it's consumed by the next request that reads it",
  "Only in the same response as the POST",
  "Until the user dismisses it",
]
correct = 1
explanation = "`get_flashed_messages()` reads it and removes it from the session, which is why it works right after a redirect."

[[questions]]
text = "A form has `required` in the HTML. Do you still need to validate on the server?"
options = [
  "No, the browser already validates it",
  "Yes: anyone can send the POST without going through the browser",
  "Only if the field is numeric",
  "Only in production",
]
correct = 1
explanation = "Client-side validation improves the user experience, but security and data integrity depend on validating on the server."

[[questions]]
text = "With Flask's `test_client`, how do you submit a form (not JSON)?"
options = [
  "`client.post(url, json={...})`",
  "`client.post(url, data={...})`",
  "`client.post(url, form={...})`",
  "`client.submit(url, {...})`",
]
correct = 1
explanation = "`data=` encodes the fields as a form; `json=` sends a JSON body."
