[[questions]]
text = "What is `@repeat(3)` above `def f` equivalent to?"
options = ["`f = repeat(3, f)`", "`f = repeat(3)(f)`", "`f = repeat(f)(3)`", "`f = repeat(f(3))`"]
correct = 1
explanation = "First the factory is called with the parameters, and what it returns (the decorator) receives the function."

[[questions]]
text = "How many levels of nested functions does a typical decorator with parameters have?"
options = ["1", "2", "3", "4"]
correct = 2
explanation = "Factory (receives the parameters), decorator (receives the function) and wrapper (receives the arguments of each call)."

[[questions]]
text = "What happens if you use `@repeat` (without parentheses) when the signature is `def repeat(n)`?"
options = [
  "It works with a default `n`",
  "`repeat` receives the function as `n`, and what ends up bound is the inner decorator, not a wrapper",
  "It raises `SyntaxError`",
  "Python adds the parentheses automatically",
]
correct = 1
explanation = "Without parentheses, `repeat(f)` runs with `n = f` and returns `decorator`. When you later call `f()`, you'd be calling `decorator()` with no arguments, and it fails."

[[questions]]
text = "In `retry(times, exceptions=(ConnectionError,))`, what should happen if the function raises `KeyError`?"
options = [
  "Retry anyway",
  "Propagate immediately, without retrying",
  "Return `None`",
  "Turn into a `ConnectionError`",
]
correct = 1
explanation = "Only expected transient errors are retried. A `KeyError` is usually a bug, and retrying it only hides it and delays things."

[[questions]]
text = "To make a decorator work both as `@deco` and as `@deco(option=1)`, what do you do?"
options = [
  "It's impossible in Python",
  "First parameter `func=None` and keyword-only options; if `func` isn't `None`, decorate it directly",
  "Use `*args` and guess the type",
  "Define two functions with the same name",
]
correct = 1
explanation = "If it was used without parentheses, the function arrives as the first argument. Otherwise only keywords arrive and you return the decorator."
