[[questions]]
text = "In `with cm as x:`, what value does `x` get?"
options = [
  "The `cm` object",
  "Whatever `cm.__enter__()` returns",
  "Whatever `cm.__exit__()` returns",
  "`None`",
]
correct = 1
explanation = "`x` gets the result of `__enter__`. It's often `self`, but not always: a lock or a transaction, for example, may return something else."

[[questions]]
text = "If `__exit__` returns `True` when an exception occurred in the block, what happens?"
options = [
  "The exception is re-raised",
  "The exception is suppressed and execution continues after the `with`",
  "The block runs again",
  "It raises `RuntimeError`",
]
correct = 1
explanation = "A truthy value tells Python the exception has been handled and shouldn't propagate. It's almost never what you want."

[[questions]]
text = "In a `@contextmanager`, why do you need to wrap the `yield` in `try/finally`?"
options = [
  "Because otherwise the generator doesn't compile",
  "Because an exception from the `with` block is re-raised at the `yield`, and without `finally` the cleanup doesn't run",
  "Because `yield` only works inside `try`",
  "You don't: `contextmanager` cleans up on its own",
]
correct = 1
explanation = "If the body of the `with` fails, the exception shows up on the `yield` line. The `finally` guarantees the cleanup code runs anyway."

[[questions]]
text = "Which `contextlib` tool do you use to open a **variable** number of files in a single `with`?"
options = ["`suppress`", "`ExitStack`", "`closing`", "`nullcontext`"]
correct = 1
explanation = "`ExitStack` lets you register context managers dynamically with `enter_context` and closes them all in reverse order."

[[questions]]
text = "What does `with suppress(FileNotFoundError): os.remove(\"x\")` do?"
options = [
  "Deletes the file or raises `FileNotFoundError`",
  "Deletes the file if it exists and, if it doesn't, carries on without an error",
  "Creates the file if it doesn't exist",
  "Suppresses any exception",
]
correct = 1
explanation = "`suppress` ignores only the given types. Other errors (for example, `PermissionError`) still propagate."
