[[questions]]
text = "What does `[f() for f in [lambda: i for i in range(3)]]` return?"
options = ["`[0, 1, 2]`", "`[2, 2, 2]`", "`[0, 0, 0]`", "Raises `NameError`"]
correct = 1
explanation = "The lambdas capture the **variable** `i`, not its value. By the time they're called, the loop has finished and `i` is 2."

[[questions]]
text = "Inside an inner function, `total += 1` on a variable from the outer function raises…"
options = ["`NameError`", "`UnboundLocalError`", "`SyntaxError`", "Nothing: it works"]
correct = 1
explanation = "The assignment makes `total` local to the inner function, and it's read before being assigned. You need `nonlocal total`."

[[questions]]
text = "In what order does Python look up a name?"
options = [
  "Global, local, built-in",
  "Local, enclosing, global, built-in",
  "Built-in, global, local",
  "Enclosing, local, global, built-in",
]
correct = 1
explanation = "It's the LEGB rule: from the closest scope to the most general."

[[questions]]
text = "A closure does `events.append(e)` on an outer list, without reassigning it. Does it need `nonlocal`?"
options = [
  "Yes, whenever it modifies something outside",
  "No: it mutates the object without reassigning the name",
  "Yes, but `global`, not `nonlocal`",
  "No, because lists are global",
]
correct = 1
explanation = "`nonlocal` is only needed to **reassign** the name. Calling a method that mutates the object isn't an assignment."

[[questions]]
text = "Which is a correct way to build `[lambda: 0, lambda: 1, lambda: 2]` with a loop?"
options = [
  "`[lambda: i for i in range(3)]`",
  "`[lambda i=i: i for i in range(3)]`",
  "`[lambda: (i) for i in range(3)]`",
  "`[lambda: copy(i) for i in range(3)]`",
]
correct = 1
explanation = "The default argument is evaluated when the lambda is **defined**, so each one freezes the value `i` had at that moment."
