[[questions]]
text = "What are you passing to `sorted` with `sorted(xs, key=len())`?"
options = [
  "The `len` function",
  "The result of calling `len` with no arguments, which raises `TypeError`",
  "A lambda",
  "Nothing: `key` is ignored",
]
correct = 1
explanation = "Parentheses *call* the function. `key` expects the function itself: `key=len`."

[[questions]]
text = "What does `partial(int, base=16)(\"ff\")` return?"
options = ["`'ff'`", "`255`", "`16`", "Raises `TypeError`"]
correct = 1
explanation = "`partial` fixes `base=16`, so the call is equivalent to `int(\"ff\", base=16)`, which is 255."

[[questions]]
text = "Why shouldn't you write `double = lambda x: x * 2`?"
options = [
  "Because lambdas are slower",
  "Because if you're going to name it, a `def` shows its name in tracebacks, supports a docstring and is the idiomatic choice",
  "Because lambdas can't return values",
  "Because it's a syntax error",
]
correct = 1
explanation = "Lambdas are for short functions passed as arguments. Assigned to a name, it's a worse `def` (ruff flags it with E731)."

[[questions]]
text = "What's the advantage of dispatching with `OPERATIONS[op](a, b)` over an `if/elif` chain?"
options = [
  "It's the only way to use the `operator` module",
  "Adding a case means adding an entry to the dict, without touching the logic",
  "It avoids having to handle errors",
  "It's required in Python 3",
]
correct = 1
explanation = "It separates the data (the operations table) from the logic. Plus, the dict can be extended or injected from outside."

[[questions]]
text = "What makes an object *callable*?"
options = [
  "Inheriting from `function`",
  "Having a `__call__` method",
  "Being decorated with `@callable`",
  "Having a `__name__` attribute",
]
correct = 1
explanation = "Any object whose class defines `__call__` can be called with parentheses. Functions, classes and `partial` objects all qualify."
