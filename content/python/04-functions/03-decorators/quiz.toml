[[questions]]
text = "What is `@deco` above `def f(): ...` equivalent to?"
options = ["`f = deco`", "`f = deco(f)`", "`f = deco(f())`", "`deco = f(deco)`"]
correct = 1
explanation = "The decorator receives the function, and whatever it returns replaces the original name."

[[questions]]
text = "A decorator without `functools.wraps`: what does `decorated_function.__name__` return?"
options = [
  "The original name",
  "The inner function's name, for example `'wrapper'`",
  "`None`",
  "Raises `AttributeError`",
]
correct = 1
explanation = "Without `wraps`, what you're left with is the wrapper with its own metadata. `wraps` copies `__name__`, `__doc__` and the rest from the original."

[[questions]]
text = "A decorated function started returning `None` instead of its result. What's the most likely cause?"
options = [
  "`functools.wraps` is missing",
  "The wrapper calls `func(*args, **kwargs)` but doesn't `return` the result",
  "The `**kwargs` are missing",
  "The decorator was applied twice",
]
correct = 1
explanation = "The wrapper has to return whatever the original function returns. If it doesn't, it returns `None`."

[[questions]]
text = "With `@a` on top and `@b` below, over `def f`, what do you get?"
options = ["`f = b(a(f))`", "`f = a(b(f))`", "`f = a(f); f = b(f)` in parallel", "Error: they can't be stacked"]
correct = 1
explanation = "They're applied bottom to top: first `b`, and the result is passed to `a`."

[[questions]]
text = "What requirement do the arguments of a function decorated with `@functools.cache` have?"
options = [
  "They must be numbers",
  "They must be hashable",
  "They must be passed by keyword",
  "None",
]
correct = 1
explanation = "The arguments form the key of the cache dictionary, so they must be hashable. A list as an argument raises `TypeError`."
