[[questions]]
text = "What does `[x for row in [[1, 2], [3]] for x in row]` return?"
options = ["`[[1, 2], [3]]`", "`[1, 2, 3]`", "`NameError`", "`[3, 1, 2]`"]
correct = 1
explanation = "Two consecutive `for` clauses read like nested loops in the same order: first `row`, then `x`. The result is flattened."

[[questions]]
text = "Which of these expressions is a **generator** rather than a collection?"
options = ["`[x * 2 for x in xs]`", "`{x * 2 for x in xs}`", "`(x * 2 for x in xs)`", "`{x: x * 2 for x in xs}`"]
correct = 2
explanation = "Parentheses give you a *generator expression*: it produces values one at a time and builds nothing in memory. There is no such thing as a \"tuple comprehension\"."

[[questions]]
text = "You want to replace negatives with 0 and leave everything else alone. Which expression is correct?"
options = [
  "`[x for x in xs if x >= 0 else 0]`",
  "`[0 if x < 0 else x for x in xs]`",
  "`[x for x in xs if x >= 0]`",
  "`[if x < 0: 0 else: x for x in xs]`",
]
correct = 1
explanation = "To **transform** every element, the `if/else` goes at the front as a conditional expression. The trailing `if` only **filters** and doesn't accept `else`."

[[questions]]
text = "What does `{len(p): p for p in [\"ab\", \"cd\", \"e\"]}` return?"
options = ["`{2: 'ab', 1: 'e'}`", "`{2: 'cd', 1: 'e'}`", "`{2: ['ab', 'cd'], 1: ['e']}`", "Raises `KeyError` for a duplicate key"]
correct = 1
explanation = "In a dict, when a key repeats, the last assignment wins: `'cd'` overwrites `'ab'`."

[[questions]]
text = "In which of these cases is a plain `for` loop better than a comprehension?"
options = [
  "To build a list with the squares of the even numbers",
  "To send an email to each user (a side effect)",
  "To build an `id -> object` dict",
  "To compute a total with `sum(...)`",
]
correct = 1
explanation = "Comprehensions are for *building* values. Using one just for its side effect creates a list of `None` that nobody uses and confuses whoever reads the code."
