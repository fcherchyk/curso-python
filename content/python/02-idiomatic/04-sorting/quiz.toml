[[questions]]
text = "After `xs = [3, 1, 2]` and `xs = xs.sort()`, what is `xs`?"
options = ["`[1, 2, 3]`", "`[3, 1, 2]`", "`None`", "Raises `AttributeError`"]
correct = 2
explanation = "`list.sort()` sorts in place and returns `None`. By reassigning, you lose the list."

[[questions]]
text = "Which `key` sorts by age **descending** and, for equal ages, by name **ascending**?"
options = [
  "`key=lambda p: (p.age, p.name), reverse=True`",
  "`key=lambda p: (-p.age, p.name)`",
  "`key=lambda p: (p.age, -p.name)`",
  "`key=lambda p: -p.age + p.name`",
]
correct = 1
explanation = "Negating the numeric key reverses only that key. `reverse=True` would also reverse the name, and you can't negate a string."

[[questions]]
text = "What does it mean that Python's sort is **stable**?"
options = [
  "It never raises exceptions",
  "Elements with the same key keep their original relative order",
  "It always takes the same time regardless of the data",
  "It doesn't modify the original list",
]
correct = 1
explanation = "Stability is what lets you sort in several passes: first by the secondary criterion and then by the primary one."

[[questions]]
text = "What does `sorted(rows, key=itemgetter(\"country\", \"city\"))` return?"
options = [
  "The rows sorted by `country` only",
  "The rows sorted by `country` and, on ties, by `city`",
  "A list of `(country, city)` tuples",
  "Raises `TypeError` because `itemgetter` takes a single key",
]
correct = 1
explanation = "With several keys, `itemgetter` returns a tuple, and tuples are compared element by element. What gets sorted is still the full rows."

[[questions]]
text = "You need the most expensive product from a list of 1 million. What's the best choice?"
options = [
  "`sorted(products, key=price)[-1]`",
  "`max(products, key=price)`",
  "`products.sort(); products[-1]`",
  "`sorted(products, reverse=True)[0]`",
]
correct = 1
explanation = "`max` goes through the list once, in O(n), without sorting or copying. Sorting costs O(n log n), and the last option doesn't even use the price."
