[[questions]]
text = "What does `list(zip([1, 2, 3], \"ab\"))` return?"
options = [
  "`[(1, 'a'), (2, 'b'), (3, None)]`",
  "`[(1, 'a'), (2, 'b')]`",
  "Raises `ValueError`",
  "`[(1, 2, 3), ('a', 'b')]`",
]
correct = 1
explanation = "Without `strict`, `zip` stops at the shortest sequence without warning. With `strict=True` it would raise `ValueError`."

[[questions]]
text = "What does `for i, x in enumerate(\"ab\", start=1): print(i, x)` print?"
options = ["`0 a` and `1 b`", "`1 a` and `2 b`", "`1 b`", "`a 1` and `b 2`"]
correct = 1
explanation = "`start` changes the number counting starts from. It doesn't skip elements."

[[questions]]
text = "What is the value of `all([])`?"
options = ["`False`", "`True`", "`None`", "Raises `ValueError`"]
correct = 1
explanation = "An empty collection has no falsy element, so `all` returns `True`. On the other hand, `any([])` returns `False`."

[[questions]]
text = "You have `pairs = [(\"a\", 1), (\"b\", 2)]`. Which expression gives you `('a', 'b')` and `(1, 2)`?"
options = ["`zip(pairs)`", "`zip(*pairs)`", "`dict(pairs)`", "`enumerate(pairs)`"]
correct = 1
explanation = "`zip(*pairs)` passes each pair as a separate argument and `zip` groups them by position: it's the inverse of `zip`."

[[questions]]
text = "Why is `pairwise(xs)` preferable to `zip(xs, xs[1:])`?"
options = [
  "Because it returns lists instead of tuples",
  "Because it works with any iterable (generators included) and doesn't copy the sequence",
  "Because it includes the last element paired with `None`",
  "Because it's the only form that preserves order",
]
correct = 1
explanation = "`xs[1:]` needs a sequence that can be sliced, and it also creates a copy. `pairwise` works lazily on any iterable."
