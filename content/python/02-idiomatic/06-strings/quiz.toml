[[questions]]
text = "What does `\"https://site.com\".strip(\"https://\")` return?"
options = ["`'site.com'`", "`'ite.com'`", "`'https://site.com'`", "Raises `ValueError`"]
correct = 1
explanation = "`strip` removes **characters** in the set `{h, t, p, s, :, /}` from both ends, not a prefix. It also eats the `s` in `site`. For a prefix, use `removeprefix`."

[[questions]]
text = "How do you format `1234.5` as `'1,234.50'`?"
options = ["`f\"{x:.2}\"`", "`f\"{x:,.2f}\"`", "`f\"{x:2f,}\"`", "`f\"{x:.2f,}\"`"]
correct = 1
explanation = "In the spec, the thousands separator (`,`) comes first, followed by the precision and type (`.2f`)."

[[questions]]
text = "What does `\"no-equals\".partition(\"=\")` return?"
options = [
  "Raises `ValueError`",
  "`['no-equals']`",
  "`('no-equals', '', '')`",
  "`('', '', 'no-equals')`",
]
correct = 2
explanation = "`partition` always returns 3 elements. If the separator isn't found, the missing parts are empty strings. That's why unpacking it never fails."

[[questions]]
text = "Why is `\"\".join(parts)` better than `s += part` inside a loop?"
options = [
  "Because `+=` doesn't work with strings",
  "Because strings are immutable and each `+=` may copy everything: the cost becomes quadratic",
  "Because `join` sorts the parts",
  "There's no difference: CPython always optimizes it",
]
correct = 1
explanation = "Since a `str` can't be modified, each concatenation may create a new string with everything before it. `join` computes the total size and copies each part only once."

[[questions]]
text = "What does `x = 42; print(f\"{x=}\")` print?"
options = ["`42`", "`x=42`", "`{x=}`", "`x = 42`"]
correct = 1
explanation = "The `=` specifier (3.8+) prints the expression and its value, which is very handy for debugging. With spaces, `{x = }`, the spaces are preserved."
