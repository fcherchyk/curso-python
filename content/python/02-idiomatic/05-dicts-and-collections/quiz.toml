[[questions]]
text = "With an empty `d = defaultdict(list)`, what happens after evaluating `if d[\"x\"]: ...`?"
options = [
  "Raises `KeyError`",
  "Nothing: `d` is still empty",
  "`d` now has the key `\"x\"` with `[]`",
  "`d[\"x\"]` is `None`",
]
correct = 2
explanation = "Accessing a missing key of a `defaultdict` with `[]` calls the factory and **inserts** the key. To check without modifying, use `in` or `.get()`."

[[questions]]
text = "What does `Counter(\"hello\")[\"z\"]` return?"
options = ["`None`", "`0`", "Raises `KeyError`", "`Counter()`"]
correct = 1
explanation = "A `Counter` returns 0 for missing elements and, unlike `defaultdict`, doesn't insert them."

[[questions]]
text = "What's the problem with `dict.fromkeys([\"a\", \"b\"], [])`?"
options = [
  "Raises `TypeError` because lists aren't hashable",
  "Both keys share the **same** list",
  "It creates the keys in reverse order",
  "None: it's the recommended way",
]
correct = 1
explanation = "`fromkeys` uses the same object as the value for every key. If you append to `d[\"a\"]`, it also shows up in `d[\"b\"]`. Use `{k: [] for k in keys}`."

[[questions]]
text = "With `stock = Counter(a=2)` and `order = Counter(a=3, b=1)`, what is `order - stock`?"
options = [
  "`Counter({'a': 1, 'b': 1})`",
  "`Counter({'a': -1})`",
  "`Counter({'b': 1})`",
  "`Counter({'a': 1, 'b': 1, 'c': 0})`",
]
correct = 0
explanation = "`Counter` subtraction deducts counts and drops results <= 0. What's left is what's missing: one `a` and one `b`."

[[questions]]
text = "Why is it better to return `dict(groups)` instead of the `defaultdict` itself?"
options = [
  "Because a `defaultdict` can't be serialized to JSON",
  "Because whoever receives it could create keys by accident when reading with `[]`",
  "Because `dict` is faster to read",
  "Because `defaultdict` doesn't keep order",
]
correct = 1
explanation = "The \"create on read\" behavior is useful while you build the result, but it's a surprise for whoever uses it afterwards."
