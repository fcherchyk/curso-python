[[questions]]
text = "What is the value of `middle` after `a, *middle, b = (1, 2, 3, 4)`?"
options = ["`(2, 3)`", "`[2, 3]`", "`2`", "`[1, 2, 3]`"]
correct = 1
explanation = "The starred name always gets a **list**, even when the source is a tuple."

[[questions]]
text = "What happens with `first, *rest = []`?"
options = [
  "`first` is `None` and `rest` is `[]`",
  "Raises `ValueError`",
  "`first` is `[]`",
  "Raises `IndexError`",
]
correct = 1
explanation = "`*rest` can end up empty, but each unstarred name needs one element. With no elements, it fails with `ValueError: not enough values to unpack`."

[[questions]]
text = "Given `defaults = {\"a\": 1, \"b\": 2}` and `cfg = {\"b\": 3}`, what does `defaults | cfg` return?"
options = [
  "`{'a': 1, 'b': 2}`",
  "`{'a': 1, 'b': 3}` and it also modifies `defaults`",
  "`{'a': 1, 'b': 3}` without modifying either one",
  "`TypeError`: dicts don't support `|`",
]
correct = 2
explanation = "`|` (3.9+) creates a new dict where the right side overwrites the left. The in-place version is `|=`."

[[questions]]
text = "Given `def f(a, b, c)` and `args = [1, 2]`, which call is valid?"
options = ["`f(args, c=3)`", "`f(*args, c=3)`", "`f(**args, c=3)`", "`f(*args, *3)`"]
correct = 1
explanation = "`*args` expands the list into positional arguments (`a=1`, `b=2`) and `c` is passed by name. `**` is for expanding dicts, not lists."

[[questions]]
text = "Why does `a, b = b, a` work without a temporary variable?"
options = [
  "Because Python assigns from right to left",
  "Because the tuple `(b, a)` is evaluated first with the old values and assigned afterwards",
  "Because `a` and `b` become the same reference",
  "It only works with integers",
]
correct = 1
explanation = "The right-hand expression is fully evaluated before any assignment: a tuple with the original values is built and then unpacked."
