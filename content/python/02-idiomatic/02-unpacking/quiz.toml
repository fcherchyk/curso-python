[[questions]]
text = "¿Cuánto vale `medio` después de `a, *medio, b = (1, 2, 3, 4)`?"
options = ["`(2, 3)`", "`[2, 3]`", "`2`", "`[1, 2, 3]`"]
correct = 1
explanation = "El nombre con asterisco siempre recibe una **lista**, aunque el origen sea una tupla."

[[questions]]
text = "¿Qué pasa con `primero, *resto = []`?"
options = [
  "`primero` vale `None` y `resto` vale `[]`",
  "Levanta `ValueError`",
  "`primero` vale `[]`",
  "Levanta `IndexError`",
]
correct = 1
explanation = "El `*resto` puede quedar vacío, pero los nombres sin asterisco necesitan un elemento cada uno. Sin elementos, falla con `ValueError: not enough values to unpack`."

[[questions]]
text = "Dado `defaults = {\"a\": 1, \"b\": 2}` y `cfg = {\"b\": 3}`, ¿qué devuelve `defaults | cfg`?"
options = [
  "`{'a': 1, 'b': 2}`",
  "`{'a': 1, 'b': 3}` y además modifica `defaults`",
  "`{'a': 1, 'b': 3}` sin modificar ninguno",
  "`TypeError`: los dicts no soportan `|`",
]
correct = 2
explanation = "`|` (3.9+) crea un dict nuevo en el que la derecha pisa a la izquierda. El que modifica en el lugar es `|=`."

[[questions]]
text = "Si `def f(a, b, c)` y `args = [1, 2]`, ¿qué llamada es válida?"
options = ["`f(args, c=3)`", "`f(*args, c=3)`", "`f(**args, c=3)`", "`f(*args, *3)`"]
correct = 1
explanation = "`*args` expande la lista en posicionales (`a=1`, `b=2`) y `c` se pasa por nombre. `**` sirve para expandir dicts, no listas."

[[questions]]
text = "¿Por qué funciona `a, b = b, a` sin una variable temporal?"
options = [
  "Porque Python asigna de derecha a izquierda",
  "Porque primero se evalúa la tupla `(b, a)` con los valores viejos y después se asigna",
  "Porque `a` y `b` pasan a ser la misma referencia",
  "Solo funciona con enteros",
]
correct = 1
explanation = "La expresión de la derecha se evalúa completa antes de cualquier asignación: se arma una tupla con los valores originales y después se desempaqueta."
