[[questions]]
text = "How does a test receive a fixture named `users`?"
options = [
  "By importing it from the module",
  "By declaring a parameter named `users`",
  "By calling `users()` inside the test",
  "With the `@uses(users)` decorator",
]
correct = 1
explanation = "pytest injects fixtures by parameter name. Fixtures from `conftest.py` don't even need to be imported."

[[questions]]
text = "In a fixture with `yield`, when does the code after the `yield` run?"
options = [
  "Only if the test passes",
  "After the test, even if it fails (it's the teardown)",
  "Before the test",
  "Never",
]
correct = 1
explanation = "What comes before the `yield` is the setup and what comes after is the cleanup, which runs no matter what happens to the test."

[[questions]]
text = "What does `m.get_json.side_effect = KeyError(\"x\")` do on a `Mock`?"
options = [
  "Makes `m.get_json(...)` return a `KeyError`",
  "Makes `m.get_json(...)` raise `KeyError`",
  "Checks that a `KeyError` was raised",
  "Nothing: `side_effect` only accepts functions",
]
correct = 1
explanation = "If `side_effect` is an exception (or an exception class), the mock raises it when called."

[[questions]]
text = "What makes a function easy to test without touching the network?"
options = [
  "Using `httpx` instead of `requests`",
  "Receiving the HTTP client as a parameter (dependency injection)",
  "Being async",
  "Having a docstring",
]
correct = 1
explanation = "If the dependency is passed in, the test hands it a fake or a mock. If it's hidden inside, you have to patch it."

[[questions]]
text = "Which built-in fixture do you use to write and read files in a test?"
options = ["`capsys`", "`tmp_path`", "`monkeypatch`", "`caplog`"]
correct = 1
explanation = "`tmp_path` gives each test a `Path` to a unique temporary directory, which pytest cleans up afterwards."
