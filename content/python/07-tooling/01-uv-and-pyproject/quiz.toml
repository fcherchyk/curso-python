[[questions]]
text = "What's the difference between `pyproject.toml` and `uv.lock`?"
options = [
  "They're the same thing in different formats",
  "`pyproject.toml` declares acceptable ranges; `uv.lock` records the exact installed versions (including transitive ones)",
  "`uv.lock` is for development and `pyproject.toml` is for production",
  "`uv.lock` is edited by hand",
]
correct = 1
explanation = "The lock makes the environment reproducible: `uv sync` installs exactly the same thing on any machine."

[[questions]]
text = "Does `uv.lock` go into version control?"
options = ["Yes, always", "No, never", "Only for libraries", "Only if there are development dependencies"]
correct = 0
explanation = "The lock has to be in git so the whole team and CI use the same versions."

[[questions]]
text = "What does `uv run pytest` do?"
options = [
  "Installs pytest globally",
  "Syncs the project environment if needed and runs pytest inside it",
  "Runs pytest with the system Python",
  "Creates a new project",
]
correct = 1
explanation = "`uv run` makes sure `.venv` is up to date with the lock and runs the command in that environment, without activating it by hand."

[[questions]]
text = "What range does `~=2.4` accept?"
options = ["Only 2.4", "`>=2.4, <3.0`", "`>=2.4, <2.5`", "Any version"]
correct = 1
explanation = "The compatible-release operator `~=` pins everything except the last component given: `~=2.4` is `>=2.4, <3.0`."

[[questions]]
text = "Where do pytest, ruff and mypy go in a modern project?"
options = [
  "In `[project] dependencies`",
  "In `[dependency-groups] dev`",
  "In `requirements.txt`",
  "In `[tool.pytest]`",
]
correct = 1
explanation = "They're development dependencies: you don't need them to run the application. `uv add --dev` adds them to the `dev` group."
