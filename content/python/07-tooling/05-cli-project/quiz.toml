[[questions]]
text = "Why does `main` take `argv` as a parameter instead of reading `sys.argv` directly?"
options = [
  "Because `sys.argv` is deprecated",
  "So tests can call `main([...])` without launching a subprocess",
  "Because argparse requires it",
  "To make it faster",
]
correct = 1
explanation = "With `argv=None`, argparse uses `sys.argv[1:]` in production, and tests pass a list. The CLI becomes as testable as a regular function."

[[questions]]
text = "Where should a CLI send its error messages?"
options = ["To stdout", "To stderr", "Always to a log file", "Nowhere: only the exit code"]
correct = 1
explanation = "That way, redirecting the output (`> report.txt`) doesn't mix errors with the result. You should also return a nonzero exit code."

[[questions]]
text = "What does `(?P<status>\\d{3})` add to a regex?"
options = [
  "It makes the search faster",
  "It creates a named group: you access it with `m[\"status\"]`",
  "It validates that the status is an int",
  "It's required to use `re.compile`",
]
correct = 1
explanation = "Named groups make the code that uses the match readable and don't depend on the group's position."

[[questions]]
text = "Why does `InvalidLine` inherit from `ValueError`?"
options = [
  "Because custom exceptions must inherit from `ValueError`",
  "So code that already catches `ValueError` keeps catching it, with a more specific type available",
  "So it doesn't show up in the traceback",
  "It has no effect",
]
correct = 1
explanation = "Inheriting from the closest standard exception keeps compatibility while letting you catch just `InvalidLine` when needed."

[[questions]]
text = "When reporting latencies, why is p95 preferred over the average?"
options = [
  "Because it's easier to compute",
  "Because a few extreme values distort the average; p95 tells you how long 95% of requests take",
  "Because the average doesn't exist for integers",
  "Because p95 is always lower",
]
correct = 1
explanation = "Latencies have long tails. Percentiles describe the real user experience better than an average skewed by outliers."
