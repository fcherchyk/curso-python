[[questions]]
text = "Which family of ruff rules asks you to change `List[int]` to `list[int]`?"
options = ["`E`", "`F`", "`UP` (pyupgrade)", "`B`"]
correct = 2
explanation = "`UP` modernizes syntax according to `target-version`: generic built-in types, `X | None`, f-strings, etc."

[[questions]]
text = "`def f(d: dict[int, str], k: int) -> str: return d.get(k)`. What does mypy say?"
options = [
  "Nothing: it's fine",
  "Error: `d.get` returns `str | None` and the function promises `str`",
  "Syntax error",
  "Style warning",
]
correct = 1
explanation = "`dict.get` can return `None`. mypy detects that the return type doesn't match: it's a real bug if the key doesn't exist."

[[questions]]
text = "What does `mypy --strict` require, among other things?"
options = [
  "That the code is formatted",
  "That every function is fully annotated",
  "That no line is longer than 79 characters",
  "That there are tests",
]
correct = 1
explanation = "Strict mode includes `--disallow-untyped-defs`, among other checks: functions without annotations aren't allowed."

[[questions]]
text = "What's the right way to silence a single ruff rule?"
options = ["`# noqa`", "`# noqa: F401`", "`# ruff: ignore`", "`# type: ignore`"]
correct = 1
explanation = "Always with the rule code, so you don't hide other problems on the same line. `# type: ignore` is for mypy."

[[questions]]
text = "What is `ruff format --check` for?"
options = [
  "To format the files",
  "To check formatting without modifying anything (useful in CI)",
  "To check types",
  "To sort imports",
]
correct = 1
explanation = "With `--check`, ruff only reports whether a file isn't formatted and exits with an error, without touching it."
