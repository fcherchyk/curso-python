[[questions]]
text = "What does `pytest.raises(ValueError, match=\"month\")` do?"
options = [
  "Raises a `ValueError` with the message \"month\"",
  "Checks that the block raises `ValueError` and that the message contains (regex) \"month\"",
  "Ignores `ValueError`s in the block",
  "Checks that `ValueError` is NOT raised",
]
correct = 1
explanation = "The test fails if the exception isn't raised, if it's a different type, or if the message doesn't match the regex."

[[questions]]
text = "Why does pytest use plain `assert` instead of methods like `assertEqual`?"
options = [
  "Because it's faster",
  "Because it rewrites `assert` statements to show the values and the differences when they fail",
  "Because `assertEqual` doesn't exist in Python 3",
  "For compatibility with unittest",
]
correct = 1
explanation = "pytest rewrites the asserts in test modules to show intermediate values and differences. There's no assert API to learn."

[[questions]]
text = "You have 100% coverage on `is_leap_year` with the cases 2024 and 2023. What does that tell you?"
options = [
  "That the function is fully tested",
  "Only that the lines ran: the 100 and 400 rules could be wrong and the tests would stay green",
  "That no more tests are needed",
  "That there's a bug",
]
correct = 1
explanation = "Coverage measures execution, not verification. You need cases like 1900 and 2000 to kill the mutants of those rules."

[[questions]]
text = "What does `@pytest.mark.parametrize(\"x\", [1, 2, 3])` produce on a test?"
options = [
  "One test that receives the list `[1, 2, 3]`",
  "Three independent tests, one per value",
  "One test that runs three times and only reports the last one",
  "An error: `ids` is missing",
]
correct = 1
explanation = "Each value creates a separate test case, with its own result in the report (`test_x[1]`, `test_x[2]`…)."

[[questions]]
text = "Which pytest option runs only the tests that failed last time?"
options = ["`-x`", "`--lf`", "`-k`", "`-q`"]
correct = 1
explanation = "`--lf` (*last failed*) reuses the cache from the previous run. `-x` stops at the first failure and `-k` filters by name."
